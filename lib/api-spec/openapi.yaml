openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Next Level Dating Club API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: audits
    description: Profile audit operations
  - name: profiles
    description: Dating profile operations
  - name: messages
    description: Message coaching operations
  - name: insights
    description: Email insight import operations
  - name: waitlist
    description: Waitlist operations
  - name: ai
    description: AI integration status and diagnostics
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /claim-anonymous:
    post:
      tags: [Auth]
      operationId: claimAnonymousData
      summary: Claim audits, profiles, message sessions, and insights created anonymously in this browser
      description: |
        Reassigns rows with `userId IS NULL` whose IDs are passed in the body to the
        currently authenticated user. Only the IDs the client owns (tracked in
        localStorage) are eligible. Requires an authenticated session.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimAnonymousInput'
      responses:
        '200':
          description: Counts of rows successfully claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAnonymousResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /claim-anonymous/handoff/issue:
    post:
      tags: [Auth]
      operationId: issueAnonymousClaimHandoff
      summary: Mint a signed cross-device handoff token for the current anonymous browser
      description: |
        Issues a short-lived, HMAC-signed token derived from the caller's
        `anon_claim` cookie. The user can paste this token (or a link
        containing it) into another browser or device, sign in there, and call
        `redeemAnonymousClaimHandoff` to claim the audits, dating profiles,
        message coaching sessions, and email insights tied to the original
        anonymous browser — without needing the original cookie. The token
        expires automatically and is single-use in practice (a successful
        claim nulls the underlying anonymous token).
      responses:
        '200':
          description: A handoff token usable on another browser within the TTL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousClaimHandoff'
        '400':
          description: This browser has no anonymous claim cookie to hand off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /claim-anonymous/handoff/redeem:
    post:
      tags: [Auth]
      operationId: redeemAnonymousClaimHandoff
      summary: Claim anonymous data using a signed handoff token instead of the browser cookie
      description: |
        Verifies the handoff token's signature and expiry, then runs the same
        claim logic as `claimAnonymousData` — but scoped to the anonymous
        token embedded in the handoff rather than the browser's `anon_claim`
        cookie. Requires an authenticated session. Only rows whose
        `anonymous_claim_token` matches the signed value are reassigned.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemAnonymousClaimHandoffInput'
      responses:
        '200':
          description: Counts of rows successfully claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAnonymousResult'
        '400':
          description: The handoff token is malformed, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/export:
    get:
      tags: [Auth]
      operationId: exportMyData
      summary: Download all of the signed-in user's data as JSON
      description: |
        Returns a single JSON document containing the authenticated user's
        profile record plus every audit, dating profile, message coaching
        session, and email insight tied to that user. Intended to power a
        "Download my data" button on the account page.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Full export of the user's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/summary:
    get:
      tags: [Auth]
      operationId: getAccountSummary
      summary: Get counts of the signed-in user's data
      description: |
        Returns counts of the authenticated user's audits, dating profiles,
        message coaching sessions, and email insights. Used to show users
        exactly what they'd lose before confirming account deletion.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Counts of the user's stored data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/export/email:
    post:
      tags: [Auth]
      operationId: emailMyDataExport
      summary: Email the signed-in user a single-use link to download their data
      description: |
        Creates a short-lived, single-use token that the user can use to
        download the same JSON returned by `/account/export`, and emails a
        link containing that token to the user's account email address. The
        link expires after a short window and can only be used once.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Export email was queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailMyDataExportResult'
        '400':
          description: User has no email on file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/export/download/{token}:
    get:
      tags: [Auth]
      operationId: downloadEmailedExport
      summary: Download an emailed data export using a single-use token
      description: |
        Validates the token created by `/account/export/email`, marks it as
        used, and returns the same JSON document as `/account/export` for the
        user the token belongs to. Tokens are single-use and expire shortly
        after being created.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full export of the user's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '404':
          description: Token is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/sessions:
    get:
      tags: [Auth]
      operationId: listMySessions
      summary: List all active sign-ins for the current user
      description: |
        Returns every non-expired session belonging to the authenticated user,
        with rough device/browser, IP, and last-active timestamps so the user
        can recognize each one. The caller's current session is flagged with
        `current: true`. Useful for a "Devices & sessions" account page.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySessionsResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    delete:
      tags: [Auth]
      operationId: revokeOtherSessions
      summary: Revoke every session for the current user EXCEPT the caller's own
      description: |
        Deletes every active session for the authenticated user other than
        the session making this request. The caller stays signed in. Use this
        to sign out every other device after a suspicious sign-in.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Count of sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/sessions/{sid}:
    delete:
      tags: [Auth]
      operationId: revokeOneSession
      summary: Revoke a single session owned by the current user
      description: |
        Deletes one specific session, identified by its session id, as long
        as it belongs to the authenticated user. Revoked sessions stop
        working on the next request. Revoking the caller's own session is
        allowed and effectively signs them out.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Session does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account:
    delete:
      tags: [Auth]
      operationId: deleteMyAccount
      summary: Permanently delete the signed-in user's account and all data
      description: |
        Permanently removes the authenticated user along with every audit,
        dating profile, message coaching session, and email insight tied to
        that user. Also clears every active session for the user and the
        browser session cookie, effectively signing them out.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Account and all associated data were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMyAccountResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /push-tokens:
    post:
      tags: [Auth]
      operationId: registerPushToken
      summary: Register an Expo push token for the signed-in user
      description: |
        Stores an Expo push token server-side so the server can send
        proactive push notifications (e.g. expiring-audit reminders) even
        when the app is closed. Idempotent — re-registering the same token
        is a no-op.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenInput'
      responses:
        '200':
          description: Token registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPushTokenResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    delete:
      tags: [Auth]
      operationId: unregisterPushToken
      summary: Remove an Expo push token for the signed-in user
      description: |
        Deletes the given push token from the server so no further
        push notifications are sent to that device. Called when the user
        disables "Recently deleted reminders" or signs out.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token removed (or was not registered — either way, success).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnregisterPushTokenResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /audits:
    get:
      operationId: listAudits
      tags: [audits]
      summary: List all profile audits for current session
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [manual, screenshot]
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search across firstName and bio.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort order for results.
          schema:
            type: string
            enum: [newest, topScore]
            default: newest
        - name: scoreRange
          in: query
          required: false
          description: |
            Filter by readiness score band. `low` = <55, `medium` = 55-74,
            `high` = >=75. Audits without a score are excluded when set.
          schema:
            type: string
            enum: [low, medium, high]
        - name: limit
          in: query
          required: false
          description: Maximum number of audits to return (1-100). Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of audits to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audit"
    post:
      operationId: createAudit
      tags: [audits]
      summary: Create a new profile audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditInput"
      responses:
        "201":
          description: Created audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"

  /audits/{id}:
    get:
      operationId: getAudit
      tags: [audits]
      summary: Get a single audit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
        "404":
          description: Not found
    delete:
      operationId: deleteAudit
      tags: [audits]
      summary: Soft-delete an audit owned by the current session
      description: |
        Moves a single audit to the trash by setting its `deletedAt` timestamp.
        The audit is hidden from the regular list/summary endpoints but can
        still be retrieved or restored via `/audits/trash` and
        `/audits/{id}/restore`. Soft-deleted audits are auto-purged after
        30 days. Only the audit owner (matched by userId for authenticated
        requests, or anonymous session for guests) can delete it. Returns 404
        if the audit does not exist or is not owned by the caller.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAuditResult"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /audits/trash:
    get:
      operationId: listTrashedAudits
      tags: [audits]
      summary: List soft-deleted audits owned by the current session
      description: |
        Returns audits the caller has soft-deleted (set `deletedAt`) but which
        have not yet been auto-purged (rows older than 30 days are removed by
        a background job). Use this to power a "Recently deleted" view that
        lets users restore or permanently remove individual audits.
      responses:
        "200":
          description: List of soft-deleted audits, newest deletion first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audit"

  /audits/trash/expiring-soon:
    get:
      operationId: listExpiringTrashedAudits
      tags: [audits]
      summary: List trashed audits that are within a few days of being permanently purged
      description: |
        Returns soft-deleted audits owned by the caller that will be
        permanently purged within the next `withinDays` days (default 3,
        max 30). Used by clients to warn users — via push notification or
        an in-app banner — before their trash is auto-emptied. Audits are
        ordered by `deletedAt` ascending (earliest purge first). The
        `retentionDays` field exposes the server's purge window so clients
        can compute exact purge timestamps without hard-coding it.
      parameters:
        - name: withinDays
          in: query
          required: false
          description: Number of days of headroom to look ahead. Defaults to 3.
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 3
      responses:
        "200":
          description: Trashed audits about to be purged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiringTrashedAudits"

  /audits/{id}/restore:
    post:
      operationId: restoreAudit
      tags: [audits]
      summary: Restore a previously soft-deleted audit
      description: |
        Clears the audit's `deletedAt` timestamp so it reappears in the
        regular list. Only the audit owner can restore it. Returns 404 if
        the audit does not exist, is not owned by the caller, or has already
        been hard-purged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /audits/{id}/purge:
    delete:
      operationId: purgeAudit
      tags: [audits]
      summary: Permanently delete a soft-deleted audit
      description: |
        Hard-deletes a single audit from the trash. Only audits whose
        `deletedAt` is already set can be purged via this endpoint — use the
        regular DELETE `/audits/{id}` first to move an active audit to the
        trash. Returns 404 if the audit does not exist, is not owned by the
        caller, or has not been soft-deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAuditResult"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /audits/trash/empty:
    post:
      operationId: emptyTrash
      tags: [audits]
      summary: Permanently delete every soft-deleted audit owned by the caller
      description: |
        Hard-deletes every audit in the caller's trash (i.e. every audit
        owned by them whose `deletedAt` is set) in a single request. Only
        audits owned by the caller (matched by userId for authenticated
        requests, or anonymous session for guests) are affected. Active
        (non-trashed) audits are never touched. The response lists the ids
        that were actually purged.
      responses:
        "200":
          description: Trash emptied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyTrashResult"

  /audits/trash/restore-all:
    post:
      operationId: restoreAllTrash
      tags: [audits]
      summary: Restore every soft-deleted audit owned by the caller
      description: |
        Clears `deletedAt` on every audit in the caller's trash so they
        reappear in the active list. Only audits owned by the caller are
        affected. The response lists the ids that were actually restored.
      responses:
        "200":
          description: Trash restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreAllTrashResult"

  /audits/bulk-delete:
    post:
      operationId: bulkDeleteAudits
      tags: [audits]
      summary: Soft-delete multiple audits owned by the current session in one request
      description: |
        Moves a list of audits to the trash in a single round-trip by setting
        their `deletedAt` timestamps. Only audits owned by the caller
        (matched by userId for authenticated requests, or anonymous session
        for guests) are affected; ids that don't match or are already
        soft-deleted are silently skipped. The response lists the ids that
        were actually soft-deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteAuditsInput"
      responses:
        "200":
          description: Audits deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteAuditsResult"
        "400":
          description: Invalid request body

  /audits/{id}/correct-source-app:
    post:
      operationId: correctAuditSourceApp
      tags: [audits]
      summary: Record a user correction for a mis-detected source app
      description: |
        Called when the user indicates the source app shown on their report is
        wrong. Stores the mismatch in the audit's `ocrCorrections` field so the
        OCR learning pipeline can promote it to a rule after the configured
        occurrence threshold, and updates the audit's `sourceApp` to the value
        the user chose. Pass `null` for `correctedApp` to mark the app as unknown.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectSourceAppInput"
      responses:
        "200":
          description: Correction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectSourceAppResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Audit not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/{id}/generate:
    post:
      operationId: generateAuditReport
      tags: [audits]
      summary: Generate AI profile audit report for an audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReport"

  /audits/{id}/versions:
    get:
      operationId: listAuditReportVersions
      tags: [audits]
      summary: List every regeneration of a single audit's report
      description: |
        Returns the chronological log of report versions for an audit — one
        entry per generation, newest first. Each entry includes the readiness
        score at that point, the stored report, and (for regenerations) the
        change summary diff vs the immediately prior run. Used to render a
        regeneration timeline on the audit detail page.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of report versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReportVersionList"
        "404":
          description: Audit not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/{id}/versions/{versionId}:
    get:
      operationId: getAuditReportVersion
      tags: [audits]
      summary: Fetch a single historical report version for an audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single historical report version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReportVersion"
        "404":
          description: Audit or version not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/extract-screenshot:
    post:
      operationId: extractScreenshot
      tags: [audits]
      summary: OCR a profile screenshot and return extracted fields for review
      description: |
        Accepts a base64-encoded screenshot of a dating profile and returns the
        OCR-extracted firstName, age, sourceApp, bio and prompts. No audit is
        persisted — the client should let the user correct any mistakes and then
        call /audits/from-screenshot with the corrected values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotExtractInput"
      responses:
        "200":
          description: Extracted profile fields from the screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotExtractResult"
        "400":
          description: Invalid image or no readable text found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/from-screenshot:
    post:
      operationId: auditFromScreenshot
      tags: [audits]
      summary: Run an audit on profile text from a screenshot (optionally corrected)
      description: |
        Accepts either a base64-encoded screenshot or the corrected fields the user
        confirmed from a prior /audits/extract-screenshot call. When `bio` (and
        optionally `prompts`) are provided, OCR is skipped and the audit runs on
        the supplied values directly. The corrected values are what gets persisted
        to the audit record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotAuditInput"
      responses:
        "200":
          description: Generated mini-report from the screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotAuditReport"
        "400":
          description: Invalid image or no readable text found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /meta/engine:
    get:
      operationId: getEngineMeta
      tags: [health]
      summary: Get the current deterministic engine version
      description: |
        Returns the version tag of the deterministic audit engine currently
        running on the server. Clients compare this against the `engineVersion`
        stored on a saved report to decide whether the report is stale.
      responses:
        "200":
          description: Current engine metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineMeta"

  /audits/summary:
    get:
      operationId: getAuditSummary
      tags: [audits]
      summary: Get aggregate summary of user audits (scores, trends)
      responses:
        "200":
          description: Audit summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSummary"

  /profiles:
