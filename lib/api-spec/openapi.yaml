          type: string
          maxLength: 1000
          description: Optional one-line context the founder wants Echo to consider (a metric, a moment, a specific signup).

    AskFounderCopilotResult:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          description: Echo's reply, voiced per the persona rules.
        fallback:
          type: boolean
          description: True when the model was unavailable and the answer was assembled from the playbook deterministically.
        tokensUsed:
          type: integer
          description: Approximate tokens consumed by the model call, when reported by the provider.

    MatchPreferences:
      type: object
      required: [userId, ageMin, ageMax, distanceKm, genderPreference, dealBreakers, mustHaves, cityHint, updatedAt]
      properties:
        userId:
          type: string
        ageMin:
          type: [integer, 'null']
        ageMax:
          type: [integer, 'null']
        distanceKm:
          type: [integer, 'null']
        genderPreference:
          type: [string, 'null']
        dealBreakers:
          type: [array, 'null']
          items:
            type: string
        mustHaves:
          type: [array, 'null']
          items:
            type: string
        cityHint:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time

    MatchPreferencesInput:
      type: object
      properties:
        ageMin:
          type: [integer, 'null']
          minimum: 18
          maximum: 120
        ageMax:
          type: [integer, 'null']
          minimum: 18
          maximum: 120
        distanceKm:
          type: [integer, 'null']
          minimum: 0
          maximum: 20000
        genderPreference:
          type: [string, 'null']
          maxLength: 64
        dealBreakers:
          type: [array, 'null']
          items:
            type: string
            minLength: 1
            maxLength: 120
          maxItems: 50
        mustHaves:
          type: [array, 'null']
          items:
            type: string
            minLength: 1
            maxLength: 120
          maxItems: 50
        cityHint:
          type: [string, 'null']
          maxLength: 120

    MatchPoolMembership:
      type: object
      required: [userId, status, readyAt, pausedReason, tier, updatedAt]
      properties:
        userId:
          type: string
        status:
          type: string
          enum: [off, building, ready, paused, concierge_only]
        readyAt:
          type: [string, 'null']
          format: date-time
        pausedReason:
          type: [string, 'null']
        tier:
          type: [string, 'null']
          enum: [free, reset, wingman, null]
        updatedAt:
          type: string
          format: date-time

    MatchPoolMembershipInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [off, building, ready, paused]
        pausedReason:
          type: [string, 'null']
          maxLength: 280

    MatchProposal:
      type: object
      required: [id, userId, proposedToUserId, source, compatibilityScore, summary, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        proposedToUserId:
          type: [string, 'null']
        source:
          type: string
          enum: [internal, external_paste, concierge]
        compatibilityScore:
          type: integer
          minimum: 0
          maximum: 100
        summary:
          type: [string, 'null']
        status:
          type: string
          enum: [proposed, user_yes, user_no, mutual_yes, expired, completed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EchoMatchReadNextStep:
      type: object
      required: [label, href]
      properties:
        label:
          type: string
        href:
          type: string

    EchoMatchRead:
      type: object
      required: [headline, confidence, reading, idealMatch, radiusLabel, gapToPool, nextStep, usedAi]
      properties:
        headline:
          type: string
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: How confident Echo's read is, derived from signal coverage and readiness.
        reading:
          type: array
          description: What Echo can see in the user's accumulated signals (aggregate only).
          items:
            type: string
        idealMatch:
          type: array
          description: The kind of person Echo would put in front of them.
          items:
            type: string
        radiusLabel:
          type: string
          description: Human label for the search radius, e.g. "inside your 35-mile radius".
        gapToPool:
          type: integer
          minimum: 0
          maximum: 100
          description: Readiness points still needed to join the pool, 0 when eligible.
        nextStep:
          oneOf:
            - $ref: '#/components/schemas/EchoMatchReadNextStep'
            - type: 'null'
        usedAi:
          type: boolean
          description: True when the Claude layer produced this read, false on the deterministic baseline.

    MatchProposalResponseInput:
      type: object
      required: [interested]
      properties:
        interested:
          type: boolean
          description: True records the user's interest (user_yes), false passes (user_no).

    MatchExternalReadInput:
      type: object
      required: [profileText, source]
      properties:
        profileText:
          type: string
          minLength: 1
          maxLength: 20000
        source:
          type: string
          enum: [hinge, tinder, bumble, grindr, feeld, her, facebookDating, other]

    MatchExternalReadResult:
      type: object
      required: [score, highlights, frictions, summary]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        highlights:
          type: array
          items:
            type: string
        frictions:
          type: array
          items:
            type: string
        summary:
          type: [string, 'null']

    MatchReadinessBreakdown:
      type: object
      required: [compass, journal, wellness, hingeImport, postDate, wins, calendar, audits, coaching, instagram, lifePulse, taste, lifestyle, quizzes]
      properties:
        compass:
          type: integer
          minimum: 0
          maximum: 100
        journal:
          type: integer
          minimum: 0
          maximum: 100
        wellness:
          type: integer
          minimum: 0
          maximum: 100
        hingeImport:
          type: integer
          minimum: 0
          maximum: 100
        postDate:
          type: integer
          minimum: 0
          maximum: 100
        wins:
          type: integer
          minimum: 0
          maximum: 100
        calendar:
          type: integer
          minimum: 0
          maximum: 100
        audits:
          type: integer
          minimum: 0
          maximum: 100
        coaching:
          type: integer
          minimum: 0
          maximum: 100
        instagram:
          type: integer
          minimum: 0
          maximum: 100
        lifePulse:
          type: integer
          minimum: 0
          maximum: 100
        taste:
          type: integer
          minimum: 0
          maximum: 100
        lifestyle:
          type: integer
          minimum: 0
          maximum: 100
        quizzes:
          type: integer
          minimum: 0
          maximum: 100

    MatchReadiness:
      type: object
      required: [score, breakdown]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        breakdown:
          $ref: '#/components/schemas/MatchReadinessBreakdown'

    ReadinessNextAction:
      type: object
      required: [key, label, detail, points, href]
      properties:
        key:
          type: string
          description: Stable identifier for the signal this action strengthens.
        label:
          type: string
          description: Short imperative label, e.g. "Run a compass read".
        detail:
          type: string
          description: One spoken-English line on why this moves the needle.
        points:
          type: integer
          minimum: 0
          maximum: 100
          description: Approximate readiness points this action would add.
        href:
          type: string
          description: In-app route the user should go to.

    ReadinessHistoryPoint:
      type: object
      required: [day, score]
      properties:
        day:
          type: string
          description: Calendar day (YYYY-MM-DD, UTC) of the snapshot.
        score:
          type: integer
          minimum: 0
          maximum: 100

    OutcomeInsight:
      type: object
      required: [totalDates, anotherDate, noMore, ghosted, unsure, headline]
      properties:
        totalDates:
          type: integer
          minimum: 0
        anotherDate:
          type: integer
          minimum: 0
        noMore:
          type: integer
          minimum: 0
        ghosted:
          type: integer
          minimum: 0
        unsure:
          type: integer
          minimum: 0
        headline:
          type: string
          description: One spoken-English read of the user's recent date outcomes.

    MatchingState:
      type: object
      required: [preferences, poolStatus, tier, readiness, eligible, readinessThreshold, cityDensity, totalPoolCount, nextActions, history, outcomeInsight]
      properties:
        preferences:
          oneOf:
            - $ref: '#/components/schemas/MatchPreferences'
            - type: 'null'
        poolStatus:
          type: string
          enum: [off, building, ready, paused, concierge_only]
        tier:
          type: [string, 'null']
          enum: [free, reset, wingman, null]
        readiness:
          $ref: '#/components/schemas/MatchReadiness'
        eligible:
          type: boolean
          description: >-
            True when readiness.score is at or above readinessThreshold. The
            client uses this to gate the pool opt-in switch.
        readinessThreshold:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Minimum readiness score required to join the matching pool, set by
            the MATCHING_READINESS_THRESHOLD env var (default 50).
        cityDensity:
          type: integer
          minimum: 0
        totalPoolCount:
          type: integer
          minimum: 0
        nextActions:
          type: array
          description: >-
            Ranked "do this next" steps that would move readiness toward the
            threshold most. Empty when the user is already eligible.
          items:
            $ref: '#/components/schemas/ReadinessNextAction'
        history:
          type: array
          description: >-
            Daily readiness snapshots, oldest first, for the trend line. Up to
            ~30 points.
          items:
            $ref: '#/components/schemas/ReadinessHistoryPoint'
        outcomeInsight:
          $ref: '#/components/schemas/OutcomeInsight'
        activityStreak:
          $ref: '#/components/schemas/ActivityStreak'

    ActivityStreak:
      type: object
      description: >-
        A gamification lens on how consistently the user feeds any signal. Purely
        derived from activity history; it never affects the readiness score.
      required: [current, longest, activeToday, daysActiveLast14]
      properties:
        current:
          type: integer
          minimum: 0
          description: >-
            Consecutive active days ending today, or yesterday if today is not
            yet active. 0 once the run has lapsed.
        longest:
          type: integer
          minimum: 0
          description: Longest consecutive run of active days ever.
        activeToday:
          type: boolean
          description: True when the user has already fed a signal today (UTC).
        daysActiveLast14:
          type: integer
          minimum: 0
          maximum: 14
          description: How many of the last 14 days (inclusive of today) had activity.

    DatingWin:
      type: object
      required: [id, category, body, createdAt]
      properties:
        id:
          type: integer
        category:
          type: string
          enum: [sent-it, great-convo, got-a-date, noticed-something, personal-win]
        body:
          type: string
        createdAt:
          type: string

    DatingWinInput:
      type: object
      required: [category, body]
      properties:
        category:
          type: string
          enum: [sent-it, great-convo, got-a-date, noticed-something, personal-win]
        body:
          type: string
          minLength: 1
          maxLength: 2000

    MatchPoolIneligible:
      type: object
      required: [error, readinessScore, readinessThreshold]
      properties:
        error:
          type: string
        readinessScore:
          type: integer
          minimum: 0
          maximum: 100
        readinessThreshold:
          type: integer
          minimum: 0
          maximum: 100
