        latestOutcome:
          type: [string, "null"]
          description: Most recent recorded outcome, or null if no notes have one.
        totalWithOutcome:
          type: integer
          minimum: 0

    MirrorTrendJournalingStreak:
      type: object
      required: [currentStreakDays, daysInLast14, totalEntries]
      properties:
        currentStreakDays:
          type: integer
          minimum: 0
        daysInLast14:
          type: integer
          minimum: 0
          maximum: 14
        totalEntries:
          type: integer
          minimum: 0

    MirrorTrendMoodTrend:
