openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MatchLab Club API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: audits
    description: Profile audit operations
  - name: profiles
    description: Dating profile operations
  - name: messages
    description: Message coaching operations
  - name: insights
    description: Email insight import operations
  - name: waitlist
    description: Waitlist operations
  - name: ai
    description: AI integration status and diagnostics
  - name: rehearsal
    description: Relationship-conversation rehearsal operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /claim-anonymous:
    post:
      tags: [Auth]
      operationId: claimAnonymousData
      summary: Claim audits, profiles, message sessions, and insights created anonymously in this browser
      description: |
        Reassigns rows with `userId IS NULL` whose IDs are passed in the body to the
        currently authenticated user. Only the IDs the client owns (tracked in
        localStorage) are eligible. Requires an authenticated session.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimAnonymousInput'
      responses:
        '200':
          description: Counts of rows successfully claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAnonymousResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /claim-anonymous/handoff/issue:
    post:
      tags: [Auth]
      operationId: issueAnonymousClaimHandoff
      summary: Mint a signed cross-device handoff token for the current anonymous browser
      description: |
        Issues a short-lived, HMAC-signed token derived from the caller's
        `anon_claim` cookie. The user can paste this token (or a link
        containing it) into another browser or device, sign in there, and call
        `redeemAnonymousClaimHandoff` to claim the audits, dating profiles,
        message coaching sessions, and email insights tied to the original
        anonymous browser — without needing the original cookie. The token
        expires automatically and is single-use in practice (a successful
        claim nulls the underlying anonymous token).
      responses:
        '200':
          description: A handoff token usable on another browser within the TTL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousClaimHandoff'
        '400':
          description: This browser has no anonymous claim cookie to hand off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /claim-anonymous/handoff/redeem:
    post:
      tags: [Auth]
      operationId: redeemAnonymousClaimHandoff
      summary: Claim anonymous data using a signed handoff token instead of the browser cookie
      description: |
        Verifies the handoff token's signature and expiry, then runs the same
        claim logic as `claimAnonymousData` — but scoped to the anonymous
        token embedded in the handoff rather than the browser's `anon_claim`
        cookie. Requires an authenticated session. Only rows whose
        `anonymous_claim_token` matches the signed value are reassigned.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemAnonymousClaimHandoffInput'
      responses:
        '200':
          description: Counts of rows successfully claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAnonymousResult'
        '400':
          description: The handoff token is malformed, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /claim-anonymous/handoff/status:
    post:
      tags: [Auth]
      operationId: getAnonymousClaimHandoffStatus
      summary: Check whether a previously issued handoff link has been redeemed yet
      description: |
        Lightweight, idempotent status check for a handoff token. Verifies the
        signature so only the original holder can poll, and reports whether
        the token's `jti` has already been recorded in
        `handoff_token_redemptions` (i.e. someone has signed in on the other
        device and claimed the data). Used by the originating device's share
        dialog to surface a "transfer complete" state. Does not consume the
        token — calling this never blocks a future redeem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnonymousClaimHandoffStatusInput'
      responses:
        '200':
          description: Current status of the handoff link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousClaimHandoffStatus'
        '400':
          description: The handoff token is malformed, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/billing:
    get:
      tags: [Billing]
      operationId: getMyBilling
      summary: Return server-authoritative paid access state
      description: |
        Returns entitlements written from verified, idempotent Stripe webhook
        events. Browser redirects and query parameters never grant access.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current paid access and billing-management availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingState'
        '401':
          description: Sign-in required.

  /me/billing/checkout:
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      summary: Create an authenticated Stripe Checkout session
      description: |
        Requires the canonical product to be explicitly approved in the
        server-only live-products allowlist, uses server-owned price IDs, and
        stamps the signed-in user and product into Stripe metadata. Creating or
        returning from a session does not grant access; a verified payment
        webhook does.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCheckoutInput'
      responses:
        '201':
          description: Short-lived Stripe Checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '401':
          description: Sign-in required.
        '422':
          description: The account has no usable email.
        '503':
          description: Enrollment is closed, or Stripe/product configuration is incomplete.

  /me/billing/portal:
    post:
      tags: [Billing]
      operationId: createBillingPortal
      summary: Create a Stripe customer-portal session
      description: |
        Creates a short-lived portal URL for the signed-in account's Stripe
        customer. Subscription cancellation and payment-method changes happen
        there; signed webhooks update MatchLab access afterward.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '201':
          description: Short-lived Stripe billing-portal URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '401':
          description: Sign-in required.
        '404':
          description: No Stripe customer is linked to this account.
        '503':
          description: Stripe or the public application origin is not configured.

  /account/export:
    get:
      tags: [Auth]
      operationId: exportMyData
      summary: Download all of the signed-in user's data as JSON
      description: |
        Returns a single JSON document containing the authenticated user's
        account record plus the user-facing and derived data families tied to
        that user. Operational secrets such as session ids, OAuth tokens, push
        tokens, and single-use export tokens are intentionally excluded.
        Intended to power a "Download my data" button on the account page.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Full export of the user's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/summary:
    get:
      tags: [Auth]
      operationId: getAccountSummary
      summary: Get counts of the signed-in user's data
      description: |
        Returns counts of the authenticated user's audits, dating profiles,
        message coaching sessions, and email insights. Used to show users
        exactly what they'd lose before confirming account deletion.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Counts of the user's stored data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/consent:
    get:
      tags: [Auth]
      operationId: getMeConsent
      summary: Get the signed-in user's consent envelope
      description: |
        Returns a flat envelope of the signed-in user's content-sharing
        consents. Today this is just `aiContent` (the deep AI lane), but
        the shape is designed to grow as new consent gates land (push
        notifications, sharing with a coach, etc). The companion endpoint
        `/me/consent/ai-content` exposes the same boolean with separate
        grant and revoke timestamps for audit views.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current consent envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeConsent'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/instagram-paste:
    post:
      tags: [Auth]
      operationId: createInstagramPaste
      summary: Capture a copy-paste of the user's Instagram bio and captions
      description: |
        Persists a paste of the caller's Instagram bio plus a handful of
        recent captions into `imported_sources` with `source='instagram-paste'`
        and `status='complete'`. Saving is storage-only; Echo processing starts
        only after the member separately enables Echo use for this source.
        Anon-safe: if the request has no signed-in
        user, the row is stamped with the anonymous claim token cookie so
        it can be merged into the account later via the standard claim flow.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstagramPasteInput'
      responses:
        '201':
          description: Paste captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstagramPasteResult'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/source-paste:
    post:
      tags: [Auth]
      operationId: createSourcePaste
      summary: Capture a consent-first paste for a registry-backed connector
      description: |
        Generic capture surface for paste-based Connection Center connectors
        (taste, lifestyle, and any future paste source). Persists the pasted
        items into `imported_sources` tagged with the connector's `source`
        string and a derived item count in `parsedSummary.counts.items`, so the
        signal becomes eligible for matching only after the member separately
        enables matching use. The raw items are stored against the row but never
        sent to any prompt unless Echo use is separately enabled. The accepted
        `source` values are derived from the registry's
        paste-capturable entries, so adding a connector needs no edit here.
        Anon-safe: with no signed-in user, the row is stamped with the anonymous
        claim token cookie so it can be merged into the account later.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourcePasteInput'
      responses:
        '201':
          description: Paste captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSourcePasteResult'
        '400':
          description: Invalid body or unknown source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/voice-intro:
    post:
      tags: [Auth]
      operationId: createVoiceIntro
      summary: Capture derived acoustic metrics from a spoken voice intro
      description: |
        Records that the user recorded a short spoken intro and stores ONLY the
        derived acoustic metrics (length, energy, dynamics, pace, speech ratio)
        computed in the browser in the moment. The recording itself is never
        uploaded, stored, or transcribed. Persists the metrics into
        `imported_sources` with `source='voice-intro'` and a derived
        `parsedSummary.counts.items` of 1. Saving alone does not authorize Echo
        or matching. Echo may create a narrative read only after source-level
        Echo use is enabled, in addition to account-level content consent; the
        matching lane counts it only after matching use is enabled. Only the
        derived numbers can be sent to a prompt, never raw audio. Anon-safe: with
        no signed-in user, the row is
        stamped with the anonymous claim token cookie so it can be merged into
        the account later.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoiceIntroInput'
      responses:
        '201':
          description: Voice intro metrics captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVoiceIntroResult'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/receipts:
    get:
      tags: [Auth]
      operationId: getReceiptsInbox
      summary: Read the user's real-life receipts inbox
      description: |
        Returns the user's private receipts forwarding address, the running count
        of confirmations captured, and a small, capped list of the most recent
        receipts (sender, subject, and time only). The body of any email is never
        stored or returned. The count feeds the `receipts` lane of the living
        signal registry, so it nudges Match Readiness, the Mirror, and matching
        reasoning. Anon-safe: with no signed-in user, the inbox is scoped to the
        anonymous claim token cookie so it can be merged into the account later.
        When the inbox has not been activated yet, `handle` and `address` are
        null and the count is zero.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The current receipts inbox state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptsInbox'
    post:
      tags: [Auth]
      operationId: addReceipts
      summary: Add receipts manually by pasting their headers
      description: |
        Manually adds one or more real-life confirmations by their headers only
        (subject, optional sender, optional time). This is the easy import path
        that needs no email setup. The entries accumulate into the user's single
        receipts row: the running count drives the `receipts` signal lane, and a
        capped, most-recent list is kept for the user's own review. The body of
        any email is never accepted, stored, or sent to any prompt. Activates the
        inbox (mints a forwarding handle) on first use if needed. Anon-safe via
        the anonymous claim token cookie.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReceiptsInput'
      responses:
        '201':
          description: Receipts captured; returns the updated inbox state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptsInbox'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/receipts/activate:
    post:
      tags: [Auth]
      operationId: activateReceiptsInbox
      summary: Activate the user's receipts forwarding inbox
      description: |
        Mints a private forwarding handle for the user if they do not already
        have one and returns the inbox state including the full forwarding
        address. Idempotent: calling it again returns the existing handle rather
        than minting a new one. Anon-safe via the anonymous claim token cookie so
        the inbox can be merged into the account on login.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The activated receipts inbox state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptsInbox'

  /me/quiz-result:
    post:
      tags: [Auth]
      operationId: createQuizResult
      summary: Record a completed quiz as a derived Mirror signal
      description: |
        Accepts a canonical quiz slug plus answer-option indexes. The server
        validates the quiz identity and every option against the shared Quiz Lab
        catalog, scores the result deterministically, and derives the canonical
        archetype name and dimensions. It persists only that derived result into
        `imported_sources` tagged `source = "quiz"`; answer indexes are used only
        for the in-memory score and are never stored or sent to a prompt. Retakes
        are deduped. Anon-safe via the anonymous claim token cookie.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizResultInput'
      responses:
        '201':
          description: Quiz result captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQuizResultResult'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/care-dialect:
    get:
      tags: [Auth]
      operationId: getCareDialect
      summary: Get the signed-in user's Care Dialect profile, or a demo example
      description: |
        Returns the user's Care Dialect profile: the give and receive dialects
        they guessed for themselves, the server-scored tested distribution and top
        key per axis, and a deterministic self-vs-tested comparison. Signed-out
        callers get a clearly-flagged demo example so the page is never empty; the
        demo never reflects any real person. Only derived data is ever returned,
        never the raw quiz answers.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The Care Dialect profile, or a demo example for anon callers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareDialectProfile'
    post:
      tags: [Auth]
      operationId: saveCareDialect
      summary: Score and save the signed-in user's Care Dialect from quiz answers
      description: |
        Accepts the user's self-identified give and receive dialects plus their
        per-answer dialect choices for each axis. Scoring runs server-side: the
        answers are tallied into normalized distributions and a top key per axis,
        and only that derived result is stored, one row per user, upserted on
        retake. Raw answers are never stored or sent to any prompt. Requires
        authentication; anonymous callers get 401.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCareDialectInput'
      responses:
        '200':
          description: The saved, server-scored Care Dialect profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareDialectProfile'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/connectors:
    get:
      tags: [Auth]
      operationId: getConnectors
      summary: List the data connectors and their live status for the signed-in user
      description: |
        Returns one entry per data connector the product can hold (currently the
        calendar lane's read-only Google Calendar sync), with its lifecycle
        status, last sync and last success timestamps, last error code, and the
        derived signal count it currently contributes. Only product state and
        derived counts are returned, never raw third-party content. Signed-out
        callers get a clearly-flagged demo so the page is never empty. Live
        connect, sync, and disconnect controls are founder-gated and handled by
        separate founder endpoints; this endpoint is read-only status.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The connector status list, or a demo example for anon callers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsStatusResponse'

  /me/connectors/{provider}/sync:
    post:
      tags: [Auth]
      operationId: syncConnector
      summary: Sync a per-user OAuth connector for the signed-in user
      description: |
        Refreshes the access token if needed, reads the provider API read-only,
        reduces it to the derived signal count, and stores ONLY that count as a
        latest-wins import row feeding the connector's readiness lane. Requires
        the user to have connected this provider first. Only derived counts are
        stored, never raw third-party content.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: The connector provider key (e.g. strava, fitbit, exist, oura, trakt, github, reddit, discord, spotify).
      responses:
        '200':
          description: The updated connector status list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsStatusResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Unknown provider or not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '502':
          description: The provider sync failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '503':
          description: The connector is not configured on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/connectors/{provider}/disconnect:
    post:
      tags: [Auth]
      operationId: disconnectConnector
      summary: Disconnect a per-user OAuth connector for the signed-in user
      description: |
        Purges the user's derived import rows for this provider, deletes the
        sealed OAuth tokens, and marks the connection disconnected. The readiness
        lane immediately reflects the lower count. One toggle fully removes the
        source and its data.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: The connector provider key (e.g. strava, fitbit, exist, oura, trakt, github, reddit, discord, spotify).
      responses:
        '200':
          description: The updated connector status list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsStatusResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Unknown provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/referrals:
    get:
      tags: [Auth]
      operationId: getMyReferrals
      summary: Get the signed-in user's invite link and an honest reflection of who joined
      description: |
        Returns the authenticated user's personal invite code plus a
        privacy-respecting reflection of the people who joined from their
        invites and where each one is in the matching pool. Attribution comes
        from `users.invited_by_user_id` (first-touch, set at signup from the
        `mlc_ref` cookie). Only a display name (first name, never email) and a
        pool status are returned for each invitee, so the inviter sees who is
        in and their status without seeing any private data. The summary counts
        feed the "you grow the local pool" framing: more people you bring in
        near you raises everyone's match odds.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The user's invite code and referral reflection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeReferralsResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/consent/ai-content:
    get:
      tags: [Auth]
      operationId: getAiContentConsent
      summary: Get the signed-in user's AI content consent state
      description: |
        Returns whether the authenticated user has granted consent to send
        their own content (bios, messages, screenshots, journal entries) to
        the hosted LLM (Anthropic via Replit AI Integrations), plus the
        timestamps of the most recent grant and revoke events. When consent
        is absent, AI tools that opt into this gate fall back to deterministic
        output and never transmit user content to the model.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current consent state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiContentConsentState'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    post:
      tags: [Auth]
      operationId: setAiContentConsent
      summary: Grant or revoke the signed-in user's AI content consent
      description: |
        Sets the authenticated user's account-level AI content consent.
        Setting `granted: true` stamps `grantedAt = now()`. Setting
        `granted: false` stamps `revokedAt = now()` and immediately causes
        consent-gated AI tools to fall back to deterministic output on the
        next request.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAiContentConsentInput'
      responses:
        '200':
          description: Consent state after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiContentConsentState'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/digest-preferences:
    get:
      tags: [Auth]
      operationId: getDigestPreferences
      summary: Get the signed-in user's Mirror digest preferences
      description: |
        Returns the cadence the user has chosen for the proactive Mirror digest
        ("weekly", "biweekly", or "off") plus the timestamp of the most recent
        digest send. New users default to "weekly" until they change it.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current digest preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestPreferencesState'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    post:
      tags: [Auth]
      operationId: setDigestPreferences
      summary: Set the signed-in user's Mirror digest cadence
      description: |
        Sets how often the user receives the proactive Mirror digest. Choosing
        "off" stops all digest emails and nudges for the account. The change
        takes effect on the next scheduled run.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDigestPreferencesInput'
      responses:
        '200':
          description: Digest preferences after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestPreferencesState'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/export/email:
    post:
      tags: [Auth]
      operationId: emailMyDataExport
      summary: Email the signed-in user a single-use link to download their data
      description: |
        Creates a short-lived, single-use token that the user can use to
        download the same JSON returned by `/account/export`, and emails a
        link containing that token to the user's account email address. The
        link expires after a short window and can only be used once.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Export email was queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailMyDataExportResult'
        '400':
          description: User has no email on file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/export/download/{token}:
    get:
      tags: [Auth]
      operationId: downloadEmailedExport
      summary: Download an emailed data export using a single-use token
      description: |
        Validates the token created by `/account/export/email`, marks it as
        used, and returns the same JSON document as `/account/export` for the
        user the token belongs to. Tokens are single-use and expire shortly
        after being created.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full export of the user's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '404':
          description: Token is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/sessions:
    get:
      tags: [Auth]
      operationId: listMySessions
      summary: List all active sign-ins for the current user
      description: |
        Returns every non-expired session belonging to the authenticated user,
        with rough device/browser, IP, and last-active timestamps so the user
        can recognize each one. The caller's current session is flagged with
        `current: true`. Useful for a "Devices & sessions" account page.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySessionsResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    delete:
      tags: [Auth]
      operationId: revokeOtherSessions
      summary: Revoke every session for the current user EXCEPT the caller's own
      description: |
        Deletes every active session for the authenticated user other than
        the session making this request. The caller stays signed in. Use this
        to sign out every other device after a suspicious sign-in.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Count of sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/sessions/{sid}:
    delete:
      tags: [Auth]
      operationId: revokeOneSession
      summary: Revoke a single session owned by the current user
      description: |
        Deletes one specific session, identified by its session id, as long
        as it belongs to the authenticated user. Revoked sessions stop
        working on the next request. Revoking the caller's own session is
        allowed and effectively signs them out.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionsResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Session does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account:
    delete:
      tags: [Auth]
      operationId: deleteMyAccount
      summary: Permanently delete the signed-in user's account and all data
      description: |
        Permanently removes the authenticated user along with every audit,
        dating profile, message coaching session, and email insight tied to
        that user. Also clears every active session for the user and the
        browser session cookie, effectively signing them out.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Account and all associated data were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMyAccountResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/account/delete:
    post:
      tags: [Auth]
      operationId: deleteMyAccountConfirmed
      summary: GDPR delete the signed-in user's account and every row tied to it
      description: |
        Permanently removes the authenticated user and cascades the delete
        across every user-owned table in the database. The caller must POST
        a confirmation string equal to their own account email (lowercased)
        in the body, otherwise the request is rejected with 400. The entire
        delete runs inside a single transaction so the account either goes
        fully or not at all. On success the response lists row counts per
        table deleted, the session is destroyed, and the browser session
        cookie is cleared. Anonymous callers are rejected with 401.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountInput'
      responses:
        '200':
          description: Account and every row tied to it were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResult'
        '400':
          description: Confirmation string was missing or did not match the account email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '500':
          description: Delete failed and was rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/trust-ledger:
    get:
      tags: [Auth]
      operationId: getTrustLedger
      summary: Get the visible trust ledger of every signal the machine holds
      description: |
        Returns one entry per signal source the product can hold about the
        signed-in user, derived live from the signal registry and the same
        per-user counts that drive Match Readiness. Each entry carries where
        the data came from, what we see and what we never touch, how much we
        currently hold (count plus coverage), and whether it can be purged.
        Sources with nothing stored are still listed with `held: false` so the
        user sees the full picture of what the machine could know. Because the
        ledger is registry-derived, any newly registered signal source appears
        here automatically with no extra wiring. Anonymous callers are rejected
        with 401; the frontend shows a sample view instead.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The user's trust ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustLedger'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/trust-ledger/{id}:
    delete:
      tags: [Auth]
      operationId: purgeTrustSource
      summary: Purge every row behind one signal source
      description: |
        Permanently removes everything the machine holds for a single signal
        source, identified by its registry id. The delete runs inside one
        transaction so the source goes fully or not at all, and it drops that
        source's contribution to Match Readiness on the next read. Import-backed
        sources delete their stored import rows; first-party sources delete the
        rows in their dedicated table (audits also clear their report versions).
        Reuses the same hard-delete safeguards as account deletion. Unknown ids
        are rejected with 404; anonymous callers with 401.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          description: The signal registry id of the source to purge.
          schema:
            type: string
      responses:
        '200':
          description: The source was purged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeTrustSourceResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: No signal source matches the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /push-tokens:
    post:
      tags: [Auth]
      operationId: registerPushToken
      summary: Register an Expo push token for the signed-in user
      description: |
        Stores an Expo push token server-side so the server can send
        proactive push notifications (e.g. expiring-audit reminders) even
        when the app is closed. Idempotent — re-registering the same token
        is a no-op.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenInput'
      responses:
        '200':
          description: Token registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPushTokenResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    delete:
      tags: [Auth]
      operationId: unregisterPushToken
      summary: Remove an Expo push token for the signed-in user
      description: |
        Deletes the given push token from the server so no further
        push notifications are sent to that device. Called when the user
        disables "Recently deleted reminders" or signs out.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token removed (or was not registered — either way, success).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnregisterPushTokenResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /life-pulse:
    post:
      tags: [LifePulse]
      operationId: recordLifePulse
      summary: Record a daily life pulse (5 quick self-ratings)
      description: |
        Persists a single daily life pulse for the current user (or anonymous
        claim token scope). Each call inserts a new row; there is no upsert —
        users may pulse multiple times a day if they want to.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifePulseInput'
      responses:
        '201':
          description: Pulse recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifePulse'
        '400':
          description: Invalid pulse payload.
    get:
      tags: [LifePulse]
      operationId: getRecentLifePulses
      summary: Recent life pulses for the current scope
      description: |
        Returns the most recent life pulses (up to 30, newest first) along
        with a convenient `latest` pointer, for the current user or anonymous
        claim scope. Returns an empty array + null `latest` when none exist.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Recent pulses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifePulseRecent'

  /journal:
    get:
      tags: [mirror]
      operationId: listJournalEntries
      summary: List journal entries for the current scope
      description: |
        Returns the current user's (or anonymous-claim-scoped) journal entries.
        Active entries by default. Pass `view=trash` to list soft-deleted
        entries, or `view=all` to include both. Ordered newest first.
        Supports paging via `limit` + `offset`, and filtering by `tag` (any
        match) and by `dateFrom` / `dateTo` (inclusive bounds on
        `createdAt`, ISO-8601 timestamps).
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [active, trash, all]
            default: active
        - name: q
          in: query
          required: false
          description: Optional case-insensitive substring filter on prompt + body.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Filter to entries that carry this tag.
          schema:
            type: string
            maxLength: 40
        - name: dateFrom
          in: query
          required: false
          description: ISO-8601 inclusive lower bound on `createdAt`. Parsed server-side via `new Date(...)`.
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          description: ISO-8601 inclusive upper bound on `createdAt`. Parsed server-side via `new Date(...)`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryList"
    post:
      tags: [mirror]
      operationId: createJournalEntry
      summary: Create a journal entry
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Invalid payload

  /journal/{id}:
    patch:
      tags: [mirror]
      operationId: updateJournalEntry
      summary: Edit a journal entry (or restore from trash)
      description: |
        Partial-update of a journal entry. Pass `restore: true` to clear
        `deletedAt`. Only the entry owner can update.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryPatch"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Invalid payload
        "404":
          description: Not found
    delete:
      tags: [mirror]
      operationId: deleteJournalEntry
      summary: Soft-delete a journal entry
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Soft-deleted entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteJournalEntryResult"
        "404":
          description: Not found

  /journal/{id}/restore:
    post:
      tags: [mirror]
      operationId: restoreJournalEntry
      summary: Restore a soft-deleted journal entry
      description: |
        Clears `deletedAt` on the entry so it returns to the active list.
        Only the entry owner can restore. Idempotent — calling on an
        already-active entry succeeds and returns the entry unchanged.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found

  /post-date-notes:
    get:
      tags: [mirror]
      operationId: listPostDateNotes
      summary: List post-date notes for the current scope
      description: |
        Returns the current user's (or anonymous-claim-scoped) post-date
        notes. Active notes by default. Pass `view=trash` for trashed,
        `view=all` for both. Ordered by `dateAt` desc (fallback to
        `createdAt`). Supports paging via `limit` + `offset`, filtering by
        `outcome`, `platform`, and `dateFrom` / `dateTo` (inclusive bounds
        on `dateAt` when present, otherwise `createdAt`).
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [active, trash, all]
            default: active
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [another_date, no_more, unsure, ghosted]
        - name: platform
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: dateFrom
          in: query
          required: false
          description: ISO-8601 inclusive lower bound. Parsed server-side via `new Date(...)`.
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          description: ISO-8601 inclusive upper bound. Parsed server-side via `new Date(...)`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Post-date notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDateNoteList"
    post:
      tags: [mirror]
      operationId: createPostDateNote
