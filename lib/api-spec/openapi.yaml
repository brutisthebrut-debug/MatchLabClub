            type: integer
      responses:
        "200":
          description: Insight deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteInsightResult"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /insights/{id}/analyze:
    post:
      operationId: analyzeInsight
      tags: [insights]
      summary: Run AI analysis on pasted email/message history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInsightAnalysis"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the podcast launch waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
    get:
      operationId: getWaitlistStats
      tags: [waitlist]
      summary: Get waitlist stats (count, spots remaining)
      responses:
        "200":
          description: Waitlist stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStats"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get current AI integration status
      description: Returns whether OpenAI is connected, in fallback mode, or needs setup. Requires an authenticated founder role.
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          description: Missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "403":
          description: Authenticated account lacks founder access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /ai/enhance:
    post:
      operationId: enhanceAi
      tags: [ai]
      summary: Run a tool-specific AI generation with graceful fallback
      description: Public endpoint used by client tools (Blueprint, NextMessage, etc.) to enhance deterministic output with live AI when an API key is configured. Falls back silently to an empty output if AI is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEnhanceInput"
      responses:
        "200":
          description: AI enhancement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /ai/fallback-rate:
    get:
      operationId: getAiFallbackRate
      tags: [ai]
      summary: Get recent fallback rate for a single AI tool
      description: |
        Returns the number of fallback (coach-written) answers out of the most
        recent `windowSize` AI requests for the given tool name. Public,
        unauthenticated — intended for a small "X of last N used the backup"
        transparency indicator on each AI tool page. Returns zeros when there
        is no data yet.
      parameters:
        - name: toolName
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: windowSize
          in: query
          required: false
          description: How many recent requests to consider (1-200, defaults to 20).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Recent fallback counts for the tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFallbackRate"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /ai/test:
    post:
      operationId: testAi
      tags: [ai]
      summary: Send a sample prompt through the server-side AI helper
      description: Safe diagnostic endpoint — runs a tiny generation request. Requires an authenticated founder role. Falls back gracefully if AI is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTestInput"
      responses:
        "200":
          description: AI test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/purge-trash:
    post:
      operationId: purgeTrashNow
      tags: [founder]
      summary: Manually trigger an immediate audit trash purge
      description: |
        Runs `purgeExpiredTrashedAudits()` synchronously and returns the number
        of records deleted. Useful after adjusting the retention window or to
        confirm the purge job is working without waiting for the timer.
        Requires an authenticated founder role.
      responses:
        "200":
          description: Purge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPurgeResult"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/geoip/refresh:
    post:
      operationId: refreshGeoip
      tags: [founder]
      summary: Trigger a manual GeoIP database refresh
      description: |
        Runs the GeoIP updater immediately (the same routine the monthly job calls).
        Useful after rotating the MaxMind license key or when the dataset is suspected
        to be stale. Requires an authenticated founder role.
      responses:
        "200":
          description: GeoIP refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoipRefreshResult"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/trash-purge-heartbeat:
    get:
      operationId: getTrashPurgeHeartbeat
      tags: [founder]
      summary: When did the audit trash purge job last succeed?
      description: |
        Returns the timestamp of the last successful `audit_trash_purge` job run,
        together with the elapsed time and a staleness flag. Requires an authenticated founder role.
      responses:
        "200":
          description: Trash purge heartbeat status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPurgeHeartbeat"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/referrals:
    get:
      operationId: getFounderReferrals
      tags: [founder]
      summary: Referral attribution summary for the founder dashboard
      description: |
        Aggregates the `referrals` table joined to `users` and `purchase_interest`
        to show who is referring who and how those signups convert.

        A referred user is counted as "paid" if they have any matching
        `purchase_interest` row with `status = 'paid'`. This matches the rest
        of the founder dashboard's purchase view, which treats `status = 'paid'`
        as the canonical signal that money actually moved.

        Requires an authenticated founder role.
      responses:
        "200":
          description: Referral attribution summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderReferralsSummary"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/funnel:
    get:
      operationId: getFounderFunnel
      tags: [founder]
      summary: Readiness-to-revenue funnel for the founder dashboard
      description: |
        Counts distinct users at each stage of the readiness-to-matching-to-revenue
        journey so the founder can see where people drop off:

        accounts -> fed a signal -> gained readiness -> entered the matching pool
        -> got a match intro -> purchased.

        Each stage is a distinct-user count derived from the underlying tables.
        Stages are computed independently (a paid user need not have toggled the
        pool), so the step conversion is count[i] / count[i-1] and is meant as a
        directional drop-off read, not a strict nested cohort. Anonymous visits
        are tracked client-side via analytics, so the first server-visible stage
        is accounts.

        Requires an authenticated founder role.
      responses:
        "200":
          description: Funnel summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderFunnelSummary"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/copilot/ask:
    post:
      operationId: askFounderCopilot
      tags: [founder]
      summary: Ask Echo a free-form strategic question
      description: |
        Routes a free-form founder question to the Echo persona via Anthropic.
        The full strategic playbook is embedded in the system prompt so the
        reply can reference prior decisions. On model failure or unavailable
        provider, returns a fallback answer pointing at the closest playbook
        entry. Requires an authenticated founder role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskFounderCopilotInput"
      responses:
        "200":
          description: Echo's answer, or a deterministic playbook fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskFounderCopilotResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /compass/extract-screenshot:
    post:
      tags: [mirror]
      operationId: extractCompassScreenshot
      summary: OCR a profile or chat screenshot and return its extracted text
      description: |
        Accepts an image upload (max 10MB) and returns the OCR-extracted text
        as a single string. The client is expected to feed that text into the
        same Compatibility Compass derivation flow used by the paste tab.
        Anon-safe: nothing is persisted.

        A multipart/form-data POST with a single `file` field containing the
        screenshot. Not modeled as a typed body in the generated client;
        callers should construct a `FormData` and POST it via `fetch`
        directly.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Extracted text from the screenshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassScreenshotExtractResult"
        "400":
          description: Invalid image or no readable text found.
        "413":
          description: Image exceeded the 10MB limit.
        "415":
          description: Unsupported image format.

  /compass/reads:
    get:
      tags: [mirror]
      operationId: listCompassReads
      summary: List the current scope's compass reads
      description: |
        Returns up to 50 compass reads for the signed-in user, or for the
        anonymous-claim browser if no user is signed in. Ordered newest
        first. Soft-deleted rows are excluded.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Compass reads list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassReadList"
    post:
      tags: [mirror]
      operationId: saveCompassRead
      summary: Save a Compatibility Compass read
      description: |
        Persists a single compass read. Anon-safe: when no user is signed
        in, the row is stamped with the anonymous claim cookie so it can
        be merged into the account on signup.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompassReadInput"
      responses:
        "201":
          description: Saved compass read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassRead"
        "400":
          description: Invalid payload

  /compass/reads/{id}:
    get:
      tags: [mirror]
      operationId: getCompassRead
      summary: Fetch a single compass read by id
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compass read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassRead"
        "404":
          description: Not found or not owned

  /compass/signal-context:
    get:
      tags: [mirror]
      operationId: getCompassSignalContext
      summary: Aggregate signal context for a recurring compass read
      description: |
        Returns the derived signal context that lets the Compass evolve with the
        user's growing readiness: a plain-language signal layer, the movement
        between the two most recent stored reads, the next best signal to feed,
        and the tie back to Your Mirror. Anonymous callers receive
        `{ available: false }`. Only aggregate, derived coverage is returned,
        never raw content or PII.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Compass signal context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassSignalContext"

  /photo-lab/rank:
    post:
      tags: [ai]
      operationId: rankPhotoLab
      summary: Rank multiple photos and recommend a lead shot
      description: |
        Ranks several photos for use as a dating profile lineup and recommends a
        single lead shot. The deterministic ranking is always on and is built
        only from the composition attributes the member declares per photo (shot
        type, lighting, expression), never from the pixels. When the deep AI lane
        is on and images are supplied, an opt-in Claude vision pass adds depth by
        reading the images in the moment, never storing them. Anon-safe: callers
        without a session still get the deterministic ranking, just without the
        Mirror tie-in and next best signal.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoLabRankInput"
      responses:
        "200":
          description: Photo ranking and lead-shot recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoLabRankResult"
        "400":
          description: Invalid payload

  /me/photo-lab-runs:
    get:
      tags: [profiles]
      operationId: listMyPhotoLabRuns
      summary: List the member's saved Photo Lab runs
      description: |
        Returns up to 50 immutable Photo Lab runs owned by the signed-in member,
        newest first. Records contain the source profile-photo ids, declared
        composition inputs, textual analysis, provenance, and timestamp. Raw
        image bytes and image metadata are never stored in a run. Saving or
        viewing a run does not grant permission to use a photo for matching.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Saved Photo Lab history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoLabRunList"
        "401":
          description: Not authenticated
    post:
      tags: [profiles]
      operationId: createMyPhotoLabRun
      summary: Analyze member-owned profile photos and save an immutable run
      description: |
        Every input id must use `profile-photo-{id}` and reference a distinct
        persistent photo owned by the signed-in member. Optional image bytes are
        used only for an in-memory vision pass and are discarded after the
        request; the durable record stores only declared composition inputs and
        the textual result. Each call creates a new versioned run.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoLabRankInput"
      responses:
        "201":
          description: Saved Photo Lab run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoLabRun"
        "400":
          description: Invalid payload or a source photo is not owned by the member
        "401":
          description: Not authenticated

  /me/photo-lab-runs/{id}:
    get:
      tags: [profiles]
      operationId: getMyPhotoLabRun
      summary: Reopen one saved Photo Lab run
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved Photo Lab run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoLabRun"
        "401":
          description: Not authenticated
        "404":
          description: Run not found for this member
    delete:
      tags: [profiles]
      operationId: deleteMyPhotoLabRun
      summary: Delete one saved Photo Lab run
      description: Deletes the member-owned analysis record, not its source photos.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePhotoLabRunResult"
        "401":
          description: Not authenticated
        "404":
          description: Run not found for this member

  /imports/hinge:
    post:
      tags: [insights]
      operationId: uploadHingeImport
      summary: Upload a Hinge GDPR data export ZIP
      description: |
        Accepts a Hinge GDPR data-export ZIP (max 50MB), parses it in
        memory, and persists a structured summary to `imported_sources`.
        The raw ZIP is never persisted. Storage does not authorize Echo or
        matching use. A signed-in member can separately enable Echo processing,
        confirmed learning, and matching use after the source is saved.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        description: |
          A multipart/form-data POST with a single `file` field containing
          the Hinge export ZIP. Not modeled as a typed body in the
          generated client; callers should construct a `FormData` and POST
          it via `fetch` directly.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Import accepted and parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "400":
          description: Invalid or unreadable upload.
        "413":
          description: File exceeded the 50MB limit.
        "415":
          description: Unsupported file type. Must be a ZIP.

  /imports/calendar:
    post:
      tags: [insights]
      operationId: uploadCalendarImport
      summary: Import a calendar by pasting .ics contents
      description: |
        Accepts pasted .ics calendar file contents, parses event rhythm
        in memory, and stores a structured summary in `imported_sources`
        with source `calendar-ics`. No external fetch is made and the raw
        text is not persisted, only the derived summary. Anon-first:
        anonymous callers receive a claim token so the import reassigns to
        their account on signup.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarImportBody'
      responses:
        "201":
          description: Calendar parsed and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "400":
          description: Missing, unreadable, or empty calendar paste.

  /imports:
    get:
      tags: [insights]
      operationId: listImports
      summary: List the caller's data imports
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Most recent imports for this user or anonymous browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSourceList"

  /imports/{id}:
    get:
      tags: [insights]
      operationId: getImport
      summary: Fetch a single import by id
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "404":
          description: Not found or not owned.
    delete:
      tags: [insights]
      operationId: deleteImport
      summary: Hard-delete an import the caller owns
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteImportResult"
        "404":
          description: Not found or not owned.

  /imports/{id}/permissions:
    patch:
      tags: [insights]
      operationId: updateImportPermissions
      summary: Update independent downstream permissions for a stored source
      description: |
        A stored source remains saved until it is deleted. Echo processing,
        accepting its proposed learning into My MatchLab, and matching use are
        separate opt-ins; changing one never changes either of the others.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPermissionPatch'
      responses:
        "200":
          description: Updated import and its independent permission states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSource'
        "400":
          description: No permission change was supplied.
        "404":
          description: Not found or not owned.

  /me/matching/state:
    get:
      tags: [Matching]
      operationId: getMatchingState
      summary: Get the signed-in user's matching readiness, preferences, and pool status
      description: |
        Returns the combined matching envelope used by the Matching page:
        the user's saved preferences (or null when none are set), pool
        membership row, tier marker, a deterministic readiness score with
        per-source breakdown, the city-density count for the user's
        cityHint, and the total pool count. No AI calls. Safe to hit on
        every page load.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current matching state envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingState'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/benchmarks:
    get:
      tags: [Matching]
      operationId: getMatchingBenchmarks
      summary: Get the signed-in user's anonymized per-lane standing vs their goal cohort
      description: |
        Returns the caller's per-lane readiness coverage compared against the
        anonymized cohort of users who share their (normalized) dating goal.
        Each lane carries the caller's own coverage, the cohort median, and the
        caller's percentile within the cohort. Derived only: it reads coverage
        maps and a goal bucket, never identities or raw content. Guarded by a
        minimum cohort size; below that threshold `available` is false and
        `lanes` is empty, so a small group can never narrow toward an
        individual.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The caller's anonymized cohort benchmark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingBenchmarks'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/journey/summary:
    get:
      tags: [Matching]
      operationId: getMyJourneySummary
      summary: Get the signed-in user's own weekly momentum recap
      description: |
        Returns a small, user-scoped summary of the caller's own journey
        events over the last 7 days: how many signals they fed, how much
        readiness they gained, and how many tools they completed. Derived
        only from the caller's own events, never anyone else's. No raw
        content is ever returned, only derived counts. Safe to hit on every
        page load.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The caller's weekly momentum summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJourneySummary'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/achievements:
    get:
      tags: [Matching]
      operationId: getMyAchievements
      summary: Get the signed-in user's unlock board
      description: |
        Returns the caller's full achievements board: every unlock with its
        target, current progress, and whether it is unlocked. Purely a
        gamification lens derived from the caller's own aggregate progress
        (signals fed, tools completed, current streak, Mirror areas mapped,
        readiness score). It never feeds the readiness score and never returns
        raw content. Safe to hit on every page load.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The caller's unlock board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAchievements'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/signal-map:
    get:
      tags: [Matching]
      operationId: getMySignalMap
      summary: Get the signed-in user's signal-density map
      description: |
        Returns a lane-by-lane view of how full the picture the machine holds
        of the caller is: every signal lane with its coverage, how much it
        counts toward the overall density, its confidence, the dimensions it
        informs, and the one action that fills it. The overall density equals
        the readiness score, since the map is derived from the same breakdown
        and weights. Purely a presentation lens over the signal registry: it
        never feeds the readiness score and never returns raw content. Safe to
        hit on every page load.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The caller's signal-density map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalMap'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/preferences:
    put:
      tags: [Matching]
      operationId: updateMatchingPreferences
      summary: Upsert the signed-in user's match preferences
      description: |
        Inserts or updates the caller's row in `match_preferences`. Every
        field is optional. Pass null to clear a value. Age and distance
        bounds are validated server-side.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchPreferencesInput'
      responses:
        '200':
          description: Preferences after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPreferences'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/pool-membership:
    put:
      tags: [Matching]
      operationId: updateMatchingPoolMembership
      summary: Upsert the signed-in user's match pool membership status
      description: |
        Inserts or updates the caller's row in `match_pool_membership`.
        Accepted client-facing statuses: `off`, `building`, `ready`,
        `paused`. When the caller's tier is `wingman` and the client
        sends `building`, the server may upgrade the stored status to
        `concierge_only` for founder-curated routing.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchPoolMembershipInput'
      responses:
        '200':
          description: Membership after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPoolMembership'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '422':
          description: >-
            Readiness is below the cohort threshold. Returned only when the
            caller tries to activate pool membership (status `building` or
            `ready`). Leaving (`off`) and pausing (`paused`) are always allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPoolIneligible'

  /me/matching/external-read:
    post:
      tags: [Matching]
      operationId: createMatchingExternalRead
      summary: Score a pasted external profile against the signed-in user
      description: |
        Persists a paste of a profile the caller is already talking to and
        returns a compatibility read. Reuses the Compatibility Compass
        synthesis path, tagged with `mode='matching_external'`. The result
        is also captured as a `match_proposals` row with
        `source='external_paste'` so the founder review queue can act on it.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchExternalReadInput'
      responses:
        '200':
          description: Compatibility read result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchExternalReadResult'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/dating-wins:
    get:
