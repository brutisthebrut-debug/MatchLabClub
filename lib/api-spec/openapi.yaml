          description: Created post-date note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDateNote"
        "400":
          description: Invalid payload

  /post-date-notes/{id}:
    patch:
      tags: [mirror]
      operationId: updatePostDateNote
      summary: Edit a post-date note (or restore from trash)
      description: |
        Partial-update of a post-date note. Pass `restore: true` to clear
        `deletedAt`. Only the note owner can update.
      parameters:
