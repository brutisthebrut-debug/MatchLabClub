      properties:
        date:
          type: string
        score:
          type: integer

    ScreenshotExtractInput:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: |
            Base64-encoded screenshot of a dating profile. May include a data URL
            prefix (e.g. "data:image/jpeg;base64,..."); the server strips it.

    ScreenshotExtractResult:
      type: object
      required: [bio, prompts, rawOcrText, lowConfidenceFields]
      properties:
        firstName:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        sourceApp:
          type: ["string", "null"]
        bio:
          type: string
        prompts:
          type: array
          items:
            type: string
        rawOcrText:
          type: string
        lowConfidenceFields:
          type: array
          description: |
            Fields the parser is least sure about. The review UI should highlight
            these so the user double-checks them before submitting.
          items:
            type: string
            enum: [firstName, age, sourceApp, bio, prompts]

    ChatScreenshotExtractInput:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: |
            Base64-encoded screenshot of a dating-app chat. May include a data
            URL prefix (e.g. "data:image/jpeg;base64,..."); the server strips it.

    ChatSpeakerTurn:
      type: object
      required: [speaker, text]
      properties:
        speaker:
          type: string
          enum: [them, you]
          description: Who sent this message — "them" for the match, "you" for the user.
        text:
          type: string
          description: The message text for this turn.

    ChatScreenshotExtractResult:
      type: object
      required: [conversationText, rawOcrText, speakerTurns]
      properties:
        conversationText:
          type: string
          description: |
            OCR-extracted conversation text, with obvious UI chrome (timestamps,
            "Delivered", "Send", etc.) filtered out. The user is expected to
            tidy it up in the Coach textarea before submitting.
        sourceApp:
          type: ["string", "null"]
          description: Detected source app — "Hinge", "Bumble", "Tinder", or null when undetectable.
        rawOcrText:
          type: string
        speakerTurns:
          type: array
          description: |
            Ordered list of inferred speaker turns extracted from the screenshot.
            Speaker attribution is a heuristic (noise-boundary alternation) and may
            need user correction — the client should offer a way to flip misattributed turns.
          items:
            $ref: "#/components/schemas/ChatSpeakerTurn"

    ScreenshotAuditInput:
      type: object
      description: |
        Either provide `imageBase64` (server will OCR) or provide `bio` (and
        optionally `prompts`) from a prior /audits/extract-screenshot call so the
        user could correct OCR mistakes. When `bio` is provided, OCR is skipped.
      properties:
        imageBase64:
          type: ["string", "null"]
          description: |
            Base64-encoded screenshot of a dating profile. May include a data URL
            prefix (e.g. "data:image/jpeg;base64,..."); the server strips it.
            Omit when supplying corrected text directly.
        firstName:
          type: ["string", "null"]
          description: Optional name (e.g. the match's first name pulled from the profile).
        age:
          type: ["integer", "null"]
          description: Optional age, used when supplying corrected fields.
        datingGoal:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Which dating app the screenshot was taken from (e.g. "Hinge").
        bio:
          type: ["string", "null"]
          description: Corrected bio text. When present, OCR is skipped.
        prompts:
          type: array
          items:
            type: string
          description: Corrected prompts. Only used when `bio` is provided.
        rawOcrText:
          type: ["string", "null"]
          description: |
            Raw OCR text from the prior /audits/extract-screenshot call. When
            present alongside corrected fields, the server stores it next to the
            audit so the OCR-vs-correction diff can be inspected later.
        rawExtracted:
          type: ["object", "null"]
          description: |
            The parser's original guesses from the prior extract-screenshot call.
            When the corrected values differ, the diff is recorded against the
            audit for parser-improvement analysis.
          properties:
            firstName:
              type: ["string", "null"]
            age:
              type: ["integer", "null"]
            sourceApp:
              type: ["string", "null"]
            bio:
              type: ["string", "null"]
            prompts:
              type: array
              items:
                type: string

    ScreenshotAuditReport:
      type: object
      required: [auditId, extractedBio, extractedPrompts, report]
      properties:
        auditId:
          type: integer
        extractedBio:
          type: string
        extractedPrompts:
          type: array
          items:
            type: string
        rawOcrText:
          type: string
        report:
          $ref: "#/components/schemas/AuditReport"

