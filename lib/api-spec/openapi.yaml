        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDateNote"
        "400":
          description: Invalid payload
        "404":
          description: Not found
    delete:
      tags: [mirror]
      operationId: deletePostDateNote
      summary: Soft-delete a post-date note
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Soft-deleted note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePostDateNoteResult"
        "404":
          description: Not found

  /post-date-notes/{id}/restore:
    post:
      tags: [mirror]
      operationId: restorePostDateNote
      summary: Restore a soft-deleted post-date note
      parameters:
