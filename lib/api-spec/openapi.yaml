          type: [integer, "null"]

    MirrorTrendThemeShift:
      type: object
      required: [key, label, from, to, direction]
      properties:
        key:
          type: string
        label:
          type: string
        from:
          type: integer
        to:
          type: integer
        direction:
          type: string
          enum: [emerged, faded, steady]

    MirrorTrendScoreDelta:
      type: object
      required: [first, latest, previous, delta, currentVsPrevious, rolling30Delta, direction]
