          application/json:
            schema:
              $ref: "#/components/schemas/AiTestInput"
      responses:
        "200":
          description: AI test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/purge-trash:
    post:
      operationId: purgeTrashNow
      tags: [founder]
      summary: Manually trigger an immediate audit trash purge
      description: |
        Runs `purgeExpiredTrashedAudits()` synchronously and returns the number
        of records deleted. Useful after adjusting the retention window or to
        confirm the purge job is working without waiting for the timer.
        Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPurgeResult"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/geoip/refresh:
    post:
      operationId: refreshGeoip
      tags: [founder]
      summary: Trigger a manual GeoIP database refresh
      description: |
        Runs the GeoIP updater immediately (the same routine the monthly job calls).
        Useful after rotating the MaxMind license key or when the dataset is suspected
        to be stale. Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
        - name: key
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: GeoIP refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoipRefreshResult"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/trash-purge-heartbeat:
    get:
      operationId: getTrashPurgeHeartbeat
      tags: [founder]
      summary: When did the audit trash purge job last succeed?
      description: |
        Returns the timestamp of the last successful `audit_trash_purge` job run,
        together with the elapsed time and a staleness flag. Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trash purge heartbeat status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPurgeHeartbeat"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/referrals:
    get:
      operationId: getFounderReferrals
      tags: [founder]
      summary: Referral attribution summary for the founder dashboard
      description: |
        Aggregates the `referrals` table joined to `users` and `purchase_interest`
        to show who is referring who and how those signups convert.

        A referred user is counted as "paid" if they have any matching
        `purchase_interest` row with `status = 'paid'`. This matches the rest
        of the founder dashboard's purchase view, which treats `status = 'paid'`
        as the canonical signal that money actually moved.

        Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
        - name: key
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Referral attribution summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderReferralsSummary"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/funnel:
    get:
      operationId: getFounderFunnel
      tags: [founder]
      summary: Readiness-to-revenue funnel for the founder dashboard
      description: |
        Counts distinct users at each stage of the readiness-to-matching-to-revenue
        journey so the founder can see where people drop off:

        accounts -> fed a signal -> gained readiness -> entered the matching pool
        -> got a match intro -> purchased.

        Each stage is a distinct-user count derived from the underlying tables.
        Stages are computed independently (a paid user need not have toggled the
        pool), so the step conversion is count[i] / count[i-1] and is meant as a
        directional drop-off read, not a strict nested cohort. Anonymous visits
        are tracked client-side via analytics, so the first server-visible stage
        is accounts.

        Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
        - name: key
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Funnel summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderFunnelSummary"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/copilot/ask:
    post:
      operationId: askFounderCopilot
      tags: [founder]
      summary: Ask Echo a free-form strategic question
      description: |
        Routes a free-form founder question to the Echo persona via Anthropic.
        The full strategic playbook is embedded in the system prompt so the
        reply can reference prior decisions. On model failure or unavailable
        provider, returns a fallback answer pointing at the closest playbook
        entry. Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
        - name: key
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskFounderCopilotInput"
      responses:
        "200":
          description: Echo's answer, or a deterministic playbook fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskFounderCopilotResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /compass/extract-screenshot:
    post:
      tags: [mirror]
      operationId: extractCompassScreenshot
      summary: OCR a profile or chat screenshot and return its extracted text
      description: |
        Accepts an image upload (max 10MB) and returns the OCR-extracted text
        as a single string. The client is expected to feed that text into the
        same Compatibility Compass derivation flow used by the paste tab.
        Anon-safe: nothing is persisted.

        A multipart/form-data POST with a single `file` field containing the
        screenshot. Not modeled as a typed body in the generated client;
        callers should construct a `FormData` and POST it via `fetch`
        directly.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Extracted text from the screenshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassScreenshotExtractResult"
        "400":
          description: Invalid image or no readable text found.
        "413":
          description: Image exceeded the 10MB limit.
        "415":
          description: Unsupported image format.

  /compass/reads:
    get:
      tags: [mirror]
      operationId: listCompassReads
      summary: List the current scope's compass reads
      description: |
        Returns up to 50 compass reads for the signed-in user, or for the
        anonymous-claim browser if no user is signed in. Ordered newest
        first. Soft-deleted rows are excluded.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Compass reads list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassReadList"
    post:
      tags: [mirror]
      operationId: saveCompassRead
      summary: Save a Compatibility Compass read
      description: |
        Persists a single compass read. Anon-safe: when no user is signed
        in, the row is stamped with the anonymous claim cookie so it can
        be merged into the account on signup.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompassReadInput"
      responses:
        "201":
          description: Saved compass read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassRead"
        "400":
          description: Invalid payload

  /compass/reads/{id}:
    get:
      tags: [mirror]
      operationId: getCompassRead
      summary: Fetch a single compass read by id
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compass read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompassRead"
        "404":
          description: Not found or not owned

  /imports/hinge:
    post:
      tags: [insights]
      operationId: uploadHingeImport
      summary: Upload a Hinge GDPR data export ZIP
      description: |
        Accepts a Hinge GDPR data-export ZIP (max 50MB), parses it in
        memory, and persists a structured summary to `imported_sources`.
        The raw ZIP is never persisted. For signed-in users a
        fire-and-forget Anthropic call enriches the row with a narrative
        read. Anonymous users get the parsed counts only; they must claim
        and sign in to receive the AI read.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        description: |
          A multipart/form-data POST with a single `file` field containing
          the Hinge export ZIP. Not modeled as a typed body in the
          generated client; callers should construct a `FormData` and POST
          it via `fetch` directly.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Import accepted and parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "400":
          description: Invalid or unreadable upload.
        "413":
          description: File exceeded the 50MB limit.
        "415":
          description: Unsupported file type. Must be a ZIP.

  /imports/calendar:
    post:
      tags: [insights]
      operationId: uploadCalendarImport
      summary: Import a calendar by pasting .ics contents
      description: |
        Accepts pasted .ics calendar file contents, parses event rhythm
        in memory, and stores a structured summary in `imported_sources`
        with source `calendar-ics`. No external fetch is made and the raw
        text is not persisted, only the derived summary. Anon-first:
        anonymous callers receive a claim token so the import reassigns to
        their account on signup.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarImportBody'
      responses:
        "201":
          description: Calendar parsed and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "400":
          description: Missing, unreadable, or empty calendar paste.

  /imports:
    get:
      tags: [insights]
      operationId: listImports
      summary: List the caller's data imports
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Most recent imports for this user or anonymous browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSourceList"

  /imports/{id}:
    get:
      tags: [insights]
      operationId: getImport
      summary: Fetch a single import by id
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSource"
        "404":
          description: Not found or not owned.
    delete:
      tags: [insights]
      operationId: deleteImport
      summary: Hard-delete an import the caller owns
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteImportResult"
        "404":
          description: Not found or not owned.

  /me/matching/state:
    get:
      tags: [Matching]
      operationId: getMatchingState
      summary: Get the signed-in user's matching readiness, preferences, and pool status
      description: |
        Returns the combined matching envelope used by the Matching page:
        the user's saved preferences (or null when none are set), pool
        membership row, tier marker, a deterministic readiness score with
        per-source breakdown, the city-density count for the user's
        cityHint, and the total pool count. No AI calls. Safe to hit on
        every page load.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Current matching state envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingState'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/preferences:
    put:
      tags: [Matching]
      operationId: updateMatchingPreferences
      summary: Upsert the signed-in user's match preferences
      description: |
        Inserts or updates the caller's row in `match_preferences`. Every
        field is optional. Pass null to clear a value. Age and distance
        bounds are validated server-side.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchPreferencesInput'
      responses:
        '200':
          description: Preferences after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPreferences'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/pool-membership:
    put:
      tags: [Matching]
      operationId: updateMatchingPoolMembership
      summary: Upsert the signed-in user's match pool membership status
      description: |
        Inserts or updates the caller's row in `match_pool_membership`.
        Accepted client-facing statuses: `off`, `building`, `ready`,
        `paused`. When the caller's tier is `wingman` and the client
        sends `building`, the server may upgrade the stored status to
        `concierge_only` for founder-curated routing.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchPoolMembershipInput'
      responses:
        '200':
          description: Membership after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPoolMembership'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '422':
          description: >-
            Readiness is below the cohort threshold. Returned only when the
            caller tries to activate pool membership (status `building` or
            `ready`). Leaving (`off`) and pausing (`paused`) are always allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPoolIneligible'

  /me/matching/external-read:
    post:
      tags: [Matching]
      operationId: createMatchingExternalRead
      summary: Score a pasted external profile against the signed-in user
      description: |
        Persists a paste of a profile the caller is already talking to and
        returns a compatibility read. Reuses the Compatibility Compass
        synthesis path, tagged with `mode='matching_external'`. The result
        is also captured as a `match_proposals` row with
        `source='external_paste'` so the founder review queue can act on it.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchExternalReadInput'
      responses:
        '200':
          description: Compatibility read result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchExternalReadResult'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/dating-wins:
    get:
      tags: [Matching]
      operationId: getDatingWins
      summary: List the signed-in user's logged dating wins
      description: |
        Returns the caller's non-deleted dating wins, newest first. Dating
        wins are small moments of courage and progress; logging them feeds
        matching readiness as a low-weight signal.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of dating wins.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatingWin'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    post:
      tags: [Matching]
      operationId: createDatingWin
      summary: Log a new dating win
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatingWinInput'
      responses:
        '201':
          description: The created dating win.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatingWin'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/dating-wins/{id}:
    delete:
      tags: [Matching]
      operationId: deleteDatingWin
      summary: Delete one of the signed-in user's dating wins
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted.
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Not found or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/proposals:
    get:
      tags: [Matching]
      operationId: getMatchingProposals
      summary: List the signed-in user's current match proposals
      description: |
        Returns the caller's proposals ordered by createdAt desc. Empty for
        most users today; founder seeds rows as the internal pool grows.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of proposals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchProposal'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/echo:
    post:
      tags: [Matching]
      operationId: createMatchingEchoRead
      summary: Echo's read on the signed-in user for matching
      description: |
        Returns Echo's read of the user grounded in their own aggregate signal
        coverage: what the machine can see, the kind of person it would put in
        front of them, the confidence of the read, and the gap to the pool.
        Deterministic baseline is always-on; the Claude layer is opt-in via the
        per-account content consent toggle and daily-capped. Only aggregate or
        derived signal coverage is ever sent to Claude, never raw content.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Echo's read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoMatchRead'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/proposals/{id}/response:
    put:
      tags: [Matching]
      operationId: respondToMatchProposal
      summary: Record the user's interest in a match proposal
      description: |
        Lets the user act on a proposal instead of hitting a dead-end preview.
        Recording interest moves it to user_yes (routing it into the founder
        intro queue); passing moves it to user_no. Only the proposal owner may
        respond, and only while it is still in the proposed state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchProposalResponseInput'
      responses:
        '200':
          description: The updated proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchProposal'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Proposal not found or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        push_token:
          type: string
          minLength: 1
          description: |
            Expo push token for the signing-in device, if available. When
            provided, this token is excluded from the recipients of the
            new-sign-in push notification so the device performing the
            sign-in doesn't notify itself.
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    AuthErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ClaimAnonymousInput:
      type: object
      properties:
        auditIds:
          type: array
          items:
            type: integer
        profileIds:
          type: array
          items:
            type: integer
        messageSessionIds:
          type: array
          items:
            type: integer
        insightIds:
          type: array
          items:
            type: integer
        followUpIds:
          type: array
          items:
            type: integer
        journalEntryIds:
          type: array
          items:
            type: integer
        postDateNoteIds:
          type: array
          items:
            type: integer
    AnonymousClaimHandoff:
      type: object
      required: [handoff, expiresAt]
      properties:
        handoff:
          type: string
          description: Opaque signed token. Treat as a secret — anyone holding it can claim the underlying anonymous data after signing in before it expires.
        expiresAt:
          type: string
          format: date-time
    AnonymousClaimHandoffStatusInput:
      type: object
      required: [handoff]
      properties:
        handoff:
          type: string
          minLength: 1
    AnonymousClaimHandoffStatus:
      type: object
      required: [redeemed, expired]
      properties:
        redeemed:
          type: boolean
          description: True once the handoff token's `jti` has been recorded in `handoff_token_redemptions` (i.e. the other device successfully claimed the data).
        expired:
          type: boolean
          description: True once the token's TTL has passed. Mutually compatible with `redeemed` — a token may be both redeemed and expired.
        expiresAt:
          type: string
          format: date-time
          description: The token's expiry timestamp. Omitted if the token can't be verified.
    RedeemAnonymousClaimHandoffInput:
      type: object
      required: [handoff]
      properties:
        handoff:
          type: string
          minLength: 1
        auditIds:
          type: array
          items:
            type: integer
        profileIds:
          type: array
          items:
            type: integer
        messageSessionIds:
          type: array
          items:
            type: integer
        insightIds:
          type: array
          items:
            type: integer
        followUpIds:
          type: array
          items:
            type: integer
        journalEntryIds:
          type: array
          items:
            type: integer
        postDateNoteIds:
          type: array
          items:
            type: integer
    ClaimAnonymousResult:
      type: object
      required: [claimed]
      properties:
        claimed:
          type: object
          required: [audits, profiles, messages, insights, followUps, journalEntries, postDateNotes]
          properties:
            audits:
              type: integer
            profiles:
              type: integer
            messages:
              type: integer
            insights:
              type: integer
            followUps:
              type: integer
            journalEntries:
              type: integer
            postDateNotes:
              type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuditInput:
      type: object
      required: [firstName, age, gender, orientation, datingGoal, currentApps, bio]
      properties:
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]

    Audit:
      type: object
      required: [id, firstName, age, gender, datingGoal, currentApps, bio, createdAt, status, source]
      properties:
        id:
          type: integer
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Dating app the audit originated from (e.g. "Hinge"), detected from OCR or supplied by the client.
        status:
          type: string
          enum: [pending, generating, complete, error]
        source:
          type: string
          enum: [manual, screenshot]
        readinessScore:
          type: ["integer", "null"]
        report:
          oneOf:
            - $ref: "#/components/schemas/AuditReport"
            - type: "null"
          description: |
            The persisted mini-report generated at scan time. Present for newer
            audits; older audits without a stored report return null and the
            client should fall back to calling `generateAuditReport`.
        reportGeneratedAt:
          type: ["string", "null"]
          description: ISO timestamp the stored report was generated. Null if no report has been generated yet.
        previousReport:
          oneOf:
            - $ref: "#/components/schemas/AuditReport"
            - type: "null"
          description: |
            The mini-report from the immediately prior regeneration, kept so
            users can see what changed. Null when the audit has never been
            regenerated (or the report has never been generated).
        previousReadinessScore:
          type: ["integer", "null"]
          description: Readiness score from the prior regeneration (null if never regenerated).
        previousReportGeneratedAt:
          type: ["string", "null"]
          description: ISO timestamp of the prior regeneration's report (null if never regenerated).
        createdAt:
          type: string
        deletedAt:
          type: ["string", "null"]
          description: |
            ISO timestamp when the audit was soft-deleted. Null for active
            audits. Soft-deleted audits are filtered out of regular list
            endpoints and only appear under `/audits/trash`; they are auto-
            purged after 30 days.
        matchContext:
          oneOf:
            - $ref: "#/components/schemas/AuditMatchContext"
            - type: "null"
          description: |
            Present only when a search query (`q`) was supplied to `GET /audits`.
            Indicates which field (name or bio) was the primary match source and,
            for bio matches, a short excerpt around the matched text so users can
            see why the result appeared.

    CorrectSourceAppInput:
      type: object
      required: [correctedApp]
      properties:
        correctedApp:
          type: ["string", "null"]
          description: |
            The app the user says the audit actually came from. One of "Hinge",
            "Bumble", "Tinder", "Grindr", "Feeld", "HER", "OkCupid",
            "CoffeeMeetsBagel". Pass null to mark the app as
            unknown/unrecognised.

    CorrectSourceAppResult:
      type: object
      required: [success, sourceApp]
      properties:
        success:
          type: boolean
          const: true
        sourceApp:
          type: ["string", "null"]
          description: The updated sourceApp value now stored on the audit.

    AuditMatchContext:
      type: object
      required: [matchedField]
      properties:
        matchedField:
          type: string
          enum: [name, bio]
          description: The field that best matched the search query.
        snippet:
          type: ["string", "null"]
          description: |
            A short excerpt from the bio showing the context around the match.
            Only present when `matchedField` is `bio`.

    AuditReport:
      type: object
      required: [auditId, readinessScore, overallGrade, strengths, risks, bioAudit, rewrittenBio, rewrittenPrompts, photoGuidance, actionPlan, messagingStyle, coachingCta]
      properties:
        auditId:
          type: integer
        readinessScore:
          type: integer
        overallGrade:
          type: string
        strengths:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        bioAudit:
          type: string
        rewrittenBio:
          type: string
        rewrittenPrompts:
          type: array
          items:
            $ref: "#/components/schemas/RewrittenPrompt"
        photoGuidance:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuidanceItem"
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/ActionPlanItem"
        messagingStyle:
          type: string
        coachingCta:
          type: string
        engineVersion:
          type: ["string", "null"]
          description: |
            Version tag of the deterministic engine that produced this report.
            Older saved reports may be missing this field; clients should treat
            a missing or non-matching value as stale and offer a re-run.
        changeSummary:
          oneOf:
            - $ref: "#/components/schemas/ReportChangeSummary"
            - type: "null"
          description: |
            A short "what changed since last time" diff vs the immediately prior
            run. Only populated on regeneration responses (and the freshly-saved
            report). Null on the very first generation or when no prior report
            exists to compare against.
        photoAnalysis:
          oneOf:
            - $ref: "#/components/schemas/PhotoAnalysis"
            - type: "null"
          description: |
            Real AI vision read of the actual profile photo(s) in the uploaded
            screenshot. Present only when the signed-in user opted into the deep
            AI lane (ai_content_consent) and the vision call succeeded; otherwise
            null, and the deterministic photoGuidance checklist is the fallback.
            The raw image is never stored; it is analyzed in memory and discarded.

    PhotoAnalysis:
      type: object
      required: [summary, observations, topFix]
      properties:
        summary:
          type: string
          description: One or two sentence overall read of the photos actually seen.
        observations:
          type: array
          items:
            $ref: "#/components/schemas/PhotoObservation"
        topFix:
          type: string
          description: The single highest-impact change to make to the photos.

    PhotoObservation:
      type: object
      required: [aspect, assessment, detail]
      properties:
        aspect:
          type: string
          description: |
            What this observation is about (e.g. Lighting, Framing, Expression,
            Variety, Background).
        assessment:
          type: string
          enum: [strong, okay, needs_work]
        detail:
          type: string
          description: Specific, grounded note referencing what is visible in the photo.

    ReportChangeSummary:
      type: object
      required: [scoreDelta, previousScore, newScore, addedStrengths, removedStrengths, addedRisks, removedRisks]
      properties:
        scoreDelta:
          type: integer
          description: newScore minus previousScore (negative when the score dropped).
        previousScore:
          type: integer
        newScore:
          type: integer
        addedStrengths:
          type: array
          items:
            type: string
          description: Strengths present in the new report but not in the prior one.
        removedStrengths:
          type: array
          items:
            type: string
          description: Strengths from the prior report that no longer appear.
        addedRisks:
          type: array
          items:
            type: string
        removedRisks:
          type: array
          items:
            type: string

    AuditReportVersion:
      type: object
      required: [id, auditId, readinessScore, report, generatedAt]
      properties:
        id:
          type: integer
        auditId:
          type: integer
        readinessScore:
          type: integer
        report:
          $ref: "#/components/schemas/AuditReport"
        changeSummary:
          oneOf:
            - $ref: "#/components/schemas/ReportChangeSummary"
            - type: "null"
          description: |
            "What changed since last time" diff at the moment this version was
            generated. Null for the first generation of an audit.
        engineVersion:
          type: ["string", "null"]
          description: Engine version tag at the time this version was produced.
        generatedAt:
          type: string
          description: ISO timestamp this version was generated.

    AuditReportVersionList:
      type: object
      required: [auditId, versions]
      properties:
        auditId:
          type: integer
        versions:
          type: array
          description: Report versions for this audit, newest first.
          items:
            $ref: "#/components/schemas/AuditReportVersion"

    RewrittenPrompt:
      type: object
      required: [original, rewritten, tip]
      properties:
        original:
          type: string
        rewritten:
          type: string
        tip:
          type: string

    PhotoGuidanceItem:
      type: object
      required: [category, status, advice]
      properties:
        category:
          type: string
        status:
          type: string
          enum: [good, needs_work, missing]
        advice:
          type: string

    ActionPlanItem:
      type: object
      required: [priority, title, description, timeframe]
      properties:
        priority:
          type: integer
        title:
          type: string
        description:
          type: string
        timeframe:
          type: string

    AuditSummary:
      type: object
      required: [totalAudits, averageScore, latestScore, scoreHistory, topStrengths, topRisks]
      properties:
        totalAudits:
          type: integer
        averageScore:
          type: number
        latestScore:
          type: ["integer", "null"]
        scoreHistory:
          type: array
          items:
            $ref: "#/components/schemas/ScoreHistoryPoint"
        topStrengths:
          type: array
          items:
            type: string
        topRisks:
          type: array
          items:
            type: string

    ScoreHistoryPoint:
      type: object
      required: [date, score]
      properties:
        date:
          type: string
        score:
          type: integer

    ScreenshotExtractInput:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: |
            Base64-encoded screenshot of a dating profile. May include a data URL
            prefix (e.g. "data:image/jpeg;base64,..."); the server strips it.

    ScreenshotExtractResult:
      type: object
      required: [bio, prompts, rawOcrText, lowConfidenceFields]
      properties:
        firstName:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        sourceApp:
          type: ["string", "null"]
        bio:
          type: string
        prompts:
          type: array
          items:
            type: string
        rawOcrText:
          type: string
        lowConfidenceFields:
          type: array
          description: |
            Fields the parser is least sure about. The review UI should highlight
            these so the user double-checks them before submitting.
          items:
            type: string
            enum: [firstName, age, sourceApp, bio, prompts]

    ChatScreenshotExtractInput:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: |
            Base64-encoded screenshot of a dating-app chat. May include a data
            URL prefix (e.g. "data:image/jpeg;base64,..."); the server strips it.

    ChatSpeakerTurn:
      type: object
      required: [speaker, text]
      properties:
        speaker:
          type: string
          enum: [them, you]
          description: Who sent this message — "them" for the match, "you" for the user.
        text:
          type: string
          description: The message text for this turn.

    ChatScreenshotExtractResult:
      type: object
      required: [conversationText, rawOcrText, speakerTurns]
      properties:
        conversationText:
          type: string
          description: |
            OCR-extracted conversation text, with obvious UI chrome (timestamps,
            "Delivered", "Send", etc.) filtered out. The user is expected to
            tidy it up in the Coach textarea before submitting.
        sourceApp:
          type: ["string", "null"]
          description: Detected source app — "Hinge", "Bumble", "Tinder", or null when undetectable.
        rawOcrText:
          type: string
        speakerTurns:
          type: array
          description: |
            Ordered list of inferred speaker turns extracted from the screenshot.
            Speaker attribution is a heuristic (noise-boundary alternation) and may
            need user correction — the client should offer a way to flip misattributed turns.
          items:
            $ref: "#/components/schemas/ChatSpeakerTurn"

    ScreenshotAuditInput:
      type: object
      description: |
        Either provide `imageBase64` (server will OCR) or provide `bio` (and
        optionally `prompts`) from a prior /audits/extract-screenshot call so the
        user could correct OCR mistakes. When `bio` is provided, OCR is skipped.
      properties:
        imageBase64:
          type: ["string", "null"]
          description: |
            Base64-encoded screenshot of a dating profile. May include a data URL
            prefix (e.g. "data:image/jpeg;base64,..."); the server strips it.
            Omit when supplying corrected text directly.
        imageMediaType:
          type: ["string", "null"]
          description: |
            MIME type of the uploaded image (e.g. "image/png"). Sent so the opt-in
            photo vision call labels the image correctly even when imageBase64 has
            no data URL prefix. Falls back to prefix sniffing then JPEG.
        firstName:
          type: ["string", "null"]
          description: Optional name (e.g. the match's first name pulled from the profile).
        age:
          type: ["integer", "null"]
          description: Optional age, used when supplying corrected fields.
        datingGoal:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Which dating app the screenshot was taken from (e.g. "Hinge").
        bio:
          type: ["string", "null"]
          description: Corrected bio text. When present, OCR is skipped.
        prompts:
          type: array
          items:
            type: string
          description: Corrected prompts. Only used when `bio` is provided.
        rawOcrText:
          type: ["string", "null"]
          description: |
            Raw OCR text from the prior /audits/extract-screenshot call. When
            present alongside corrected fields, the server stores it next to the
            audit so the OCR-vs-correction diff can be inspected later.
        rawExtracted:
          type: ["object", "null"]
          description: |
            The parser's original guesses from the prior extract-screenshot call.
            When the corrected values differ, the diff is recorded against the
            audit for parser-improvement analysis.
          properties:
            firstName:
              type: ["string", "null"]
            age:
              type: ["integer", "null"]
            sourceApp:
              type: ["string", "null"]
            bio:
              type: ["string", "null"]
            prompts:
              type: array
              items:
                type: string

    ScreenshotAuditReport:
      type: object
      required: [auditId, extractedBio, extractedPrompts, report]
      properties:
        auditId:
          type: integer
        extractedBio:
          type: string
        extractedPrompts:
          type: array
          items:
            type: string
        rawOcrText:
          type: string
        report:
          $ref: "#/components/schemas/AuditReport"

    DatingProfileInput:
      type: object
      required: [platform, bio]
      properties:
        platform:
          type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    DatingProfileUpdate:
      type: object
      properties:
        platform:
          type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    DatingProfile:
      type: object
      required: [id, platform, bio, createdAt]
      properties:
        id:
          type: integer
        platform:
          type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ProfileRewrite:
      type: object
      required: [profileId, rewrittenBio, rewrittenPrompts, tips]
      properties:
        profileId:
          type: integer
        rewrittenBio:
          type: string
        rewrittenPrompts:
          type: array
          items:
            $ref: "#/components/schemas/RewrittenPrompt"
        tips:
          type: array
          items:
            type: string

    MessageCoachingInput:
      type: object
      required: [matchName, conversationContext, yourLastMessage]
      properties:
        matchName:
          type: string
        conversationContext:
          type: string
        yourLastMessage:
          type: string
        goal:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Dating app the conversation came from (e.g. "Hinge", "Bumble", "Tinder"). Used to tune coach output.

    MessageCoachingSession:
      type: object
      required: [id, matchName, conversationContext, yourLastMessage, createdAt, status]
      properties:
        id:
          type: integer
        matchName:
          type: string
        conversationContext:
          type: string
        yourLastMessage:
          type: string
        goal:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Dating app the conversation came from (e.g. "Hinge", "Bumble", "Tinder").
        status:
          type: string
          enum: [pending, complete]
        createdAt:
          type: string

    MessageCoachingResponse:
      type: object
      required: [sessionId, analysis, suggestedReplies, tone, redFlags, coachTip]
      properties:
        sessionId:
          type: integer
        analysis:
          type: string
        suggestedReplies:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedReply"
        tone:
          type: string
        redFlags:
          type: array
          items:
            type: string
        coachTip:
          type: string

    RehearsalTurn:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [you, them]
        text:
          type: string

    RehearsalTurnInput:
      type: object
      required: [scenario, transcript]
      properties:
        scenario:
          type: string
        theirStyle:
          type: ["string", "null"]
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/RehearsalTurn"

    RehearsalTurnResult:
      type: object
      required: [reply, note, tone, isFallback]
      properties:
        reply:
          type: string
        note:
          type: string
        tone:
          type: string
        isFallback:
          type: boolean

    CoachFollowUpInput:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          enum: [sent, not_sent, snoozed, dismissed]
        sessionId:
          type: ["integer", "null"]

    CoachFollowUpStats:
      type: object
      required:
        [
          totalPrompts,
          sentCount,
          notSentCount,
          snoozeCount,
          dismissCount,
          lastAnsweredAt,
          lastAnswer,
        ]
      properties:
        totalPrompts:
          type: integer
        sentCount:
          type: integer
        notSentCount:
          type: integer
        snoozeCount:
          type: integer
        dismissCount:
          type: integer
        lastAnsweredAt:
          type: ["string", "null"]
        lastAnswer:
          type: ["string", "null"]
          enum: [sent, not_sent, null]

    CoachFollowUpRecorded:
      description: |
        Result of recording a new follow-up answer. Includes the new row's id
        so anonymous callers can persist it locally and pass it to the claim
        endpoint after login.
      type: object
      required:
        [
          followUpId,
          totalPrompts,
          sentCount,
          notSentCount,
          snoozeCount,
          dismissCount,
          lastAnsweredAt,
          lastAnswer,
        ]
      properties:
        followUpId:
          type: integer
          description: ID of the just-inserted coach_follow_ups row.
        totalPrompts:
          type: integer
        sentCount:
          type: integer
        notSentCount:
          type: integer
        snoozeCount:
          type: integer
        dismissCount:
          type: integer
        lastAnsweredAt:
          type: ["string", "null"]
        lastAnswer:
          type: ["string", "null"]
          enum: [sent, not_sent, null]

    CoachFollowUpTimelineBucket:
      type: object
      required: [weekStart, sentCount, notSentCount, snoozeCount, dismissCount, total, sendThroughRate]
      properties:
        weekStart:
          type: string
          description: ISO date for the start of the week (UTC, Monday)
        sentCount:
          type: integer
        notSentCount:
          type: integer
        snoozeCount:
          type: integer
        dismissCount:
          type: integer
        total:
          type: integer
          description: sentCount + notSentCount for this week
        sendThroughRate:
          type: ["number", "null"]
          description: sentCount / total, or null when total is 0

    CoachFollowUpTimeline:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/CoachFollowUpTimelineBucket"

    SuggestedReply:
      type: object
      required: [style, text, rationale]
      properties:
        style:
          type: string
        text:
          type: string
        rationale:
          type: string

    EmailInsightInput:
      type: object
      required: [pastedContent, sourceLabel]
      properties:
        pastedContent:
          type: string
        sourceLabel:
          type: string
        sourceApp:
          type: ["string", "null"]
          description: |
            Where the messages came from. Used to tune communication patterns,
            growth areas, and profile tips. Recognized values include "Hinge",
            "Bumble", "Tinder", "iMessage", and "Email"; anything else is
            treated as unknown.
        consentGiven:
          type: boolean

    EmailInsight:
      type: object
      required: [id, sourceLabel, pastedContent, createdAt, status]
      properties:
        id:
          type: integer
        sourceLabel:
          type: string
