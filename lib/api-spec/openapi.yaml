  /me/time-capsules:
    get:
      tags: [Matching]
      operationId: getTimeCapsules
      summary: List the signed-in user's notes to a future partner
      description: |
        Returns the caller's time-capsule notes, newest first, so they can replay
        what they wrote earlier. The note body is the user's own content shown
        only to them. Distinct notes written feed matching readiness as a
        low-weight intent and values signal.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of notes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeCapsule'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    post:
      tags: [Matching]
      operationId: createTimeCapsule
      summary: Write a note to a future partner
      description: |
        Stores one short note. Notes accumulate over time so the user can return
        and replay them; each distinct note nudges readiness.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeCapsuleInput'
      responses:
        '201':
          description: The stored note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeCapsule'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/wingman:
    get:
      tags: [Matching]
      operationId: getWingmanState
      summary: The signed-in user's Wingman loop state
      description: |
        Returns how many outside perspectives the user has gathered, their own
        self-rating, the averaged friend ratings, the derived self-vs-others gap,
        and their invites. Friend answers are only ever surfaced aggregated, never
        attributed back to an individual friend. Distinct perspectives gathered
        feed matching readiness as the externalCalibration lane.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The user's Wingman state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WingmanState'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/wingman/self:
    put:
      tags: [Matching]
      operationId: setWingmanSelfRating
      summary: Set the signed-in user's own trait self-rating
      description: |
        Stores the user's self-rating on the five traits (1-5 each). Re-rating
        overwrites the previous values. The self-rating is what the friend
        averages are compared against to surface the calibration gap.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WingmanRatingsInput'
      responses:
        '200':
          description: The updated Wingman state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WingmanState'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/wingman/invites:
    post:
      tags: [Matching]
      operationId: createWingmanInvite
      summary: Mint a signed invite link for a friend
      description: |
        Creates an invite and returns a signed, time-limited share path the user
        can send to a friend. The friend opens it with no account and submits five
        1-5 trait scores. The optional friendLabel is a private nickname for the
        owner's own reference and is never shown to the friend.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WingmanInviteInput'
      responses:
        '201':
          description: The created invite with its share path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WingmanInvite'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /wingman/invite/{token}:
    get:
      tags: [Matching]
      operationId: getWingmanInvitePublic
      summary: Public view of an invite (no auth)
      description: |
        Resolves a signed invite token so a friend can see who invited them and
        whether the invite has already been answered. Requires no account. Returns
        404 for an invalid, expired, or unknown token.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The public invite view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WingmanInvitePublic'
        '404':
          description: Invalid, expired, or unknown token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /wingman/invite/{token}/answer:
    post:
      tags: [Matching]
      operationId: answerWingmanInvite
      summary: Submit a friend's trait ratings (no auth)
      description: |
        Records a friend's five 1-5 trait scores for the invite. Requires no
        account. An invite can only be answered once. Only the five scores are
        stored, never any free text, and they are only ever shown back to the
        owner aggregated.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WingmanRatingsInput'
      responses:
        '200':
          description: The answer was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WingmanAnswerAck'
        '400':
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Invalid, expired, or unknown token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '409':
          description: This invite was already answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/proposals:
    get:
      tags: [Matching]
      operationId: getMatchingProposals
      summary: List the signed-in user's current match proposals
      description: |
        Returns the caller's member-visible proposals ordered by createdAt desc.
        External-paste analyses remain visible to their creator. Internal and
        concierge proposals remain private founder-review records until a
        founder explicitly sends the introduction.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of proposals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchProposal'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/discover:
    post:
      tags: [Matching]
      operationId: discoverMatches
      summary: Find and create internal matches for the signed-in user
      description: |
        Runs the deterministic internal matching engine for the caller. Pairs
        them with other eligible pool members, scores compatibility from
        aggregate signals and stated preferences (no raw content, no PII), and
        creates mutual internal review candidates for the top matches, skipping
        any pair that already has an internal proposal in either direction.
        Candidates are not member-visible until a founder explicitly sends the
        introduction. Returns only the caller's already-visible proposal list.
        Requires the caller to be in the pool.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The caller's proposals after discovery.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchProposal'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '422':
          description: Caller is not in the matching pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/echo:
    post:
      tags: [Matching]
      operationId: createMatchingEchoRead
      summary: Echo's read on the signed-in user for matching
      description: |
        Returns Echo's read of the user grounded in their own aggregate signal
        coverage: what the machine can see, the kind of person it would put in
        front of them, the confidence of the read, and the gap to the pool.
        Deterministic baseline is always-on; the Claude layer is opt-in via the
        per-account content consent toggle and daily-capped. Only aggregate or
        derived signal coverage is ever sent to Claude, never raw content.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Echo's read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoMatchRead'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/proposals/{id}/response:
    put:
      tags: [Matching]
      operationId: respondToMatchProposal
      summary: Record the user's interest in a match proposal
      description: |
        Lets the user act on a proposal instead of hitting a dead-end preview.
        Recording interest moves it to user_yes (routing it into the founder
        intro queue); passing moves it to user_no. Only the proposal owner may
        respond, only after the founder has sent the introduction, and only
        while the member lifecycle is still in the proposed state. Founder
        review status and private notes are never returned here.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchProposalResponseInput'
      responses:
        '200':
          description: The updated proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchProposal'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Proposal not found or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public. Searches PUBLIC_OBJECT_SEARCH_PATHS for the
        given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves private object entities uploaded via presigned URLs. The caller
        must be signed in. A profile photo is readable by its owner, and by a
        counterpart in an active connection once the owner turned reveal consent
        on; otherwise the request is refused so private photos never leak by
        path knowledge.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir.
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller may not read this object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/photos:
    get:
      tags: [Photos]
      operationId: getMyPhotos
      summary: List the signed-in user's profile photos
      description: |
        Returns the caller's photos ordered by ordinal, each with a relative
        serving URL. Anonymous callers get a 401.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The caller's photos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfilePhoto'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
    post:
      tags: [Photos]
      operationId: addMyPhoto
      summary: Record a profile photo after uploading it to storage
      description: |
        Persists the normalized object path returned by the storage upload flow
        as a profile photo for the caller. Appends to the end of the order.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProfilePhotoInput'
      responses:
        '201':
          description: The created photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePhoto'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '409':
          description: Maximum number of photos reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/photos/{id}:
    delete:
      tags: [Photos]
      operationId: deleteMyPhoto
      summary: Delete one of the signed-in user's profile photos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The remaining photos after deletion.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfilePhoto'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Photo not found or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/photos/reorder:
    put:
      tags: [Photos]
      operationId: reorderMyPhotos
      summary: Reorder the signed-in user's profile photos
      description: |
        Accepts the full list of photo ids in the desired order. Photos not
        listed keep their relative order after the listed ones.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderPhotosInput'
      responses:
        '200':
          description: The reordered photos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfilePhoto'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/matching/reveal-consent:
    put:
      tags: [Matching]
      operationId: setRevealConsent
      summary: Toggle whether the user shares their reveal card with matches
      description: |
        Off by default. When on, a mutual match can see the caller's curated
        reveal card (name, photos, a few prompts). Never gates being matched.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealConsentInput'
      responses:
        '200':
          description: The updated consent state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealConsentState'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/connections:
    get:
      tags: [Connections]
      operationId: getConnections
      summary: List the signed-in user's match conversations
      description: |
        Returns the caller's connections, most recently active first, each with
        the counterpart id, unread count, and a short preview of the latest
        message.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The caller's connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /me/connections/{id}:
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Get one of the signed-in user's conversations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/connections/{id}/profile:
    get:
      tags: [Connections]
      operationId: getConnectionProfile
      summary: The counterpart's curated reveal card for a conversation
      description: |
        Returns the consented view of the other member: name and photos only if
        they turned reveal consent on, plus an aggregate readiness and values
        summary. Never raw signals or PII.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The reveal card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealCard'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/connections/{id}/starters:
    get:
      tags: [Connections]
      operationId: getConnectionStarters
      summary: Conversation openers for a connection
      description: |
        Three opener suggestions for the signed-in user to send. Generated only
        from reveal-safe aggregate fields (readiness phrasing, the aggregate match
        summary, the compatibility score, and the counterpart's display name when
        they turned reveal consent on). Never raw signals, lane breakdowns, or PII.
        Hybrid: a deterministic baseline always runs, with the deep AI lane layered
        on when the account opted in.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The opener suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStarters'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/connections/{id}/date-ideas:
    post:
      tags: [Connections]
      operationId: suggestConnectionDateIdeas
      summary: Date ideas for a connected pair
      description: |
        A short set of date ideas for the signed-in user and this match, sized to
        where both people are. Location phrasing is reveal-safe: the counterpart's
        city is only named when they turned reveal consent on or both people gave
        the same city, otherwise the copy stays on the signed-in user's own area
        and "near both of you". User-initiated (a POST), so it only spends the deep
        AI lane when the user asks for ideas. Hybrid: a deterministic baseline of
        category templates always runs, with the deep AI lane layered on when the
        account opted in. A maps provider can be dropped in later without changing
        this contract; until then ideas are template-based, never invented venues.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The date ideas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDateIdeas'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/connections/{id}/messages:
    get:
      tags: [Connections]
      operationId: getConnectionMessages
      summary: List the messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The messages, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionMessage'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Connections]
      operationId: sendConnectionMessage
      summary: Send a message in a conversation
      description: |
        Sends a message. The conversation must be active and the pair must not
        be blocked. Rate-limited per sender.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageInput'
      responses:
        '201':
          description: The created message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionMessage'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conversation is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Sending too quickly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/connections/{id}/read:
    post:
      tags: [Connections]
      operationId: markConnectionRead
      summary: Mark the counterpart's messages as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Read acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/connections/{id}/unmatch:
    post:
      tags: [Connections]
      operationId: unmatchConnection
      summary: End a conversation
      description: |
        Closes the conversation symmetrically. Once closed neither side can
        send. A later mutual match reopens it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The closed connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /me/connections/{id}/report:
    post:
      tags: [Connections]
      operationId: reportConnection
      summary: Report the counterpart and close the conversation
      description: |
        Files a member report about the other person and closes the thread.
        Reporting never moves Match Readiness.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportConnectionInput'
      responses:
        '200':
          description: The closed connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: string
          enum: [member, founder, admin]
          description: UI hint for role-gated navigation. The server re-checks the persisted role on every privileged request.
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        push_token:
          type: string
          minLength: 1
          description: |
            Expo push token for the signing-in device, if available. When
            provided, this token is excluded from the recipients of the
            new-sign-in push notification so the device performing the
            sign-in doesn't notify itself.
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    AuthErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ClaimAnonymousInput:
      type: object
      properties:
        auditIds:
          type: array
          items:
            type: integer
        profileIds:
          type: array
          items:
            type: integer
        messageSessionIds:
          type: array
          items:
            type: integer
        insightIds:
          type: array
          items:
            type: integer
        followUpIds:
          type: array
          items:
            type: integer
        journalEntryIds:
          type: array
          items:
            type: integer
        postDateNoteIds:
          type: array
          items:
            type: integer
    AnonymousClaimHandoff:
      type: object
      required: [handoff, expiresAt]
      properties:
        handoff:
          type: string
          description: Opaque signed token. Treat as a secret — anyone holding it can claim the underlying anonymous data after signing in before it expires.
        expiresAt:
          type: string
          format: date-time
    AnonymousClaimHandoffStatusInput:
      type: object
      required: [handoff]
      properties:
        handoff:
          type: string
          minLength: 1
    AnonymousClaimHandoffStatus:
      type: object
      required: [redeemed, expired]
      properties:
        redeemed:
          type: boolean
          description: True once the handoff token's `jti` has been recorded in `handoff_token_redemptions` (i.e. the other device successfully claimed the data).
        expired:
          type: boolean
          description: True once the token's TTL has passed. Mutually compatible with `redeemed` — a token may be both redeemed and expired.
        expiresAt:
          type: string
          format: date-time
          description: The token's expiry timestamp. Omitted if the token can't be verified.
    RedeemAnonymousClaimHandoffInput:
      type: object
      required: [handoff]
      properties:
        handoff:
          type: string
          minLength: 1
        auditIds:
          type: array
          items:
            type: integer
        profileIds:
          type: array
          items:
            type: integer
        messageSessionIds:
          type: array
          items:
            type: integer
        insightIds:
          type: array
          items:
            type: integer
        followUpIds:
          type: array
          items:
            type: integer
        journalEntryIds:
          type: array
          items:
            type: integer
        postDateNoteIds:
          type: array
          items:
            type: integer
    ClaimAnonymousResult:
      type: object
      required: [claimed]
      properties:
        claimed:
          type: object
          required: [audits, profiles, messages, insights, followUps, journalEntries, postDateNotes]
          properties:
            audits:
              type: integer
            profiles:
              type: integer
            messages:
              type: integer
            insights:
              type: integer
            followUps:
              type: integer
            journalEntries:
              type: integer
            postDateNotes:
              type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuditInput:
      type: object
      required: [firstName, age, gender, orientation, datingGoal, currentApps, bio]
      properties:
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]

    InsufficientAuditEvidence:
      type: object
      required: [error, message, fields, reasons]
      properties:
        error:
          type: string
          const: insufficient_evidence
        message:
          type: string
        fields:
          type: array
          items:
            type: string
        reasons:
          type: array
          items:
            type: string

    ProfileProjectAuditResult:
      type: object
      required: [audit, report]
      properties:
        audit:
          $ref: "#/components/schemas/Audit"
        report:
          $ref: "#/components/schemas/AuditReport"

    Audit:
      type: object
      required: [id, firstName, age, gender, datingGoal, currentApps, bio, createdAt, status, source]
      properties:
        id:
          type: integer
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Dating app the audit originated from (e.g. "Hinge"), detected from OCR or supplied by the client.
        status:
          type: string
          enum: [pending, generating, complete, error]
        source:
          type: string
          enum: [manual, screenshot]
        readinessScore:
          type: ["integer", "null"]
        report:
          oneOf:
            - $ref: "#/components/schemas/AuditReport"
            - type: "null"
          description: |
            The persisted mini-report generated at scan time. Present for newer
            audits; older audits without a stored report return null and the
            client should fall back to calling `generateAuditReport`.
        reportGeneratedAt:
          type: ["string", "null"]
          description: ISO timestamp the stored report was generated. Null if no report has been generated yet.
        previousReport:
          oneOf:
            - $ref: "#/components/schemas/AuditReport"
            - type: "null"
          description: |
            The mini-report from the immediately prior regeneration, kept so
            users can see what changed. Null when the audit has never been
            regenerated (or the report has never been generated).
        previousReadinessScore:
          type: ["integer", "null"]
          description: Readiness score from the prior regeneration (null if never regenerated).
        previousReportGeneratedAt:
          type: ["string", "null"]
          description: ISO timestamp of the prior regeneration's report (null if never regenerated).
        createdAt:
          type: string
        deletedAt:
          type: ["string", "null"]
          description: |
            ISO timestamp when the audit was soft-deleted. Null for active
            audits. Soft-deleted audits are filtered out of regular list
            endpoints and only appear under `/audits/trash`; they are auto-
            purged after 30 days.
        matchContext:
          oneOf:
            - $ref: "#/components/schemas/AuditMatchContext"
            - type: "null"
          description: |
            Present only when a search query (`q`) was supplied to `GET /audits`.
            Indicates which field (name or bio) was the primary match source and,
            for bio matches, a short excerpt around the matched text so users can
            see why the result appeared.

    CorrectSourceAppInput:
      type: object
      required: [correctedApp]
      properties:
        correctedApp:
          type: ["string", "null"]
          description: |
            The app the user says the audit actually came from. One of "Hinge",
            "Bumble", "Tinder", "Grindr", "Feeld", "HER", "OkCupid",
            "CoffeeMeetsBagel". Pass null to mark the app as
            unknown/unrecognised.

    CorrectSourceAppResult:
      type: object
      required: [success, sourceApp]
      properties:
        success:
          type: boolean
          const: true
        sourceApp:
          type: ["string", "null"]
          description: The updated sourceApp value now stored on the audit.

    AuditMatchContext:
      type: object
      required: [matchedField]
      properties:
        matchedField:
          type: string
          enum: [name, bio]
          description: The field that best matched the search query.
        snippet:
          type: ["string", "null"]
          description: |
            A short excerpt from the bio showing the context around the match.
            Only present when `matchedField` is `bio`.

    AuditReport:
      type: object
      required: [auditId, readinessScore, overallGrade, strengths, risks, bioAudit, rewrittenBio, rewrittenPrompts, photoGuidance, actionPlan, messagingStyle, coachingCta]
      properties:
        auditId:
          type: integer
        readinessScore:
          type: integer
        overallGrade:
          type: string
        strengths:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        bioAudit:
          type: string
        rewrittenBio:
          type: string
        rewrittenPrompts:
          type: array
          items:
            $ref: "#/components/schemas/RewrittenPrompt"
        photoGuidance:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuidanceItem"
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/ActionPlanItem"
        messagingStyle:
          type: string
        coachingCta:
          type: string
        engineVersion:
          type: ["string", "null"]
          description: |
            Version tag of the deterministic engine that produced this report.
            Older saved reports may be missing this field; clients should treat
            a missing or non-matching value as stale and offer a re-run.
        changeSummary:
          oneOf:
            - $ref: "#/components/schemas/ReportChangeSummary"
            - type: "null"
          description: |
            A short "what changed since last time" diff vs the immediately prior
            run. Only populated on regeneration responses (and the freshly-saved
            report). Null on the very first generation or when no prior report
            exists to compare against.
        photoAnalysis:
          oneOf:
            - $ref: "#/components/schemas/PhotoAnalysis"
            - type: "null"
          description: |
            Real AI vision read of the actual profile photo(s) in the uploaded
            screenshot. Present only when the signed-in user opted into the deep
            AI lane (ai_content_consent) and the vision call succeeded; otherwise
            null, and the deterministic photoGuidance checklist is the fallback.
            The raw image is never stored; it is analyzed in memory and discarded.

    PhotoAnalysis:
      type: object
      required: [summary, observations, topFix]
      properties:
        summary:
          type: string
          description: One or two sentence overall read of the photos actually seen.
        observations:
          type: array
          items:
            $ref: "#/components/schemas/PhotoObservation"
        topFix:
          type: string
          description: The single highest-impact change to make to the photos.

