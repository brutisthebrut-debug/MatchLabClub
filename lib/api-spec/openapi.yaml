            type: string
            maxLength: 40
        - name: dateFrom
          in: query
          required: false
          description: ISO-8601 inclusive lower bound. Parsed server-side via `new Date(...)`.
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          description: ISO-8601 inclusive upper bound. Parsed server-side via `new Date(...)`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
