    delete:
      tags: [mirror]
      operationId: deletePostDateNote
      summary: Soft-delete a post-date note
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
