        money:
          type: integer
          minimum: 1
          maximum: 5
          description: Money headspace (1 stressed, 5 unbothered).
        headspace:
          type: integer
          minimum: 1
          maximum: 5
          description: General mental clarity (1 foggy, 5 sharp).
        note:
          type: [string, 'null']
          maxLength: 500
          description: Optional short note about today.

    LifePulse:
      type: object
      required: [id, sleep, energy, social, money, headspace, createdAt]
      properties:
        id:
          type: integer
        sleep:
          type: integer
        energy:
          type: integer
        social:
          type: integer
        money:
          type: integer
        headspace:
          type: integer
        note:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    LifePulseRecent:
      type: object
      required: [pulses, latest]
      properties:
        pulses:
          type: array
          items:
            $ref: '#/components/schemas/LifePulse'
          description: Most recent pulses for the current user/anon scope, newest first, capped at 30.
        latest:
          oneOf:
            - $ref: '#/components/schemas/LifePulse'
