  /messages/extract-screenshot:
    post:
      operationId: extractMessageScreenshot
      tags: [messages]
      summary: OCR a chat screenshot and return conversation text + detected source app
      description: |
        Accepts a base64-encoded screenshot of a dating-app chat and returns the
        OCR-extracted conversation text plus the detected source app (Hinge,
        Bumble, Tinder). No coaching session is persisted — the client should
        seed the coach form with these values and let the user correct
        anything before submitting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatScreenshotExtractInput"
      responses:
        "200":
          description: Extracted chat text and detected source app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatScreenshotExtractResult"
        "400":
          description: Invalid image or no readable text found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/safety/report:
    post:
      operationId: reportUser
      tags: [Auth]
      summary: Report another member for a Trust & Safety concern
      description: |
        Files a report against another member. The report is queued for founder
        review and never auto-acts. Reporting someone does not block them; the
        client should offer block as a separate step.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportUserInput"
      responses:
        "201":
          description: The report was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAck"
        "401":
          description: Not authenticated.

  /me/safety/block:
    post:
      operationId: blockUser
      tags: [Auth]
      summary: Block another member
      description: |
        Blocks another member. Blocking is a hard, symmetric gate in the matching
        engine: once a block exists in either direction, neither person can be
        proposed the other. Any existing internal match proposals between the two
        are removed. Blocking is idempotent.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserInput"
      responses:
        "201":
          description: The block was created (or already existed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyBlock"
        "401":
          description: Not authenticated.
    get:
      operationId: listSafetyBlocks
      tags: [Auth]
      summary: List the members the caller has blocked
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: The caller's active blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyBlockList"
        "401":
          description: Not authenticated.

  /me/safety/block/{blockedUserId}:
    delete:
      operationId: unblockUser
      tags: [Auth]
      summary: Remove a block (undo)
      parameters:
        - name: blockedUserId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: The block was removed (or did not exist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnblockAck"
        "401":
          description: Not authenticated.

  /me/safety/message-check:
    post:
      operationId: checkOutgoingMessage
      tags: [Auth]
      summary: Screen an outgoing message for romance-scam red flags before sending
      description: |
        Runs a pre-send safety check on a message the caller is about to send.
        The deterministic engine screens every request with no key and no
        external call, so the nudge is always available. When the deep AI lane
        is on and the deterministic screen already found something worth a
        closer look, Claude refines the read; any failure, missing consent, or
        daily-cap hit silently keeps the deterministic result. Nothing is
        stored. risk is none, low, or elevated.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageSafetyCheckInput"
      responses:
        "200":
          description: The safety screen for the draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyCheck"
        "401":
          description: Not authenticated.

  /founder/reports:
    get:
      operationId: getFounderReports
      tags: [founder]
      summary: List member reports for founder review
      description: |
        Returns Trust & Safety reports for the founder review queue, newest
        first. Requires an authenticated founder role.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
