          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatingProfile"
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Save a dating profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatingProfileInput"
      responses:
        "201":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatingProfile"

  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a dating profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatingProfile"
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update a dating profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatingProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatingProfile"
    delete:
      operationId: deleteProfile
      tags: [profiles]
      summary: Delete a saved dating profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProfileResult"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /profiles/{id}/rewrite:
    post:
      operationId: rewriteProfileBio
      tags: [profiles]
      summary: Generate AI-rewritten bio and prompts for a profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rewritten bio and prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRewrite"

  /messages:
    get:
      operationId: listMessageCoachingSessions
      tags: [messages]
      summary: List message coaching sessions
      responses:
        "200":
          description: List of coaching sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageCoachingSession"
    post:
      operationId: createMessageCoachingSession
      tags: [messages]
      summary: Create a message coaching session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCoachingInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCoachingSession"

  /messages/{id}/coach:
    post:
      operationId: coachMessage
      tags: [messages]
      summary: Get AI coaching advice for a specific message session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coaching response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCoachingResponse"

  /messages/extract-screenshot:
    post:
      operationId: extractMessageScreenshot
      tags: [messages]
      summary: OCR a chat screenshot and return conversation text + detected source app
      description: |
        Accepts a base64-encoded screenshot of a dating-app chat and returns the
        OCR-extracted conversation text plus the detected source app (Hinge,
        Bumble, Tinder). No coaching session is persisted — the client should
        seed the coach form with these values and let the user correct
        anything before submitting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatScreenshotExtractInput"
      responses:
        "200":
          description: Extracted chat text and detected source app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatScreenshotExtractResult"
        "400":
          description: Invalid image or no readable text found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /coach/follow-ups:
    post:
      operationId: recordCoachFollowUp
      tags: [messages]
      summary: Record whether the user sent a coached reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachFollowUpInput"
      responses:
        "200":
          description: New follow-up id plus updated send-through stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachFollowUpRecorded"

  /coach/follow-ups/stats:
    get:
      operationId: getCoachFollowUpStats
      tags: [messages]
      summary: Get aggregate send-through stats for the current account
      responses:
        "200":
          description: Send-through stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachFollowUpStats"

  /coach/follow-ups/timeline:
    get:
      operationId: getCoachFollowUpTimeline
      tags: [messages]
      summary: Get weekly send-through buckets for the current account
      responses:
        "200":
          description: Weekly send-through buckets (most recent 8 weeks, oldest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachFollowUpTimeline"

  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List email insight imports
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailInsight"
    post:
      operationId: createInsight
      tags: [insights]
      summary: Submit email/message history for communication pattern analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInsightInput"
      responses:
        "201":
          description: Created insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInsight"

  /insights/rollup:
    get:
      operationId: getInsightsRollup
      tags: [insights]
      summary: Cross-import communication pattern rollup grouped by source app
      responses:
        "200":
          description: Per-source rollup and cross-source comparisons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsRollup"

  /insights/{id}:
    delete:
      operationId: deleteInsight
      tags: [insights]
      summary: Delete an insight import owned by the current session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Insight deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteInsightResult"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /insights/{id}/analyze:
    post:
      operationId: analyzeInsight
      tags: [insights]
      summary: Run AI analysis on pasted email/message history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInsightAnalysis"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the podcast launch waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
    get:
      operationId: getWaitlistStats
      tags: [waitlist]
      summary: Get waitlist stats (count, spots remaining)
      responses:
        "200":
          description: Waitlist stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStats"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get current AI integration status
      description: Returns whether OpenAI is connected, in fallback mode, or needs setup.
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"

  /ai/enhance:
    post:
      operationId: enhanceAi
      tags: [ai]
      summary: Run a tool-specific AI generation with graceful fallback
      description: Public endpoint used by client tools (Blueprint, NextMessage, etc.) to enhance deterministic output with live AI when an API key is configured. Falls back silently to an empty output if AI is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEnhanceInput"
      responses:
        "200":
          description: AI enhancement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /ai/fallback-rate:
    get:
      operationId: getAiFallbackRate
      tags: [ai]
      summary: Get recent fallback rate for a single AI tool
      description: |
        Returns the number of fallback (coach-written) answers out of the most
        recent `windowSize` AI requests for the given tool name. Public,
        unauthenticated — intended for a small "X of last N used the backup"
        transparency indicator on each AI tool page. Returns zeros when there
        is no data yet.
      parameters:
        - name: toolName
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: windowSize
          in: query
          required: false
          description: How many recent requests to consider (1-200, defaults to 20).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Recent fallback counts for the tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFallbackRate"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /ai/test:
    post:
      operationId: testAi
      tags: [ai]
      summary: Send a sample prompt through the server-side AI helper
      description: Safe diagnostic endpoint — runs a tiny generation request. Requires founder key. Falls back gracefully if AI is unavailable.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
        - name: key
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTestInput"
      responses:
        "200":
          description: AI test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/purge-trash:
    post:
      operationId: purgeTrashNow
      tags: [founder]
      summary: Manually trigger an immediate audit trash purge
      description: |
        Runs `purgeExpiredTrashedAudits()` synchronously and returns the number
        of records deleted. Useful after adjusting the retention window or to
        confirm the purge job is working without waiting for the timer.
        Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPurgeResult"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /founder/trash-purge-heartbeat:
    get:
      operationId: getTrashPurgeHeartbeat
      tags: [founder]
      summary: When did the audit trash purge job last succeed?
      description: |
        Returns the timestamp of the last successful `audit_trash_purge` job run,
        together with the elapsed time and a staleness flag. Requires founder key.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trash purge heartbeat status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPurgeHeartbeat"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    AuthErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ClaimAnonymousInput:
      type: object
      properties:
        auditIds:
          type: array
          items:
            type: integer
        profileIds:
          type: array
          items:
            type: integer
        messageSessionIds:
          type: array
          items:
            type: integer
        insightIds:
          type: array
          items:
            type: integer
        followUpIds:
          type: array
          items:
            type: integer
    AnonymousClaimHandoff:
      type: object
      required: [handoff, expiresAt]
      properties:
        handoff:
          type: string
          description: Opaque signed token. Treat as a secret — anyone holding it can claim the underlying anonymous data after signing in before it expires.
        expiresAt:
          type: string
          format: date-time
    RedeemAnonymousClaimHandoffInput:
      type: object
      required: [handoff]
      properties:
        handoff:
          type: string
          minLength: 1
        auditIds:
          type: array
          items:
            type: integer
        profileIds:
          type: array
          items:
            type: integer
        messageSessionIds:
          type: array
          items:
            type: integer
        insightIds:
          type: array
          items:
            type: integer
        followUpIds:
          type: array
          items:
            type: integer
    ClaimAnonymousResult:
      type: object
      required: [claimed]
      properties:
        claimed:
          type: object
          required: [audits, profiles, messages, insights, followUps]
          properties:
            audits:
              type: integer
            profiles:
              type: integer
            messages:
              type: integer
            insights:
              type: integer
            followUps:
              type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuditInput:
      type: object
      required: [firstName, age, gender, orientation, datingGoal, currentApps, bio]
      properties:
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]

    Audit:
      type: object
      required: [id, firstName, age, gender, datingGoal, currentApps, bio, createdAt, status, source]
      properties:
        id:
          type: integer
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Dating app the audit originated from (e.g. "Hinge"), detected from OCR or supplied by the client.
        status:
          type: string
          enum: [pending, generating, complete, error]
        source:
          type: string
          enum: [manual, screenshot]
        readinessScore:
          type: ["integer", "null"]
        report:
          oneOf:
            - $ref: "#/components/schemas/AuditReport"
            - type: "null"
          description: |
            The persisted mini-report generated at scan time. Present for newer
            audits; older audits without a stored report return null and the
            client should fall back to calling `generateAuditReport`.
        reportGeneratedAt:
          type: ["string", "null"]
          description: ISO timestamp the stored report was generated. Null if no report has been generated yet.
        previousReport:
          oneOf:
            - $ref: "#/components/schemas/AuditReport"
            - type: "null"
          description: |
            The mini-report from the immediately prior regeneration, kept so
            users can see what changed. Null when the audit has never been
            regenerated (or the report has never been generated).
        previousReadinessScore:
          type: ["integer", "null"]
          description: Readiness score from the prior regeneration (null if never regenerated).
        previousReportGeneratedAt:
          type: ["string", "null"]
          description: ISO timestamp of the prior regeneration's report (null if never regenerated).
        createdAt:
          type: string
        deletedAt:
          type: ["string", "null"]
          description: |
            ISO timestamp when the audit was soft-deleted. Null for active
            audits. Soft-deleted audits are filtered out of regular list
            endpoints and only appear under `/audits/trash`; they are auto-
            purged after 30 days.
        matchContext:
          oneOf:
            - $ref: "#/components/schemas/AuditMatchContext"
            - type: "null"
          description: |
            Present only when a search query (`q`) was supplied to `GET /audits`.
            Indicates which field (name or bio) was the primary match source and,
            for bio matches, a short excerpt around the matched text so users can
            see why the result appeared.

    CorrectSourceAppInput:
      type: object
      required: [correctedApp]
      properties:
        correctedApp:
          type: ["string", "null"]
          description: |
            The app the user says the audit actually came from — one of "Hinge",
            "Bumble", "Tinder", "CoffeeMeetsBagel". Pass null to mark the app
            as unknown/unrecognised.

    CorrectSourceAppResult:
      type: object
      required: [success, sourceApp]
      properties:
        success:
          type: boolean
          const: true
        sourceApp:
          type: ["string", "null"]
          description: The updated sourceApp value now stored on the audit.

    AuditMatchContext:
      type: object
      required: [matchedField]
      properties:
        matchedField:
          type: string
          enum: [name, bio]
          description: The field that best matched the search query.
        snippet:
          type: ["string", "null"]
          description: |
            A short excerpt from the bio showing the context around the match.
            Only present when `matchedField` is `bio`.

    AuditReport:
      type: object
      required: [auditId, readinessScore, overallGrade, strengths, risks, bioAudit, rewrittenBio, rewrittenPrompts, photoGuidance, actionPlan, messagingStyle, coachingCta]
      properties:
        auditId:
          type: integer
        readinessScore:
          type: integer
        overallGrade:
          type: string
        strengths:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        bioAudit:
          type: string
        rewrittenBio:
          type: string
        rewrittenPrompts:
          type: array
          items:
            $ref: "#/components/schemas/RewrittenPrompt"
        photoGuidance:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuidanceItem"
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/ActionPlanItem"
        messagingStyle:
          type: string
        coachingCta:
          type: string
        engineVersion:
          type: ["string", "null"]
          description: |
            Version tag of the deterministic engine that produced this report.
            Older saved reports may be missing this field; clients should treat
            a missing or non-matching value as stale and offer a re-run.
        changeSummary:
          oneOf:
            - $ref: "#/components/schemas/ReportChangeSummary"
            - type: "null"
          description: |
            A short "what changed since last time" diff vs the immediately prior
            run. Only populated on regeneration responses (and the freshly-saved
            report). Null on the very first generation or when no prior report
            exists to compare against.

    ReportChangeSummary:
      type: object
      required: [scoreDelta, previousScore, newScore, addedStrengths, removedStrengths, addedRisks, removedRisks]
      properties:
        scoreDelta:
          type: integer
          description: newScore minus previousScore (negative when the score dropped).
        previousScore:
          type: integer
        newScore:
          type: integer
        addedStrengths:
          type: array
          items:
            type: string
          description: Strengths present in the new report but not in the prior one.
        removedStrengths:
          type: array
          items:
            type: string
          description: Strengths from the prior report that no longer appear.
        addedRisks:
          type: array
          items:
            type: string
        removedRisks:
          type: array
          items:
            type: string

    AuditReportVersion:
      type: object
      required: [id, auditId, readinessScore, report, generatedAt]
      properties:
        id:
          type: integer
        auditId:
          type: integer
        readinessScore:
          type: integer
        report:
          $ref: "#/components/schemas/AuditReport"
        changeSummary:
          oneOf:
            - $ref: "#/components/schemas/ReportChangeSummary"
            - type: "null"
          description: |
            "What changed since last time" diff at the moment this version was
            generated. Null for the first generation of an audit.
        engineVersion:
          type: ["string", "null"]
          description: Engine version tag at the time this version was produced.
        generatedAt:
          type: string
          description: ISO timestamp this version was generated.

    AuditReportVersionList:
      type: object
      required: [auditId, versions]
      properties:
        auditId:
          type: integer
        versions:
          type: array
          description: Report versions for this audit, newest first.
          items:
            $ref: "#/components/schemas/AuditReportVersion"

    RewrittenPrompt:
      type: object
      required: [original, rewritten, tip]
      properties:
        original:
          type: string
        rewritten:
          type: string
        tip:
          type: string

    PhotoGuidanceItem:
      type: object
      required: [category, status, advice]
      properties:
