      type: object
      required: [day, score]
      properties:
        day:
          type: string
          description: Calendar day (YYYY-MM-DD, UTC) of the snapshot.
        score:
          type: integer
          minimum: 0
          maximum: 100

    OutcomeInsight:
      type: object
      required: [totalDates, anotherDate, noMore, ghosted, unsure, headline]
      properties:
        totalDates:
          type: integer
          minimum: 0
        anotherDate:
          type: integer
          minimum: 0
        noMore:
          type: integer
          minimum: 0
        ghosted:
          type: integer
          minimum: 0
        unsure:
          type: integer
          minimum: 0
        headline:
          type: string
          description: One spoken-English read of the user's recent date outcomes.

    ReadinessLearning:
      type: object
      description: >-
        A derived, user-facing read of how the engine is learning from the
        caller's own logged date outcomes. Carries only aggregate, derived
        numbers (scores and lane labels), never raw notes or any PII. When
        observing is true the engine is watching the would-be tilt without
        changing the score the user is served (shadow), so this is informational
        and does not claim the matching gate moved.
      required: [observing, applied, headline, totalDates, baseScore, observedScore, delta, leaningInto]
      properties:
        observing:
          type: boolean
          description: >-
            True when outcome-driven re-weighting is being computed (shadow or
            applied). False when held at day-one weights.
        applied:
          type: boolean
          description: >-
            True only when the tilt is actually serving this user's score
            (applied mode and in the rollout cohort). False in shadow or hold, so
            the UI must not claim the matching gate moved unless this is true.
        headline:
          type: string
          description: Spoken-English read of what the recent outcomes suggest.
        totalDates:
          type: integer
          minimum: 0
          description: How many date outcomes the user has logged.
        baseScore:
          type: integer
          minimum: 0
          maximum: 100
          description: The day-one readiness score, served to the user today.
        observedScore:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            The would-be readiness score if the outcome tilt were applied.
            Observational only in shadow mode.
        delta:
          type: integer
          description: observedScore minus baseScore. Can be negative.
        leaningInto:
          type: array
          description: >-
            Plain-English labels of the signal lanes the tilt is leaning into,
            given the recent outcomes. Empty when nothing is being tilted yet.
          items:
            type: string

    MatchingState:
      type: object
      required: [preferences, poolStatus, tier, readiness, eligible, readinessThreshold, cityDensity, totalPoolCount, nextActions, history, outcomeInsight]
      properties:
        preferences:
          oneOf:
            - $ref: '#/components/schemas/MatchPreferences'
            - type: 'null'
        poolStatus:
          type: string
          enum: [off, building, ready, paused, concierge_only]
        revealConsent:
          type: boolean
          description: >-
            Whether the member lets a mutual match see their reveal card (name +
            photos). Off by default; never gates being matched.
        tier:
          type: [string, 'null']
          enum: [free, reset, wingman, null]
        readiness:
          $ref: '#/components/schemas/MatchReadiness'
        eligible:
          type: boolean
          description: >-
            True when readiness.score is at or above readinessThreshold. The
            client uses this to gate the pool opt-in switch.
        readinessThreshold:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Minimum readiness score required to join the matching pool, set by
            the MATCHING_READINESS_THRESHOLD env var (default 50).
        cityDensity:
          type: integer
          minimum: 0
        totalPoolCount:
          type: integer
          minimum: 0
        nextActions:
          type: array
          description: >-
            Ranked "do this next" steps that would move readiness toward the
            threshold most. Empty when the user is already eligible.
          items:
            $ref: '#/components/schemas/ReadinessNextAction'
        history:
          type: array
          description: >-
            Daily readiness snapshots, oldest first, for the trend line. Up to
            ~30 points.
          items:
            $ref: '#/components/schemas/ReadinessHistoryPoint'
        readinessDelta:
          oneOf:
            - $ref: '#/components/schemas/ReadinessDelta'
            - type: 'null'
          description: >-
            What moved between the two most recent daily readiness snapshots, or
            null until there are at least two snapshots to compare.
        outcomeInsight:
          $ref: '#/components/schemas/OutcomeInsight'
        activityStreak:
          $ref: '#/components/schemas/ActivityStreak'
        readinessLearning:
          $ref: '#/components/schemas/ReadinessLearning'

    ReadinessDelta:
      type: object
      description: >-
        The change in matching readiness between the two most recent daily
        snapshots. scoreDelta is the change in the overall readiness score
        (can be negative). lanes lists the signal lanes whose coverage changed,
        biggest absolute move first. Derived only, never includes raw content.
      required: [scoreDelta, fromDay, toDay, lanes]
      properties:
        scoreDelta:
          type: integer
          description: Change in the overall readiness score since the prior snapshot.
        fromDay:
          type: string
          format: date
          description: Calendar day (UTC) of the prior snapshot being compared against.
        toDay:
          type: string
          format: date
          description: Calendar day (UTC) of the most recent snapshot.
        lanes:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessDeltaLane'

    ReadinessDeltaLane:
      type: object
      required: [key, delta]
      properties:
        key:
          type: string
          description: Signal lane id, matching a MatchReadinessBreakdown key.
        delta:
          type: integer
          description: Coverage change for this lane (0-100 scale), can be negative.

    MatchingBenchmarks:
      type: object
      description: >-
        The caller's anonymized per-lane standing against the cohort of users
        who share their normalized dating goal. Derived only (coverage maps +
        goal bucket, never identities or raw content). When available is false
        the cohort is below the minimum size and lanes is empty.
      required: [available, goal, cohortSize, minCohort, lanes]
      properties:
        available:
          type: boolean
          description: >-
            True only when the goal cohort meets the minimum size. When false,
            lanes is empty and no percentile is revealed.
        goal:
          type: string
          description: >-
            The normalized goal bucket the cohort is built from (e.g.
            long-term, casual, friends-first, exploring).
        cohortSize:
          type: integer
          minimum: 0
          description: Number of other users in the caller's goal cohort.
        minCohort:
          type: integer
          minimum: 0
          description: Minimum cohort size required before benchmarks are shown.
        lanes:
          type: array
          description: Per-lane standing, one entry per readiness signal lane.
          items:
            $ref: '#/components/schemas/BenchmarkLane'

    BenchmarkLane:
      type: object
      required: [key, coverage, cohortMedian, percentile]
      properties:
        key:
          type: string
          description: Signal lane id, matching a MatchReadinessBreakdown key.
        coverage:
          type: integer
          minimum: 0
          maximum: 100
          description: The caller's own coverage for this lane.
        cohortMedian:
          type: integer
          minimum: 0
          maximum: 100
          description: The cohort's median coverage for this lane.
        percentile:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Where the caller sits within the cohort for this lane, as a
            percentile (share of the cohort at or below the caller's coverage).

    UserJourneySummary:
      type: object
      description: >-
        A user-scoped weekly momentum recap derived from the caller's own
        journey events. Only derived counts are returned, never raw content,
        and it never includes any other user's activity.
      required:
        - signalsFedThisWeek
        - readinessGainedThisWeek
        - toolsCompletedThisWeek
        - hasHistory
      properties:
        signalsFedThisWeek:
          type: integer
          minimum: 0
          description: Count of signals the caller fed in the last 7 days.
        readinessGainedThisWeek:
          type: integer
          minimum: 0
          description: >-
            Total readiness points the caller gained in the last 7 days,
            summed from their readiness-gain events.
        toolsCompletedThisWeek:
          type: integer
          minimum: 0
          description: Count of tools the caller completed in the last 7 days.
        hasHistory:
          type: boolean
          description: >-
            True when the caller has any journey event on record, so the
            client can show a first-week welcome state instead of zeros.

    Achievement:
      type: object
      description: >-
        A single unlock on the climb. Derived only from the caller's aggregate
        progress; it never affects the readiness score and never carries raw
        content.
      required:
        - id
        - title
        - description
        - icon
        - tier
        - unit
        - target
        - progress
        - unlocked
      properties:
        id:
          type: string
          description: Stable unlock id.
        title:
          type: string
          description: Short unlock name.
        description:
          type: string
          description: One-line description of what earns the unlock.
        icon:
          type: string
          description: lucide-react icon name, resolved on the client.
        tier:
          type: string
          enum: [bronze, silver, gold]
          description: Visual tier of the unlock.
        unit:
          type: string
          description: Short noun for progress copy, e.g. "signals" or "days".
        target:
          type: integer
          minimum: 1
          description: >-
            Value the metric must reach to unlock. The "match ready" unlock uses
            the live readiness threshold.
        progress:
          type: integer
          minimum: 0
          description: Current progress toward the target, clamped to the target.
        unlocked:
          type: boolean
          description: True when the unlock has been earned.

    UserAchievements:
      type: object
      description: >-
        The caller's full unlock board plus a simple unlocked/total tally. Purely
        derived gamification; never feeds the readiness score.
      required:
        - achievements
        - unlockedCount
        - totalCount
      properties:
        achievements:
          type: array
          description: Every unlock, locked and unlocked, in journey order.
          items:
            $ref: '#/components/schemas/Achievement'
        unlockedCount:
          type: integer
          minimum: 0
          description: How many unlocks the caller has earned.
        totalCount:
          type: integer
          minimum: 0
          description: Total number of unlocks on the board.

    SignalMapLane:
      type: object
      description: >-
        One lane of the signal-density map: a single signal source the machine
        reads, with how full it is, how much it counts, and the action that
        fills it. Derived from the signal registry plus the caller's own
        coverage; it carries no raw content.
      required:
        - id
        - label
        - coverage
        - weightPercent
        - confidence
        - dimensions
        - hasSignal
        - action
      properties:
        id:
          type: string
          description: Stable lane id, matches the readiness breakdown key.
        label:
          type: string
          description: Human label for the lane.
        coverage:
          type: integer
          minimum: 0
          maximum: 100
          description: How full this lane is, from the readiness breakdown.
        weightPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            How much this lane counts toward the overall density, as a
            whole-number percentage of the effective weights.
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Rough confidence in this lane's predictive value.
        dimensions:
          type: array
          description: Wellness or personality dimensions this lane informs.
          items:
            type: string
        hasSignal:
          type: boolean
          description: True once the lane has any signal at all.
        action:
          type: object
          description: The single do-this-next action that fills this lane.
          required: [label, detail, href]
          properties:
            label:
              type: string
            detail:
              type: string
            href:
              type: string

    SignalMap:
      type: object
      description: >-
        The caller's signal-density map: every lane the machine reads plus a
        simple aggregate. The overall density equals the readiness score, since
        the map is derived from the same breakdown and weights. Purely a
        presentation lens; never feeds the readiness score.
      required:
        - densityPercent
        - lanesActive
        - totalLanes
        - lanes
        - topBlindSpot
      properties:
        densityPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Overall fullness of the picture, equal to the readiness score (the
            weighted coverage across every lane).
        lanesActive:
          type: integer
          minimum: 0
          description: How many lanes have any signal.
        totalLanes:
          type: integer
          minimum: 0
          description: Total number of lanes the machine reads.
        lanes:
          type: array
          description: >-
            Every lane, active ones first (fullest coverage first), then blind
            spots ordered by how much filling them would matter.
          items:
            $ref: '#/components/schemas/SignalMapLane'
        topBlindSpot:
          description: >-
            The highest-leverage empty lane, or null when every lane already
            has signal.
          oneOf:
            - $ref: '#/components/schemas/SignalMapLane'
            - type: 'null'

    ActivityStreak:
      type: object
      description: >-
        A gamification lens on how consistently the user feeds any signal. Purely
        derived from activity history; it never affects the readiness score.
      required: [current, longest, activeToday, daysActiveLast14]
      properties:
        current:
          type: integer
          minimum: 0
          description: >-
            Consecutive active days ending today, or yesterday if today is not
            yet active. 0 once the run has lapsed.
        longest:
          type: integer
          minimum: 0
          description: Longest consecutive run of active days ever.
        activeToday:
          type: boolean
          description: True when the user has already fed a signal today (UTC).
        daysActiveLast14:
          type: integer
          minimum: 0
          maximum: 14
          description: How many of the last 14 days (inclusive of today) had activity.

    DatingWin:
      type: object
      required: [id, category, body, createdAt]
      properties:
        id:
          type: integer
        category:
          type: string
          enum: [sent-it, great-convo, got-a-date, noticed-something, personal-win]
        body:
          type: string
        createdAt:
          type: string

    DatingWinInput:
      type: object
      required: [category, body]
      properties:
        category:
          type: string
          enum: [sent-it, great-convo, got-a-date, noticed-something, personal-win]
        body:
          type: string
          minLength: 1
          maxLength: 2000

    GrowthEvent:
      type: object
      required: [id, type, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            [
              experiment_tried,
              what_changed,
              pattern_broken,
              follow_up_logged,
              commitment_kept,
            ]
        createdAt:
          type: string

    GrowthEventInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            [
              experiment_tried,
              what_changed,
              pattern_broken,
              follow_up_logged,
              commitment_kept,
            ]

    UserVerification:
      type: object
      required: [phoneVerified, phoneVerifiedAt, selfieVerified, selfieVerifiedAt, idVerified, idVerifiedAt, ageOver18, verifiedTiers, tierTotal, isVerified]
      properties:
        phoneVerified:
          type: boolean
          description: Whether a phone number has cleared a verification check.
        phoneVerifiedAt:
          oneOf:
            - type: string
            - type: 'null'
          description: ISO timestamp the phone check cleared, or null.
        selfieVerified:
          type: boolean
          description: >-
            Whether a selfie looked consistent with the member's profile photos
            under the opt-in soft consistency check. Never a liveness or identity
            proof; the images are read in the moment and never stored.
        selfieVerifiedAt:
          oneOf:
            - type: string
            - type: 'null'
          description: ISO timestamp the selfie consistency check cleared, or null.
        idVerified:
          type: boolean
          description: Whether a government ID has cleared a Stripe Identity check.
        idVerifiedAt:
          oneOf:
            - type: string
            - type: 'null'
          description: ISO timestamp the government ID check cleared, or null.
        ageOver18:
          type: boolean
          description: True when the ID check confirmed the holder is 18 or older.
        verifiedTiers:
          type: integer
          minimum: 0
          description: How many verification tiers the user has cleared.
        tierTotal:
          type: integer
          minimum: 1
          description: Total tiers the climb can reach (phone, selfie, ID).
        isVerified:
          type: boolean
          description: True when at least one tier has cleared; drives the badge.

    IdentityVerificationStartResult:
      type: object
      required: [configured, clientSecret, url]
      properties:
        configured:
          type: boolean
          description: False when Stripe is not connected; the tier is then coming soon.
        clientSecret:
          oneOf:
            - type: string
            - type: 'null'
          description: Client secret for Stripe's embedded modal flow, or null.
        url:
          oneOf:
            - type: string
            - type: 'null'
          description: Hosted URL for the redirect flow, or null.

    IdentityVerificationResult:
      type: object
      required: [configured, verification]
      properties:
        configured:
          type: boolean
          description: False when Stripe is not connected; verification is unchanged.
        verification:
          $ref: '#/components/schemas/UserVerification'

    SelfieVerificationImage:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          minLength: 1
          description: >-
            Base64-encoded image bytes, with or without a data URL prefix. Read
            in the moment for the consistency check and never stored.
        imageMediaType:
          oneOf:
            - type: string
            - type: 'null'
          description: Optional MIME type hint, e.g. "image/jpeg".

    SelfieVerificationCheckInput:
      type: object
      required: [selfie, profilePhotos]
      properties:
        selfie:
          $ref: '#/components/schemas/SelfieVerificationImage'
        profilePhotos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/SelfieVerificationImage'
          description: The profile photos to compare the selfie against, read in the moment.

    SelfieVerificationResult:
      type: object
      required: [verdict, reason, mode, fallbackReason, verification]
      properties:
        verdict:
          type: string
          enum: [consistent, inconsistent, unclear]
          description: >-
            Soft consistency outcome. "consistent" looks like the same person and
            awards the tier; "inconsistent" looks like a different person; "unclear"
            could not tell. Never a liveness or identity proof.
        reason:
          type: string
          description: A short, plain-language explanation of the verdict.
        mode:
          type: string
          enum: [live, fallback]
          description: >-
            "live" when the Claude vision check ran; "fallback" when consent was
            off, the daily cap was hit, or the call could not run. Fallback never
            awards the tier.
        fallbackReason:
          oneOf:
            - type: string
            - type: 'null'
          description: Why the check fell back, or null when it ran live.
        verification:
          $ref: '#/components/schemas/UserVerification'

    PhoneVerificationStartInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 5
          maxLength: 32
          description: Phone number in E.164 form, e.g. "+14155550123".

    PhoneVerificationStartResult:
      type: object
      required: [sent, transport]
      properties:
        sent:
          type: boolean
        transport:
          type: string
          enum: [twilio, log]

    PhoneVerificationCheckInput:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          minLength: 5
          maxLength: 32
        code:
          type: string
          minLength: 4
          maxLength: 10

    PhoneVerificationCheckResult:
      type: object
      required: [verified, transport, verification]
      properties:
        verified:
          type: boolean
        transport:
          type: string
          enum: [twilio, log]
        verification:
          $ref: '#/components/schemas/UserVerification'

    WyrAnswer:
