          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachFollowUpTimeline"

  /rehearsal/turn:
    post:
      operationId: rehearsalTurn
      tags: [rehearsal]
      summary: Run one turn of a relationship-conversation rehearsal
      description: |
        Stateless. The client sends the chosen scenario, an optional description
        of how the other person communicates, and the transcript so far. The
        server returns the other person's next line (played in character) plus a
        short coaching note on how the user's last message landed. The
        deterministic baseline always answers; when the account has granted
        content consent, Claude shapes a richer, in-character read. Nothing is
        persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RehearsalTurnInput"
      responses:
        "200":
          description: The other person's next line plus a coaching note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RehearsalTurnResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mirror/trends:
    get:
      operationId: getMirrorTrends
      tags: [audits]
      summary: Cross-audit pattern and growth-trend report for the current scope
      description: |
        Aggregates the current user's (or anonymous-claim-scoped) audits, coach
        follow-up send-through stats, and recent life-pulses into a deterministic
        trend report — repeated strengths/risks, score delta, theme shifts,
        engagement window, and readiness signals. Computed by `analyzeAuditTrends`
        in `aiEngine.ts`; no external AI.
      responses:
        "200":
          description: Trend report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorTrendReport"

  /mirror/portrait:
    get:
      operationId: getMirrorPortrait
      tags: [audits]
      summary: The current user's evolving self-portrait from real accumulated signals
      description: |
        Synthesizes the signed-in user's real signal coverage (per readiness
        lane, gathered from the database) into a plain-English self-portrait:
        what the machine knows, confidence per dimension, blind spots it cannot
        see yet, the single highest-leverage next signal to feed, and how it ties
        into Match Readiness. Deterministic and always non-empty; no external AI.
        Requires auth.
      responses:
        "200":
          description: The user's Mirror portrait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorPortrait"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mirror/ask:
    post:
      operationId: askMirror
      tags: [audits]
      summary: Ask the Mirror a question about yourself, grounded in real signals
      description: |
        Answers a free-text question about the user from their real signal
        portrait. The deterministic baseline always answers; when the account has
        granted content consent, Claude shapes a richer reply. Grounding (the
        signals the answer leans on) is always computed server-side from real
        data, never invented by the model. Requires auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MirrorAskInput"
      responses:
        "200":
          description: The Mirror's answer plus the real signals it leaned on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorAskResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion:
    get:
      operationId: getCompanion
      tags: [audits]
      summary: The current state of Echo, the persistent companion
      description: |
        Returns Echo's current read on the signed-in user: a persona-voiced
        greeting, the honest read, the single next move, an optional challenge,
        Echo's recent self-made observations, open commitments it is holding the
        user to, the unread notification count, and the user's persona/candor
        and channel settings. Deterministic and always non-empty. Requires auth.
      responses:
        "200":
          description: Echo's present-tense view of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion/say:
    post:
      operationId: sayToCompanion
      tags: [audits]
      summary: Say something to Echo and get an honest reply
      description: |
        Persists the user's message and Echo's reply to the durable thread. The
        deterministic baseline always answers; when the account has granted
        content consent, Claude shapes a warmer, persona-voiced reply from
        derived signal coverage only (never raw content). If Echo detects a
        commitment ("I'll text her back tonight") it records it to follow up on.
        Requires auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionSayInput"
      responses:
        "200":
          description: Echo's reply plus any commitment it recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionSayResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion/review:
    post:
      operationId: reviewMessageWithCompanion
      tags: [audits]
      summary: Ask Echo for an honest read on a message
      description: |
        The user shares one message they are about to send or just received and
        Echo reacts honestly. The deterministic review is the baseline; when the
        account has granted content consent, Claude sharpens it. The message is
        consent-gated before any model sees it and is never stored. Requires auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionReviewInput"
      responses:
        "200":
          description: Echo's read on the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionReviewResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion/pulse:
    post:
      operationId: pulseCompanion
      tags: [audits]
      summary: Get Echo's in-the-moment reaction to a readiness change
      description: |
        Called the instant the Match Readiness meter moves. Echo compares the
        user's current portrait against the last reaction baseline, and if there
        is a real movement it returns an honest, persona-voiced reaction: the
        tone, the delta, which lanes deepened, what it can now see, and the next
        move. The deterministic reaction is the baseline; when the account has
        granted content consent, Claude reshapes the voice from derived numbers
        only (never raw content). Advances the reaction baseline so a single
        climb is never reacted to twice. Requires auth.
      responses:
        "200":
          description: Echo's reaction to the readiness change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionPulseResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion/notifications:
    get:
      operationId: listCompanionNotifications
      tags: [audits]
      summary: Echo's in-app notification feed
      description: |
        Returns the most recent notifications Echo has surfaced for the user
        (proactive nudges, commitment follow-ups, system notes), newest first.
        Requires auth.
      responses:
        "200":
          description: The notification feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionNotificationList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion/notifications/read:
    post:
      operationId: markCompanionNotificationsRead
      tags: [audits]
      summary: Mark Echo notifications as read
      description: |
        Marks the given notification ids as read, or all of them when no ids are
        supplied. Returns the new unread count. Requires auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionMarkReadInput"
      responses:
        "200":
          description: The updated unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionUnreadCount"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion/settings:
    patch:
      operationId: updateCompanionSettings
      tags: [audits]
      summary: Update Echo's persona, candor, and channel preferences
      description: |
        Sets how Echo sounds (persona), how blunt it is (candor 1 to 3), and how
        it is allowed to reach the user off-screen (in-app, email, SMS with an
        explicit phone number and opt-in). Requires auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionSettingsInput"
      responses:
        "200":
          description: The updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /me/companion/commitments/{id}/done:
