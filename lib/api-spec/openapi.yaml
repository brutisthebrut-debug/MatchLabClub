                  ok:
                    type: boolean
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Observation not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

