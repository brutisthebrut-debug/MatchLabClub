          type: integer
        spanDays:
          type: integer
        repeatedStrengths:
          type: array
          items:
            $ref: '#/components/schemas/MirrorTrendTheme'
        recurringRisks:
          type: array
          items:
            $ref: '#/components/schemas/MirrorTrendTheme'
