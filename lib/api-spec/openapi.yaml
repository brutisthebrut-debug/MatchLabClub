openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Next Level Dating Club API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: audits
    description: Profile audit operations
  - name: profiles
    description: Dating profile operations
  - name: messages
    description: Message coaching operations
  - name: insights
    description: Email insight import operations
  - name: waitlist
    description: Waitlist operations
  - name: ai
    description: AI integration status and diagnostics
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /claim-anonymous:
    post:
      tags: [Auth]
      operationId: claimAnonymousData
      summary: Claim audits, profiles, message sessions, and insights created anonymously in this browser
      description: |
        Reassigns rows with `userId IS NULL` whose IDs are passed in the body to the
        currently authenticated user. Only the IDs the client owns (tracked in
        localStorage) are eligible. Requires an authenticated session.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimAnonymousInput'
      responses:
        '200':
          description: Counts of rows successfully claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAnonymousResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account/export:
    get:
      tags: [Auth]
      operationId: exportMyData
      summary: Download all of the signed-in user's data as JSON
      description: |
        Returns a single JSON document containing the authenticated user's
        profile record plus every audit, dating profile, message coaching
        session, and email insight tied to that user. Intended to power a
        "Download my data" button on the account page.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Full export of the user's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /account:
    delete:
      tags: [Auth]
      operationId: deleteMyAccount
      summary: Permanently delete the signed-in user's account and all data
      description: |
        Permanently removes the authenticated user along with every audit,
        dating profile, message coaching session, and email insight tied to
        that user. Also clears every active session for the user and the
        browser session cookie, effectively signing them out.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Account and all associated data were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMyAccountResult'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /audits:
    get:
      operationId: listAudits
      tags: [audits]
      summary: List all profile audits for current session
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [manual, screenshot]
      responses:
        "200":
          description: List of audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audit"
    post:
      operationId: createAudit
      tags: [audits]
      summary: Create a new profile audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditInput"
      responses:
        "201":
          description: Created audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"

  /audits/{id}:
    get:
      operationId: getAudit
      tags: [audits]
      summary: Get a single audit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
        "404":
          description: Not found

  /audits/{id}/generate:
    post:
      operationId: generateAuditReport
      tags: [audits]
      summary: Generate AI profile audit report for an audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReport"

  /audits/from-screenshot:
    post:
      operationId: auditFromScreenshot
      tags: [audits]
      summary: OCR a profile screenshot and run an audit on the extracted text
      description: |
        Accepts a base64-encoded screenshot of a dating profile (typically taken from
        the user's phone). The server runs OCR to extract bio and prompt text and then
        feeds the result through the standard audit engine, returning a generated
        mini-report alongside the persisted audit id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotAuditInput"
      responses:
        "200":
          description: Generated mini-report from the screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotAuditReport"
        "400":
          description: Invalid image or no readable text found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/summary:
    get:
      operationId: getAuditSummary
      tags: [audits]
      summary: Get aggregate summary of user audits (scores, trends)
      responses:
        "200":
          description: Audit summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSummary"

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List saved dating profiles
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatingProfile"
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Save a dating profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatingProfileInput"
      responses:
        "201":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatingProfile"

  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a dating profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatingProfile"
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update a dating profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatingProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatingProfile"

  /profiles/{id}/rewrite:
    post:
      operationId: rewriteProfileBio
      tags: [profiles]
      summary: Generate AI-rewritten bio and prompts for a profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rewritten bio and prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRewrite"

  /messages:
    get:
      operationId: listMessageCoachingSessions
      tags: [messages]
      summary: List message coaching sessions
      responses:
        "200":
          description: List of coaching sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageCoachingSession"
    post:
      operationId: createMessageCoachingSession
      tags: [messages]
      summary: Create a message coaching session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCoachingInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCoachingSession"

  /messages/{id}/coach:
    post:
      operationId: coachMessage
      tags: [messages]
      summary: Get AI coaching advice for a specific message session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coaching response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCoachingResponse"

  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List email insight imports
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailInsight"
    post:
      operationId: createInsight
      tags: [insights]
      summary: Submit email/message history for communication pattern analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInsightInput"
      responses:
        "201":
          description: Created insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInsight"

  /insights/{id}/analyze:
    post:
      operationId: analyzeInsight
      tags: [insights]
      summary: Run AI analysis on pasted email/message history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInsightAnalysis"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the podcast launch waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
    get:
      operationId: getWaitlistStats
      tags: [waitlist]
      summary: Get waitlist stats (count, spots remaining)
      responses:
        "200":
          description: Waitlist stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStats"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get current AI integration status
      description: Returns whether OpenAI is connected, in fallback mode, or needs setup.
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"

  /ai/enhance:
    post:
      operationId: enhanceAi
      tags: [ai]
      summary: Run a tool-specific AI generation with graceful fallback
      description: Public endpoint used by client tools (Blueprint, NextMessage, etc.) to enhance deterministic output with live AI when an API key is configured. Falls back silently to an empty output if AI is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEnhanceInput"
      responses:
        "200":
          description: AI enhancement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

  /ai/test:
    post:
      operationId: testAi
      tags: [ai]
      summary: Send a sample prompt through the server-side AI helper
      description: Safe diagnostic endpoint — runs a tiny generation request. Requires founder key. Falls back gracefully if AI is unavailable.
      parameters:
        - name: x-founder-key
          in: header
          required: false
          schema:
            type: string
        - name: key
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTestInput"
      responses:
        "200":
          description: AI test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "401":
          description: Founder key required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    AuthErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ClaimAnonymousInput:
      type: object
      properties:
        auditIds:
          type: array
          items:
            type: integer
        profileIds:
          type: array
          items:
            type: integer
        messageSessionIds:
          type: array
          items:
            type: integer
        insightIds:
          type: array
          items:
            type: integer
    ClaimAnonymousResult:
      type: object
      required: [claimed]
      properties:
        claimed:
          type: object
          required: [audits, profiles, messages, insights]
          properties:
            audits:
              type: integer
            profiles:
              type: integer
            messages:
              type: integer
            insights:
              type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuditInput:
      type: object
      required: [firstName, age, gender, orientation, datingGoal, currentApps, bio]
      properties:
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]

    Audit:
      type: object
      required: [id, firstName, age, gender, datingGoal, currentApps, bio, createdAt, status, source]
      properties:
        id:
          type: integer
        firstName:
          type: string
        age:
          type: integer
        gender:
          type: string
        orientation:
          type: string
        datingGoal:
          type: string
        currentApps:
          type: array
          items:
            type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        recentMessageSample:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        relationshipHistory:
          type: ["string", "null"]
        biggestChallenge:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Dating app the audit originated from (e.g. "Hinge"), detected from OCR or supplied by the client.
        status:
          type: string
          enum: [pending, generating, complete, error]
        source:
          type: string
          enum: [manual, screenshot]
        readinessScore:
          type: ["integer", "null"]
        createdAt:
          type: string

    AuditReport:
      type: object
      required: [auditId, readinessScore, overallGrade, strengths, risks, bioAudit, rewrittenBio, rewrittenPrompts, photoGuidance, actionPlan, messagingStyle, coachingCta]
      properties:
        auditId:
          type: integer
        readinessScore:
          type: integer
        overallGrade:
          type: string
        strengths:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        bioAudit:
          type: string
        rewrittenBio:
          type: string
        rewrittenPrompts:
          type: array
          items:
            $ref: "#/components/schemas/RewrittenPrompt"
        photoGuidance:
          type: array
          items:
            $ref: "#/components/schemas/PhotoGuidanceItem"
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/ActionPlanItem"
        messagingStyle:
          type: string
        coachingCta:
          type: string

    RewrittenPrompt:
      type: object
      required: [original, rewritten, tip]
      properties:
        original:
          type: string
        rewritten:
          type: string
        tip:
          type: string

    PhotoGuidanceItem:
      type: object
      required: [category, status, advice]
      properties:
        category:
          type: string
        status:
          type: string
          enum: [good, needs_work, missing]
        advice:
          type: string

    ActionPlanItem:
      type: object
      required: [priority, title, description, timeframe]
      properties:
        priority:
          type: integer
        title:
          type: string
        description:
          type: string
        timeframe:
          type: string

    AuditSummary:
      type: object
      required: [totalAudits, averageScore, latestScore, scoreHistory, topStrengths, topRisks]
      properties:
        totalAudits:
          type: integer
        averageScore:
          type: number
        latestScore:
          type: ["integer", "null"]
        scoreHistory:
          type: array
          items:
            $ref: "#/components/schemas/ScoreHistoryPoint"
        topStrengths:
          type: array
          items:
            type: string
        topRisks:
          type: array
          items:
            type: string

    ScoreHistoryPoint:
      type: object
      required: [date, score]
      properties:
        date:
          type: string
        score:
          type: integer

    ScreenshotAuditInput:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: |
            Base64-encoded screenshot of a dating profile. May include a data URL
            prefix (e.g. "data:image/jpeg;base64,..."); the server strips it.
        firstName:
          type: ["string", "null"]
          description: Optional name (e.g. the match's first name pulled from the profile).
        datingGoal:
          type: ["string", "null"]
        sourceApp:
          type: ["string", "null"]
          description: Which dating app the screenshot was taken from (e.g. "Hinge").

    ScreenshotAuditReport:
      type: object
      required: [auditId, extractedBio, extractedPrompts, report]
      properties:
        auditId:
          type: integer
        extractedBio:
          type: string
        extractedPrompts:
          type: array
          items:
            type: string
        rawOcrText:
          type: string
        report:
          $ref: "#/components/schemas/AuditReport"

    DatingProfileInput:
      type: object
      required: [platform, bio]
      properties:
        platform:
          type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    DatingProfileUpdate:
      type: object
      properties:
        platform:
          type: string
        bio:
          type: string
        prompts:
          type: ["string", "null"]
        photoCount:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    DatingProfile:
      type: object
      required: [id, platform, bio, createdAt]
      properties:
        id:
          type: integer
        platform:
          type: string
        bio:
          type: string
