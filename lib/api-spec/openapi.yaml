      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [manual, screenshot]
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search across firstName and bio.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort order for results.
          schema:
            type: string
            enum: [newest, topScore]
            default: newest
