        - name: limit
          in: query
          required: false
          description: Maximum number of audits to return (1-100). Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of audits to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
