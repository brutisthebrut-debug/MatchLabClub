        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WellnessTagInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessTag"

  /wellness/tags/{id}:
    patch:
      operationId: updateWellnessTag
      tags: [wellness]
      summary: Update a compatibility tag
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
