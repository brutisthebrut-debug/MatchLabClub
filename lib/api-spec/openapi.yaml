        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        createdAt:
          type: string

    BulkDeleteAuditsInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer
          description: List of audit ids to delete. Ids the caller does not own are silently skipped.

    BulkDeleteAuditsResult:
      type: object
      required: [success, deletedIds]
      properties:
        success:
          type: boolean
          const: true
        deletedIds:
          type: array
          items:
            type: integer

    EmptyTrashResult:
      type: object
      required: [success, purgedIds]
      properties:
        success:
          type: boolean
          const: true
        purgedIds:
          type: array
          items:
            type: integer

    RestoreAllTrashResult:
      type: object
      required: [success, restoredIds]
      properties:
        success:
          type: boolean
          const: true
        restoredIds:
          type: array
          items:
            type: integer

    ExpiringTrashedAudits:
      type: object
      required: [audits, retentionDays, withinDays]
      properties:
        audits:
          type: array
          items:
            $ref: "#/components/schemas/Audit"
          description: Trashed audits within `withinDays` of permanent purge, earliest first.
        retentionDays:
          type: integer
          description: Number of days an audit can stay in the trash before being permanently purged.
        withinDays:
          type: integer
          description: The lookahead window (in days) that was used to compute this list.

    DeleteInsightResult:
      type: object
      required: [success, deletedId]
      properties:
        success:
          type: boolean
          const: true
        deletedId:
          type: integer

    DeleteProfileResult:
      type: object
      required: [success, deletedId]
      properties:
        success:
          type: boolean
          const: true
        deletedId:
          type: integer

    DeleteAuditResult:
      type: object
      required: [success, deletedId]
      properties:
        success:
          type: boolean
          const: true
        deletedId:
          type: integer

    EmailMyDataExportResult:
      type: object
      required: [success, expiresAt, sentTo]
      properties:
        success:
          type: boolean
          const: true
        expiresAt:
          type: string
          description: ISO timestamp after which the emailed link is no longer valid.
        sentTo:
          type: string
          format: email
          description: Email address the export link was sent to.

    MySession:
      type: object
      required: [sid, createdAt, lastSeenAt, current]
      properties:
        sid:
          type: string
          description: Opaque session id. Use it as the path parameter to revoke this session.
        createdAt:
          type: string
          description: ISO timestamp of when the session was created.
        lastSeenAt:
          type: string
          description: ISO timestamp of the most recent request seen on this session.
        expiresAt:
          type: string
          description: ISO timestamp after which this session is automatically invalid.
        userAgent:
          type: [string, 'null']
          description: Raw user-agent string captured at sign-in. May be null for older sessions.
        deviceLabel:
          type: [string, 'null']
          description: A friendly summary of the browser and OS, e.g. "Chrome on macOS".
        ip:
          type: [string, 'null']
          description: IP address captured at sign-in. May be null for older sessions.
        ipLocation:
          type: [string, 'null']
          description: >
            Coarse geolocation derived from the sign-in IP, e.g. "Berlin, DE"
            or "Brooklyn, NY, US". Null when the IP is private, missing, or
            cannot be resolved. Computed at query time — no third-party calls
            are made.
        channel:
          type: [string, 'null']
          enum: [web, mobile, null]
          description: Which app the user signed in from.
        current:
          type: boolean
          description: True if this is the session making the request.

    MySessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/MySession'

    RevokeSessionsResult:
      type: object
      required: [success, revoked]
      properties:
        success:
          type: boolean
          const: true
        revoked:
          type: integer
          description: Number of sessions actually deleted.

    DeleteMyAccountResult:
      type: object
      required: [success, deleted]
      properties:
        success:
          type: boolean
          const: true
        deleted:
          type: object
          required: [audits, profiles, messages, insights]
          properties:
            audits:
              type: integer
            profiles:
              type: integer
            messages:
              type: integer
            insights:
              type: integer

    DeleteAccountInput:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          minLength: 1
          maxLength: 320
          description: >-
            Must equal the signed-in user's email address (case-insensitive).
            The endpoint compares lowercased values, so any-case input is
            accepted as long as the trimmed text matches the account email.

    DeleteAccountResult:
      type: object
      required: [deleted, tables]
      properties:
        deleted:
          type: boolean
          const: true
        tables:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Row counts deleted per table, keyed by database table name.
            Always includes every user-scoped table considered, even when
            the count is zero, so the client can show a faithful summary.

    TrustLedgerEntry:
      type: object
      required:
        - id
        - label
        - origin
        - noun
        - held
        - count
        - storedCount
        - coverage
        - summary
        - dimensions
        - seen
        - neverTouched
        - actionLabel
        - actionHref
        - purgeable
      properties:
        id:
          type: string
          description: The signal registry id of this source.
        label:
          type: string
          description: Human-readable name of the source.
        origin:
          type: string
          description: Where this source's data comes from, in plain language.
        noun:
          type: string
          description: Singular noun for one stored unit, e.g. "read", "note", "import".
        held:
          type: boolean
          description: >-
            Whether the machine still holds any stored data from this source,
            i.e. whether a purge would remove anything. Derived from storedCount,
            not from the readiness signal count.
        count:
          type: integer
          description: >-
            How many units of this source count toward Match Readiness. This can
            be narrower than storedCount, since some stored rows (a one-line
            journal note, an unreflected post-date stub) are held but do not move
            readiness.
        storedCount:
          type: integer
          minimum: 0
          description: >-
            How many raw units of this source the machine actually holds, i.e.
            exactly how many rows a purge would remove. Drives held and
            purgeable.
        coverage:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Normalized coverage of this lane, 0 to 100, the same value that
            feeds the Match Readiness breakdown.
        summary:
          type: string
          description: >-
            Plain-English line describing what this source tells the machine at
            its current coverage, derived from the registry.
        dimensions:
          type: array
          items:
            type: string
          description: Wellness dimensions this source contributes to.
        seen:
          type: array
          items:
            type: string
          description: What the machine sees from this source.
        neverTouched:
          type: array
          items:
            type: string
          description: What the machine never touches from this source.
        actionLabel:
          type: string
          description: CTA copy for feeding this source.
        actionHref:
          type: string
          description: Where the CTA points to feed this source.
        purgeable:
          type: boolean
          description: >-
            Whether this source can be purged on its own. Sources with nothing
            stored are not purgeable.

    TrustLedger:
      type: object
      required: [generatedAt, entries]
      properties:
        generatedAt:
          type: string
          description: ISO timestamp of when this ledger was generated.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TrustLedgerEntry'

    PurgeTrustSourceResult:
      type: object
      required: [success, id, removed]
      properties:
        success:
          type: boolean
          const: true
        id:
          type: string
          description: The signal registry id that was purged.
        removed:
          type: integer
          description: Total number of rows removed across the source's tables.

    RegisterPushTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: Expo push token obtained via expo-notifications on the device.

    RegisterPushTokenResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    UnregisterPushTokenResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    EngineMeta:
      type: object
      required: [engineVersion]
      properties:
        engineVersion:
          type: string
          description: |
            Version tag of the deterministic audit engine currently running on
            the server. Clients should treat saved reports tagged with a
            different (or missing) version as stale.

    AiTestResult:
      type: object
      required: [mode, isFallback, output, durationMs]
      properties:
        mode:
          type: string
          enum: [live, fallback, setup-needed]
        isFallback:
          type: boolean
        output:
          type: string
        durationMs:
          type: integer
        error:
          type: string
        model:
          type: string
        validated:
          type: boolean
          description: Set when a schema validation was attempted. True if the model output passed validation.
        attempts:
          type: integer
          description: Number of model attempts made (1 = no retry, 2 = one retry).

    TrashPurgeResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          description: Number of soft-deleted audit rows permanently removed by this purge run.

    GeoipRefreshResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          description: True when the GeoIP database was refreshed; false when the updater could not run (e.g. MAXMIND_LICENSE_KEY missing or download failed).
        message:
          type: string
          description: Human-readable summary of the refresh result.

    TrashPurgeHeartbeat:
      type: object
      required: [lastSuccessAt, ageMs, staleThresholdMs, stale]
      properties:
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
          description: ISO-8601 timestamp of the last successful audit_trash_purge run, or null if it has never run.
        ageMs:
          type: [integer, 'null']
          description: Milliseconds since the last successful run, or null if it has never run.
        staleThresholdMs:
          type: integer
          description: The staleness threshold in milliseconds. If ageMs exceeds this, stale is true.
        stale:
          type: boolean
          description: True when the job has never run or last ran longer ago than staleThresholdMs.

    MeReferralInvitee:
      type: object
      required: [displayName, joinedAt, status]
      properties:
        displayName:
          type: string
          description: The invitee's first name, or "A new member" when no name is on file. Never an email or any other private field.
        joinedAt:
          type: [string, 'null']
          format: date-time
          description: When the invitee was attributed to this inviter, or null if unknown.
        status:
          type: string
          enum: [joined, building, ready, paused, concierge_only, off]
          description: Where the invitee sits in the matching pool. "joined" means signed up but no pool membership row yet.
    MeReferralsSummary:
      type: object
      required: [joined, inPool, ready]
      properties:
        joined:
          type: integer
          description: Total people who joined from this user's invites.
        inPool:
          type: integer
          description: How many of those invitees are active in the matching pool (building, ready, or concierge).
        ready:
          type: integer
          description: How many invitees are fully ready to match.
    MeReferralsResponse:
      type: object
      required: [refCode, sharePath, summary, invitees]
      properties:
        refCode:
          type: string
          description: The user's personal invite code (shape "user-<id>") to append as the ?ref param on a shared link.
        sharePath:
          type: string
          description: The suggested in-app destination to invite people to (for example "/quizzes").
        summary:
          $ref: '#/components/schemas/MeReferralsSummary'
        invitees:
          type: array
          description: Privacy-safe list of people who joined from this user's invites, newest first.
          items:
            $ref: '#/components/schemas/MeReferralInvitee'
    FounderReferralsSummary:
      type: object
      required: [totalReferrals, uniqueInviters, overallConversionRate, topInviters, surfaceBreakdown, recentReferrals]
      properties:
        totalReferrals:
          type: integer
          description: Total number of rows in the referrals table.
        uniqueInviters:
          type: integer
          description: Count of distinct inviter user ids across all referrals.
        overallConversionRate:
          type: number
          format: float
          description: Fraction of invited users with at least one paid purchase_interest row. Zero when there are no invitees.
        topInviters:
          type: array
          description: Top 20 inviters by invited count, sorted descending.
          items:
            type: object
            required: [inviterUserId, inviterEmail, inviterDisplayName, invitedCount, paidCount, conversionRate]
            properties:
              inviterUserId:
                type: string
              inviterEmail:
                type: string
              inviterDisplayName:
                type: [string, 'null']
              invitedCount:
                type: integer
              paidCount:
                type: integer
              conversionRate:
                type: number
                format: float
                description: paidCount divided by invitedCount. Zero when invitedCount is zero.
        surfaceBreakdown:
          type: array
          description: All referral surfaces ordered by count desc. Rows with no surface tag are bucketed under "(unknown)".
          items:
            type: object
            required: [surface, count, paidCount, conversionRate]
            properties:
              surface:
                type: string
              count:
                type: integer
              paidCount:
                type: integer
              conversionRate:
                type: number
                format: float
        recentReferrals:
          type: array
          description: Last 50 referrals, newest first.
          items:
            type: object
            required: [createdAt, inviterEmail, inviteeEmail, surface, invitedAt, invitedConverted]
            properties:
              createdAt:
                type: string
                format: date-time
              inviterEmail:
                type: string
              inviteeEmail:
                type: string
              surface:
                type: [string, 'null']
              invitedAt:
                type: [string, 'null']
                format: date-time
              invitedConverted:
                type: boolean
                description: True when the invitee user has at least one paid purchase_interest row.

    FounderFunnelSummary:
      type: object
      required: [stages, readinessThreshold, paidViaPurchaseInterest, overallConversionRate]
      properties:
        readinessThreshold:
          type: integer
          description: Effective matching pool readiness threshold at request time.
        paidViaPurchaseInterest:
          type: integer
          description: Distinct paid purchase_interest emails. Supplemental to the tier-based purchased stage, since it also captures anonymous one-off buys.
        overallConversionRate:
          type: number
          format: float
          description: Purchased distinct users divided by accounts. Zero when there are no accounts.
        stages:
          type: array
          description: Ordered funnel stages from accounts to purchased.
          items:
            type: object
            required: [key, label, count, conversionFromPrev]
            properties:
              key:
                type: string
                description: Stable stage identifier (accounts, signal_fed, readiness_gained, entered_matching, matched, purchased).
              label:
                type: string
              count:
                type: integer
                description: Distinct users who reached this stage.
              conversionFromPrev:
                type: [number, 'null']
                format: float
                description: count divided by the previous stage count. Null for the first stage. Zero when the previous stage is zero.

    LifePulseInput:
      type: object
      required: [sleep, energy, social, money, headspace]
      properties:
        sleep:
          type: integer
          minimum: 1
          maximum: 5
          description: Subjective sleep quality last night (1 worst, 5 best).
        energy:
          type: integer
          minimum: 1
          maximum: 5
          description: Subjective energy right now (1 depleted, 5 charged).
        social:
          type: integer
          minimum: 1
          maximum: 5
          description: Social fuel — how much capacity for connection (1 drained, 5 lit up).
        money:
          type: integer
          minimum: 1
          maximum: 5
          description: Money headspace (1 stressed, 5 unbothered).
        headspace:
          type: integer
          minimum: 1
          maximum: 5
          description: General mental clarity (1 foggy, 5 sharp).
        note:
          type: [string, 'null']
          maxLength: 500
          description: Optional short note about today.

    LifePulse:
      type: object
      required: [id, sleep, energy, social, money, headspace, createdAt]
      properties:
        id:
          type: integer
        sleep:
          type: integer
        energy:
          type: integer
        social:
          type: integer
        money:
          type: integer
        headspace:
          type: integer
        note:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    LifePulseRecent:
      type: object
      required: [pulses, latest]
      properties:
        pulses:
          type: array
          items:
            $ref: '#/components/schemas/LifePulse'
          description: Most recent pulses for the current user/anon scope, newest first, capped at 30.
        latest:
          oneOf:
            - $ref: '#/components/schemas/LifePulse'
            - type: 'null'
          description: The single most recent pulse, or null when the user has never logged one.

    MirrorTrendTheme:
      type: object
      required: [key, label, count, firstSeenAuditId, lastSeenAuditId]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        firstSeenAuditId:
          type: [integer, "null"]
