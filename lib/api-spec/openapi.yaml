        latest:
          type: [integer, "null"]
        previous:
          type: [integer, "null"]
        delta:
          type: integer
        currentVsPrevious:
          type: integer
        rolling30Delta:
          type: integer
        direction:
          type: string
          enum: [up, down, flat]

    MirrorTrendEngagementWindow:
      type: object
      required:
        - firstAuditAt
        - latestAuditAt
        - avgGapDays
        - mostActiveDay
        - daysSinceLatest
        - auditsPerMonth
        - dormancyGapCount
      properties:
        firstAuditAt:
          type: [string, "null"]
          format: date-time
        latestAuditAt:
          type: [string, "null"]
          format: date-time
        avgGapDays:
          type: [number, "null"]
        mostActiveDay:
          type: [string, "null"]
        daysSinceLatest:
          type: [integer, "null"]
        auditsPerMonth:
          type: number
        dormancyGapCount:
          type: integer

    MirrorTrendScorePoint:
      type: object
      required: [auditId, score, createdAt]
