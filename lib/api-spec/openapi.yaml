        description:
          type: string
        timeframe:
          type: string

    AuditSummary:
      type: object
      required: [totalAudits, averageScore, latestScore, scoreHistory, topStrengths, topRisks]
      properties:
        totalAudits:
          type: integer
        averageScore:
          type: number
        latestScore:
          type: ["integer", "null"]
        scoreHistory:
          type: array
          items:
            $ref: "#/components/schemas/ScoreHistoryPoint"
        topStrengths:
          type: array
          items:
            type: string
        topRisks:
          type: array
          items:
            type: string

    ScoreHistoryPoint:
      type: object
