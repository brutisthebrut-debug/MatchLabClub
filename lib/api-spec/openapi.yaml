    MirrorTrendTheme:
      type: object
      required: [key, label, count, firstSeenAuditId, lastSeenAuditId]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        firstSeenAuditId:
          type: [integer, "null"]
