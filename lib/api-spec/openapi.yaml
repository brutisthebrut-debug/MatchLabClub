          description: Wellness profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellnessProfile"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me/profile-project/audits:
    post:
      operationId: createProfileProjectAudit
      tags: [audits, profiles]
      summary: Validate, save, and generate a durable Profile Project read
      description: |
        Canonical signed-in audit workflow. The server first checks that the
        member supplied enough coherent profile evidence. Missing, placeholder,
        contradictory, or wrong-format input returns an explicit 422 and cannot
        manufacture a report. A successful request saves the source and its
        first immutable report version together. The generated report is a
        proposed coaching observation; it does not confirm a Mirror learning or
        grant matching use.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditInput"
      responses:
        "201":
          description: Durable audit source and generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileProjectAuditResult"
        "400":
          description: Invalid request shape
        "401":
          description: Not authenticated
        "422":
          description: Insufficient or contradictory evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientAuditEvidence"
        "500":
          description: Source saved but generation failed without a report

  /audits:
    get:
      operationId: listAudits
      tags: [audits]
      summary: List all profile audits for current session
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [manual, screenshot]
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search across firstName and bio.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort order for results.
          schema:
            type: string
            enum: [newest, topScore]
            default: newest
        - name: scoreRange
          in: query
          required: false
          description: |
            Filter by readiness score band. `low` = <55, `medium` = 55-74,
            `high` = >=75. Audits without a score are excluded when set.
          schema:
            type: string
            enum: [low, medium, high]
        - name: limit
          in: query
          required: false
          description: Maximum number of audits to return (1-100). Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of audits to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audit"
    post:
      operationId: createAudit
      tags: [audits]
      summary: Create a new profile audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditInput"
      responses:
        "201":
          description: Created audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"

  /audits/{id}:
    get:
      operationId: getAudit
      tags: [audits]
      summary: Get a single audit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
        "404":
          description: Not found
    delete:
      operationId: deleteAudit
      tags: [audits]
      summary: Soft-delete an audit owned by the current session
      description: |
        Moves a single audit to the trash by setting its `deletedAt` timestamp.
        The audit is hidden from the regular list/summary endpoints but can
        still be retrieved or restored via `/audits/trash` and
        `/audits/{id}/restore`. Soft-deleted audits are auto-purged after
        30 days. Only the audit owner (matched by userId for authenticated
        requests, or anonymous session for guests) can delete it. Returns 404
        if the audit does not exist or is not owned by the caller.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAuditResult"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /audits/trash:
    get:
      operationId: listTrashedAudits
      tags: [audits]
      summary: List soft-deleted audits owned by the current session
      description: |
        Returns audits the caller has soft-deleted (set `deletedAt`) but which
        have not yet been auto-purged (rows older than 30 days are removed by
        a background job). Use this to power a "Recently deleted" view that
        lets users restore or permanently remove individual audits.
      responses:
        "200":
          description: List of soft-deleted audits, newest deletion first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audit"

  /audits/trash/expiring-soon:
    get:
      operationId: listExpiringTrashedAudits
      tags: [audits]
      summary: List trashed audits that are within a few days of being permanently purged
      description: |
        Returns soft-deleted audits owned by the caller that will be
        permanently purged within the next `withinDays` days (default 3,
        max 30). Used by clients to warn users — via push notification or
        an in-app banner — before their trash is auto-emptied. Audits are
        ordered by `deletedAt` ascending (earliest purge first). The
        `retentionDays` field exposes the server's purge window so clients
        can compute exact purge timestamps without hard-coding it.
      parameters:
        - name: withinDays
          in: query
          required: false
          description: Number of days of headroom to look ahead. Defaults to 3.
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 3
      responses:
        "200":
          description: Trashed audits about to be purged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiringTrashedAudits"

  /audits/{id}/restore:
    post:
      operationId: restoreAudit
      tags: [audits]
      summary: Restore a previously soft-deleted audit
      description: |
        Clears the audit's `deletedAt` timestamp so it reappears in the
        regular list. Only the audit owner can restore it. Returns 404 if
        the audit does not exist, is not owned by the caller, or has already
        been hard-purged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /audits/{id}/purge:
    delete:
      operationId: purgeAudit
      tags: [audits]
      summary: Permanently delete a soft-deleted audit
      description: |
        Hard-deletes a single audit from the trash. Only audits whose
        `deletedAt` is already set can be purged via this endpoint — use the
        regular DELETE `/audits/{id}` first to move an active audit to the
        trash. Returns 404 if the audit does not exist, is not owned by the
        caller, or has not been soft-deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAuditResult"
        "400":
          description: Invalid id
        "404":
          description: Not found

  /audits/trash/empty:
    post:
      operationId: emptyTrash
      tags: [audits]
      summary: Permanently delete every soft-deleted audit owned by the caller
      description: |
        Hard-deletes every audit in the caller's trash (i.e. every audit
        owned by them whose `deletedAt` is set) in a single request. Only
        audits owned by the caller (matched by userId for authenticated
        requests, or anonymous session for guests) are affected. Active
        (non-trashed) audits are never touched. The response lists the ids
        that were actually purged.
      responses:
        "200":
          description: Trash emptied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyTrashResult"

  /audits/trash/restore-all:
    post:
      operationId: restoreAllTrash
      tags: [audits]
      summary: Restore every soft-deleted audit owned by the caller
      description: |
        Clears `deletedAt` on every audit in the caller's trash so they
        reappear in the active list. Only audits owned by the caller are
        affected. The response lists the ids that were actually restored.
      responses:
        "200":
          description: Trash restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreAllTrashResult"

  /audits/bulk-delete:
    post:
      operationId: bulkDeleteAudits
      tags: [audits]
      summary: Soft-delete multiple audits owned by the current session in one request
      description: |
        Moves a list of audits to the trash in a single round-trip by setting
        their `deletedAt` timestamps. Only audits owned by the caller
        (matched by userId for authenticated requests, or anonymous session
        for guests) are affected; ids that don't match or are already
        soft-deleted are silently skipped. The response lists the ids that
        were actually soft-deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteAuditsInput"
      responses:
        "200":
          description: Audits deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteAuditsResult"
        "400":
          description: Invalid request body

  /audits/{id}/correct-source-app:
    post:
      operationId: correctAuditSourceApp
      tags: [audits]
      summary: Record a user correction for a mis-detected source app
      description: |
        Called when the user indicates the source app shown on their report is
        wrong. Stores the mismatch in the audit's `ocrCorrections` field so the
        OCR learning pipeline can promote it to a rule after the configured
        occurrence threshold, and updates the audit's `sourceApp` to the value
        the user chose. Pass `null` for `correctedApp` to mark the app as unknown.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectSourceAppInput"
      responses:
        "200":
          description: Correction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorrectSourceAppResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Audit not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/{id}/generate:
    post:
      operationId: generateAuditReport
      tags: [audits]
      summary: Generate AI profile audit report for an audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReport"

  /audits/{id}/versions:
    get:
      operationId: listAuditReportVersions
      tags: [audits]
      summary: List every regeneration of a single audit's report
      description: |
        Returns the chronological log of report versions for an audit — one
        entry per generation, newest first. Each entry includes the readiness
        score at that point, the stored report, and (for regenerations) the
        change summary diff vs the immediately prior run. Used to render a
        regeneration timeline on the audit detail page.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of report versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReportVersionList"
        "404":
          description: Audit not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/{id}/versions/{versionId}:
    get:
      operationId: getAuditReportVersion
      tags: [audits]
      summary: Fetch a single historical report version for an audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single historical report version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReportVersion"
        "404":
          description: Audit or version not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/extract-screenshot:
    post:
      operationId: extractScreenshot
      tags: [audits]
      summary: OCR a profile screenshot and return extracted fields for review
      description: |
        Accepts a base64-encoded screenshot of a dating profile and returns the
        OCR-extracted firstName, age, sourceApp, bio and prompts. No audit is
        persisted — the client should let the user correct any mistakes and then
        call /audits/from-screenshot with the corrected values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotExtractInput"
      responses:
        "200":
          description: Extracted profile fields from the screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotExtractResult"
        "400":
          description: Invalid image or no readable text found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /audits/from-screenshot:
    post:
      operationId: auditFromScreenshot
      tags: [audits]
      summary: Run an audit on profile text from a screenshot (optionally corrected)
      description: |
        Accepts either a base64-encoded screenshot or the corrected fields the user
        confirmed from a prior /audits/extract-screenshot call. When `bio` (and
        optionally `prompts`) are provided, OCR is skipped and the audit runs on
        the supplied values directly. The corrected values are what gets persisted
        to the audit record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotAuditInput"
      responses:
        "200":
          description: Generated mini-report from the screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotAuditReport"
        "400":
          description: Invalid image or no readable text found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /meta/engine:
    get:
      operationId: getEngineMeta
      tags: [health]
      summary: Get the current deterministic engine version
      description: |
        Returns the version tag of the deterministic audit engine currently
        running on the server. Clients compare this against the `engineVersion`
        stored on a saved report to decide whether the report is stale.
      responses:
        "200":
          description: Current engine metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineMeta"

  /audits/summary:
