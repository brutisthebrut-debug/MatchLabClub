          maxLength: 500
          description: The user's current Instagram bio text.
        recentCaptions:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 800
          description: Five to ten recent Instagram captions, one per array item.

    CreateInstagramPasteResult:
      type: object
      required: [id, source, status, uploadedAt]
      properties:
        id:
          type: integer
        source:
          type: string
          const: instagram-paste
        status:
          type: string
          const: pending
        uploadedAt:
          type: string
          format: date-time

    CreateSourcePasteInput:
      type: object
      required: [source, items]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            The connector's source key. Must be one of the registry's
            paste-capturable sources (for example `taste-paste`,
            `lifestyle-paste`). Unknown values are rejected with a 400.
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 280
          description: |
            The pasted items, one per array entry. Empty entries are dropped
            server-side. Only the count drives scoring; the raw text is stored
            against the row and never sent to any prompt.
        note:
          type: string
          maxLength: 1000
          description: Optional free-text context the user adds about the source.

    CreateSourcePasteResult:
      type: object
      required: [id, source, status, itemCount, uploadedAt]
      properties:
        id:
          type: integer
        source:
          type: string
          description: The source key the row was tagged with.
        status:
          type: string
          const: complete
        itemCount:
          type: integer
          description: Number of non-empty items stored for this paste.
        uploadedAt:
          type: string
          format: date-time

    CreateVoiceIntroInput:
      type: object
      required: [durationSec, energy, dynamics, pace, speechRatio]
      properties:
        durationSec:
          type: number
          minimum: 0
          maximum: 600
          description: How many seconds the user spoke. Derived in the browser.
        energy:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Average loudness of the speech, normalized 0-1. A derived acoustic
            metric only; the audio it came from is never uploaded.
        dynamics:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            How much the loudness varies over time, normalized 0-1 (expressive
            vs flat). Derived in the browser.
        pace:
          type: number
          minimum: 0
          maximum: 10
          description: >-
            Speech onsets per second, a proxy for how fast and animated the
            delivery is. Derived in the browser.
        speechRatio:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Fraction of the take that was speech rather than silence, 0-1.
            Derived in the browser.

    CreateVoiceIntroResult:
      type: object
      required: [id, source, status, uploadedAt]
      properties:
        id:
          type: integer
        source:
          type: string
          const: voice-intro
        status:
          type: string
          enum: [pending, complete]
          description: >-
            `pending` while the read is being written, `complete` once the
            deterministic or Claude read is stored.
        uploadedAt:
          type: string
          format: date-time

    ReceiptEntry:
      type: object
      required: [subject, receivedAt]
      properties:
        sender:
          type: [string, 'null']
          description: The sender shown on the confirmation, if known. Never the body.
        subject:
          type: string
          description: The subject line of the confirmation. Never the body.
        receivedAt:
          type: string
          format: date-time
          description: When the confirmation was received.

    ReceiptInputEntry:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
          description: The subject line of the confirmation. The body is never accepted.
        sender:
          type: string
          maxLength: 200
          description: Optional sender shown on the confirmation.
        receivedAt:
          type: string
          format: date-time
          description: Optional time the confirmation was received; defaults to now.

    AddReceiptsInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ReceiptInputEntry'

    ReceiptsInbox:
      type: object
      required: [handle, address, count, recent]
      properties:
        handle:
          type: [string, 'null']
          description: The user's forwarding handle, or null before activation.
        address:
          type: [string, 'null']
          description: The full forwarding address, or null before activation.
        count:
          type: integer
          description: Running count of confirmations captured. Drives the receipts lane.
        recent:
          type: array
          description: Capped, most-recent confirmations (headers only, never bodies).
          items:
            $ref: '#/components/schemas/ReceiptEntry'

    CreateQuizResultInput:
      type: object
      required: [slug, answers]
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          description: A stable slug from the server's canonical Quiz Lab catalog.
        answers:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: integer
            minimum: 0
            maximum: 20
          description: One zero-based option index per canonical quiz question. Used for server scoring and never stored.

    CreateQuizResultResult:
      type: object
      required: [id, slug, archetypeKey, archetypeName, dimensions, distinctQuizzes, status, uploadedAt]
      properties:
        id:
          type: integer
        slug:
          type: string
          description: The quiz slug this result was stored for.
        archetypeKey:
          type: string
          description: The server-scored canonical archetype key.
        archetypeName:
          type: string
          description: The server-derived canonical archetype name.
        dimensions:
          type: array
          items:
            type: string
          description: Canonical dimensions informed by this quiz.
        distinctQuizzes:
          type: integer
          description: >-
            How many distinct quizzes the owner has now completed, after deduping
            retakes of the same quiz. This is the count that fills the quiz lane.
        status:
          type: string
          const: complete
        uploadedAt:
          type: string
          format: date-time

    CareDialectDistribution:
      type: object
      description: >-
        Normalized weight per dialect, keyed by the stable dialect key. Values sum
        to ~1 across the six dialects; all six keys are present, zero when unused.
        Derived only, never raw answers.
      additionalProperties:
        type: number

    CareDialectProfile:
      type: object
      description: >-
        A user's Care Dialect profile. The give/receive distributions and top keys
        are server-scored from the quiz; the self picks are what the user guessed.
        When no tested data exists the distributions are all-zero and the top keys
        are null. `isDemo` flags the anon demo example, which never reflects a real
        person.
      required:
        - hasProfile
        - isDemo
        - selfGive
        - selfReceive
        - testedGiveDistribution
        - testedGiveTop
        - testedReceiveDistribution
        - testedReceiveTop
        - comparison
        - narrative
        - updatedAt
      properties:
        hasProfile:
          type: boolean
          description: True when the user has completed the quiz and tested data exists.
        isDemo:
          type: boolean
          description: True when this is the signed-out demo example, not real data.
        selfGive:
          type: ["string", "null"]
          enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence, null]
          description: The dialect the user guessed they primarily give.
        selfReceive:
          type: ["string", "null"]
          enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence, null]
          description: The dialect the user guessed they most want to receive.
        testedGiveDistribution:
          $ref: '#/components/schemas/CareDialectDistribution'
        testedGiveTop:
          type: ["string", "null"]
          enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence, null]
          description: The top scored give dialect, or null when untested.
        testedReceiveDistribution:
          $ref: '#/components/schemas/CareDialectDistribution'
        testedReceiveTop:
          type: ["string", "null"]
          enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence, null]
          description: The top scored receive dialect, or null when untested.
        comparison:
          $ref: '#/components/schemas/CareDialectComparison'
        narrative:
          type: ["string", "null"]
          description: >-
            Optional Claude-enhanced reflection layered on the deterministic
            comparison when the deep AI lane is on. Null when the deterministic
            baseline is used.
        updatedAt:
          type: ["string", "null"]
          format: date-time

    ConnectorStatus:
      type: object
      description: >-
        One data connector's product state. Only lifecycle and derived counts
        are exposed here, never raw third-party content. `status` is `available`
        before a live connection exists, then `connected` / `error` /
        `disconnected`. `derivedCount` is the derived signal the connector
        currently contributes (e.g. calendar events read for rhythm), never the
        events themselves.
      required:
        - provider
        - laneId
        - label
        - status
        - live
        - founderOnly
        - configured
        - derivedCount
        - lastSyncAt
        - lastSuccessAt
        - lastErrorCode
        - description
      properties:
        provider:
          type: string
          enum: [google-calendar, spotify, instagram-oauth, strava, fitbit, exist, oura, trakt, github, reddit, discord]
          description: Stable provider key.
        laneId:
          type: string
          description: The readiness lane this connector feeds.
        label:
          type: string
          description: Human label for the connector.
        status:
          type: string
          enum: [available, connected, error, disconnected]
          description: Lifecycle of the live connection.
        live:
          type: boolean
          description: True when a live connection currently holds derived signal.
        founderOnly:
          type: boolean
          description: True when the live connect/sync/disconnect controls are founder-gated.
        configured:
          type: boolean
          description: >-
            True when the connector's credentials are configured on the server
            so a user can actually start a connection. False means the provider
            is registered but not yet configured, and connect attempts return 503.
        derivedCount:
          type: ["integer", "null"]
          description: >-
            Derived signal count this connector currently contributes (e.g.
            calendar events), never raw content. Null when not applicable.
        lastSyncAt:
          type: ["string", "null"]
          format: date-time
          description: ISO timestamp of the last sync attempt.
        lastSuccessAt:
          type: ["string", "null"]
          format: date-time
          description: ISO timestamp of the last successful sync.
        lastErrorCode:
          type: ["string", "null"]
          description: Machine-readable code for the last error, null when healthy.
        description:
          type: string
          description: One-line summary of what this connector returns.

    ConnectorsStatusResponse:
      type: object
      description: >-
        The signed-in user's data connectors and their live status. `isDemo`
        flags the signed-out demo example, which never reflects a real account.
      required:
        - generatedAt
        - isDemo
        - connectors
      properties:
        generatedAt:
          type: string
          format: date-time
          description: ISO timestamp the status was generated.
        isDemo:
          type: boolean
          description: True when this is the anon demo, not a real account's connectors.
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorStatus'

    CareDialectComparison:
      type: object
      description: >-
        Deterministic self-vs-tested read. giveMatch / receiveMatch are null when
        either the self pick or the tested top for that axis is missing.
      required: [giveMatch, receiveMatch, alignment, insight]
      properties:
        giveMatch:
          type: ["boolean", "null"]
        receiveMatch:
          type: ["boolean", "null"]
        alignment:
          type: string
          enum: [aligned, partial, surprising, unknown]
        insight:
          type: string

    SaveCareDialectInput:
      type: object
      description: >-
        The user's self picks plus per-answer dialect choices for each axis.
        Scoring is server-side; the server tallies these into distributions and
        stores only the derived result.
      required: [giveAnswers, receiveAnswers]
      properties:
        selfGive:
          type: ["string", "null"]
          enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence, null]
        selfReceive:
          type: ["string", "null"]
          enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence, null]
        giveAnswers:
          type: array
          minItems: 1
          maxItems: 30
          description: Per-answer chosen dialect for the give axis.
          items:
            type: string
            enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence]
        receiveAnswers:
          type: array
          minItems: 1
          maxItems: 30
          description: Per-answer chosen dialect for the receive axis.
          items:
            type: string
            enum: [spokenWarmth, helpingHands, thoughtfulTokens, undividedTime, closeContact, steadyPresence]

    CompassReadInput:
      type: object
      required: [connectionStyle, patterns, deterministicResult]
      properties:
        connectionStyle:
          type: string
          minLength: 1
          maxLength: 200
          description: The connection-style label the user picked.
        patterns:
          type: array
          maxItems: 20
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 200
        notes:
          type: [string, "null"]
          maxLength: 2000
        deterministicResult:
          type: object
          additionalProperties: true
          description: The deterministic compass output shown to the user.
        aiResult:
          type: [object, "null"]
          additionalProperties: true
          description: The AI-enhanced compass output when present, otherwise null.

    CompassRead:
      type: object
      required: [id, connectionStyle, patterns, deterministicResult, mode, createdAt]
      properties:
        id:
          type: integer
        connectionStyle:
          type: string
        patterns:
          type: array
          items:
            type: string
        notes:
          type: [string, "null"]
        deterministicResult:
          type: object
          additionalProperties: true
        aiResult:
          type: [object, "null"]
          additionalProperties: true
        mode:
          type: string
          enum: [live, fallback, setup-needed]
        createdAt:
          type: string
          format: date-time

    CompassReadList:
      type: object
      required: [reads]
      properties:
        reads:
          type: array
          items:
            $ref: "#/components/schemas/CompassRead"

    CompassNextSignal:
      type: object
      required: [label, detail, href, points]
      properties:
        label:
          type: string
        detail:
          type: string
        href:
          type: string
        points:
          type: integer

    CompassSignalLayerBlock:
      type: object
      required: [headline, lines]
      properties:
        headline:
          type: string
        lines:
          type: array
          items:
            type: string

    CompassMovement:
      type: object
      required: [previousScore, currentScore, delta, newSignals, note]
      properties:
        previousScore:
          type: integer
        currentScore:
          type: integer
        delta:
          type: integer
        lastReadAt:
          type: ["string", "null"]
          format: date-time
        newSignals:
          type: array
          items:
            type: string
        note:
          type: string

    CompassMirrorTieIn:
      type: object
      required: [href, line]
      properties:
        href:
          type: string
        line:
          type: string

    CompassSignalContext:
      type: object
      required: [available]
      description: |
        Aggregate, derived signal context for the Compass so each read can evolve
        with the user's growing readiness and surface movement over time. Anonymous
        callers receive `{ available: false }`. Only derived coverage is ever
        included, never raw content or PII.
      properties:
        available:
          type: boolean
        readinessScore:
          type: integer
        stage:
          type: string
        stageLabel:
          type: string
        activeLaneCount:
          type: integer
        totalLaneCount:
          type: integer
        signalLayer:
          $ref: "#/components/schemas/CompassSignalLayerBlock"
        activeSignals:
          type: array
          items:
            type: string
        nextSignal:
          oneOf:
            - $ref: "#/components/schemas/CompassNextSignal"
            - type: "null"
        mirror:
          $ref: "#/components/schemas/CompassMirrorTieIn"
        movement:
          oneOf:
            - $ref: "#/components/schemas/CompassMovement"
            - type: "null"

    PhotoLabPhotoInput:
      type: object
      required: [id, shotType]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 120
          description: Caller-assigned id so the ranking maps back to the photo.
        shotType:
          type: string
          enum: [solo_face, full_body, activity, group, candid, other]
          description: |
            What kind of shot this is, declared by the member. Drives the
            deterministic ranking. Composition only, never appearance.
        wellLit:
          type: [boolean, "null"]
        genuineExpression:
          type: [boolean, "null"]
        imageBase64:
          type: [string, "null"]
          description: |
            Optional base64 image, used only for the opt-in Claude vision pass.
            May include a data URL prefix; the server strips it. Read in the
            moment and never stored. Omit to keep the request deterministic-only.
        imageMediaType:
          type: [string, "null"]
          description: MIME type of the image (e.g. "image/png") for the vision call.

    PhotoLabRankInput:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/PhotoLabPhotoInput"
        datingGoal:
          type: [string, "null"]
        sourceApp:
          type: [string, "null"]
          description: Which dating app the photos are for (e.g. "Hinge").

    PhotoLabRankedPhoto:
      type: object
      required: [id, rank, score, role, isLead, notes]
      properties:
        id:
          type: string
        rank:
          type: integer
        score:
          type: integer
        role:
          type: string
          description: Recommended slot for this shot (e.g. "Lead shot").
        isLead:
          type: boolean
        notes:
          type: array
          items:
            type: string

    PhotoLabChecklistItem:
      type: object
      required: [category, status, advice]
      properties:
        category:
          type: string
        status:
          type: string
          enum: [good, needs_work, missing]
        advice:
          type: string

    PhotoLabVisionItem:
      type: object
      required: [id, assessment, reason]
      properties:
        id:
          type: string
        assessment:
          type: string
          enum: [strong, okay, needs_work]
        reason:
          type: string

    PhotoLabVisionAnalysis:
      type: object
      required: [summary, photos]
      description: |
        Opt-in Claude vision pass. Present only when the deep AI lane is on, the
        cap allows it, and the call succeeded. The images are read in the moment
        and never stored.
      properties:
        summary:
          type: string
        leadShotId:
          type: [string, "null"]
          description: The vision pass's lead-shot pick, mapped to an input id.
        leadShotReason:
          type: [string, "null"]
        photos:
          type: array
          items:
            $ref: "#/components/schemas/PhotoLabVisionItem"

    PhotoLabNextSignal:
      type: object
      required: [label, detail, href]
      properties:
        label:
          type: string
        detail:
          type: string
        href:
          type: string
        points:
          type: integer

    PhotoLabMirrorTieIn:
      type: object
      required: [href, line]
      properties:
        href:
          type: string
        line:
          type: string

    PhotoLabRankResult:
      type: object
      required: [leadShotId, leadShotRationale, summary, ranked, checklist, visionMode]
      description: |
        Deterministic ranking plus an optional opt-in vision layer and, for
        signed-in members, a tie back to Your Mirror and the next best signal.
      properties:
        leadShotId:
          type: string
          description: Id of the recommended lead shot. Empty only when no photos were sent.
        leadShotRationale:
          type: string
        summary:
          type: string
        ranked:
          type: array
          items:
            $ref: "#/components/schemas/PhotoLabRankedPhoto"
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/PhotoLabChecklistItem"
        visionMode:
          type: string
          enum: [live, fallback]
          description: Whether the opt-in Claude vision pass actually ran.
        visionFallbackReason:
          type: [string, "null"]
          description: |
            Why the vision pass did not run (e.g. consent_required,
            daily_cap_exceeded, no_client). Null when it ran or was not requested.
        visionAnalysis:
          oneOf:
            - $ref: "#/components/schemas/PhotoLabVisionAnalysis"
            - type: "null"
        nextSignal:
          oneOf:
            - $ref: "#/components/schemas/PhotoLabNextSignal"
            - type: "null"
        mirror:
          oneOf:
            - $ref: "#/components/schemas/PhotoLabMirrorTieIn"
            - type: "null"

    PhotoLabRunInputSnapshot:
      type: object
      required: [photos]
      description: |
        Sanitized input provenance. It never includes raw image bytes, data URLs,
        image MIME metadata, or a grant for matching use.
      properties:
        photos:
          type: array
          items:
            type: object
            required: [id, shotType]
            properties:
              id:
                type: string
              shotType:
                type: string
                enum: [solo_face, full_body, activity, group, candid, other]
              wellLit:
                type: [boolean, "null"]
              genuineExpression:
                type: [boolean, "null"]
        datingGoal:
          type: [string, "null"]
        sourceApp:
          type: [string, "null"]

    PhotoLabRun:
      type: object
      required: [id, sourcePhotoIds, inputSnapshot, result, createdAt]
      properties:
        id:
          type: integer
        sourcePhotoIds:
          type: array
          items:
            type: integer
        inputSnapshot:
          $ref: "#/components/schemas/PhotoLabRunInputSnapshot"
        result:
          $ref: "#/components/schemas/PhotoLabRankResult"
        createdAt:
          type: string
          format: date-time

    PhotoLabRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/PhotoLabRun"

    DeletePhotoLabRunResult:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
          const: true
        id:
          type: integer

    CompassScreenshotExtractResult:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The raw OCR-extracted text from the uploaded screenshot.

    CalendarImportBody:
      type: object
      required: [icsContent]
      properties:
        icsContent:
          type: string
          description: The full text contents of a .ics calendar file.
          minLength: 1
          maxLength: 2000000

    ImportSource:
      type: object
      required: [id, source, status, permissions, uploadedAt]
      properties:
        id:
          type: integer
        source:
          type: string
          description: Which source app the export came from.
        status:
          type: string
          description: Lifecycle state. One of pending, complete, fallback, parsing, failed.
        originalFilename:
          type: [string, "null"]
        parsedSummary:
          type: [object, "null"]
          additionalProperties: true
          description: |
            Structured summary derived from the upload. Shape varies per
            source. For Hinge imports it includes a `counts` object, a
            `derivedStats` object, and optionally an `aiRead` object when
            the Anthropic enrichment succeeded, or `aiError` when it did
            not.
        uploadedAt:
          type: string
          format: date-time
        processedAt:
          type: [string, "null"]
          format: date-time
        permissions:
          $ref: '#/components/schemas/ImportPermissions'

    ImportPermissions:
      type: object
      required: [storage, echoUse, learningConfirmed, matchingUse]
      properties:
        storage:
          type: string
          const: saved
          description: The source row is stored. Delete the import to revoke storage.
        echoUse:
          type: boolean
          description: Echo may process and use this source for coaching.
        learningConfirmed:
          type: boolean
          description: The member accepted proposed learning from this source into My MatchLab.
        matchingUse:
          type: boolean
          description: Derived signal from this source may be used for matching.

    ImportPermissionPatch:
      type: object
      properties:
        echoUse:
          type: boolean
        learningConfirmed:
          type: boolean
        matchingUse:
          type: boolean
      description: Supply at least one field. Omitted fields remain unchanged.

    ImportSourceList:
      type: object
      required: [imports]
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/ImportSource"

    DeleteImportResult:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
          const: true
        id:
          type: integer

    AskFounderCopilotInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 4
          maxLength: 2000
          description: Free-form strategic question for Echo.
        contextHint:
          type: string
          maxLength: 1000
          description: Optional one-line context the founder wants Echo to consider (a metric, a moment, a specific signup).

    AskFounderCopilotResult:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          description: Echo's reply, voiced per the persona rules.
        fallback:
          type: boolean
          description: True when the model was unavailable and the answer was assembled from the playbook deterministically.
