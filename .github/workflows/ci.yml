name: MatchLab CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matchlab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PNPM_VERSION: 11.7.0

jobs:
  quality:
    name: Typecheck, lint, web, and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out MatchLab
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check schema drift
        run: pnpm --filter @workspace/db run check-schema-drift

      - name: Check Echo voice
        run: pnpm --filter @workspace/nldc exec vitest run src/lib/voiceLint.test.ts

      - name: Run web tests
        run: pnpm --filter @workspace/nldc run test

      - name: Build web app
        run: pnpm --filter @workspace/nldc run build

      - name: Export web preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-web-preview
          path: artifacts/nldc/dist/public
          if-no-files-found: error
          retention-days: 7

  api:
    name: API and database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matchlab_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/matchlab_test
    steps:
      - name: Check out MatchLab
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test database
        run: pnpm --filter @workspace/db run push-force

      - name: Run API tests
        run: pnpm --filter @workspace/api-server run test

  e2e:
    name: Browser journey
    runs-on: ubuntu-latest
    needs:
      - quality
      - api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matchlab_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/matchlab_e2e
      E2E_BASE_URL: http://localhost:21668
      APP_ORIGINS: http://localhost:21668
      SESSION_SECRET: matchlab-ci-session-secret
    steps:
      - name: Check out MatchLab
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: Prepare browser-test database
        run: pnpm --filter @workspace/db run push-force

      - name: Run browser tests
        run: pnpm -C e2e exec playwright test --project=chromium

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
